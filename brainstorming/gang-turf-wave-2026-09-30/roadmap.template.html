<title>Gang &amp; Turf Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one scanning column; sticky section nav; waves as stacked lane tables; the map panel is a Minecraft chat window. */
:root {
  --bg: #eef0ed; --surface: #ffffff; --sunk: #e4e7e3; --ink: #15181c; --muted: #58606a; --line: #d3d8d2;
  --accent: #b3321f; --accent-ink: #ffffff; --ally: #2c7a4b; --warn: #9a6500; --bad: #b3261e; --good: #2c7a4b;
  --m-haiku: #2f6f7a; --m-sonnet: #4a4fb0; --m-opus: #7b3fa0; --m-fable: #9a6500;
  --chat-bg: #16171a; --chat-ink: #e6e6e6; --chat-dim: #8b8b8b;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101316; --surface: #181d22; --sunk: #0c0f12; --ink: #e7eaed; --muted: #9aa3ad; --line: #2a3139;
    --accent: #f06a50; --accent-ink: #14100f; --ally: #5cc48b; --warn: #e0a93a; --bad: #f2786e; --good: #5cc48b;
    --m-haiku: #6cc0cc; --m-sonnet: #9aa0ff; --m-opus: #c794ea; --m-fable: #e7b454;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101316; --surface: #181d22; --sunk: #0c0f12; --ink: #e7eaed; --muted: #9aa3ad; --line: #2a3139;
  --accent: #f06a50; --accent-ink: #14100f; --ally: #5cc48b; --warn: #e0a93a; --bad: #f2786e; --good: #5cc48b;
  --m-haiku: #6cc0cc; --m-sonnet: #9aa0ff; --m-opus: #c794ea; --m-fable: #e7b454;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.12; }
h1 { font-size: clamp(2rem, 5vw, 3.1rem); font-stretch: 78%; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.55rem; font-stretch: 85%; font-weight: 750; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
code, .mono { font-family: var(--f-mono); font-size: 0.86em; }
.eyebrow { font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
section { padding-top: 40px; scroll-margin-top: 64px; display: grid; gap: 16px; }
.lede { max-width: 68ch; font-size: 1.06rem; }

nav.toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
nav.toc .in { max-width: 1080px; margin: 0 auto; padding-inline: 20px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.toc a { font: 600 0.82rem var(--f-body); color: var(--muted); text-decoration: none; padding: 12px 10px; white-space: nowrap; border-bottom: 2px solid transparent; }
nav.toc a:hover, nav.toc a:focus-visible { color: var(--ink); border-bottom-color: var(--accent); outline: none; }

header.top { display: grid; gap: 14px; padding-top: 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font: 600 0.76rem var(--f-mono); padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--surface); }
.tag b { color: var(--ink); font-weight: 600; }

.promise { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.promise li { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--r); padding: 10px 12px; font-weight: 500; }
.assume { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 4px; max-width: 80ch; }

/* map */
.mapgrid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .mapgrid { grid-template-columns: 1fr; } }
.chat { background: var(--chat-bg); color: var(--chat-ink); border-radius: var(--r); padding: 14px 16px; overflow-x: auto; }
.chat .bar { font: 600 0.72rem var(--f-mono); color: var(--chat-dim); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
.chat pre { margin: 0; font: 13px/1.35 var(--f-mono); white-space: pre; }
.mapfig { margin: 0; display: grid; gap: 8px; min-width: 0; }
.mapfig figcaption { font-size: 0.86rem; }
.subtitle { font: 600 1.15rem var(--f-display); font-stretch: 90%; color: var(--muted); }
.layers { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.layer { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 4px; }
.layer .row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.layer .id { font: 600 0.78rem var(--f-mono); color: var(--accent); }
.rules { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

/* pillars */
.pillars { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.pillar { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.pillar .why { color: var(--muted); font-size: 0.93rem; }
.feat { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; min-width: 0; }
.feat .hd { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.feat .fid { font: 600 0.74rem var(--f-mono); color: var(--muted); }
details { min-width: 0; }
details summary { cursor: pointer; font-size: 0.84rem; color: var(--muted); }
details summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.kv { display: grid; gap: 4px; font-size: 0.88rem; margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font: 600 0.72rem var(--f-mono); padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.wave { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.chip.docket { color: var(--warn); }

/* model chips */
.model { font: 700 0.72rem var(--f-mono); padding: 2px 8px; border-radius: 999px; color: var(--surface); white-space: nowrap; text-transform: lowercase; }
.model.haiku { background: var(--m-haiku); } .model.sonnet { background: var(--m-sonnet); }
.model.opus { background: var(--m-opus); } .model.fable { background: var(--m-fable); }
.legend { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; font-size: 0.86rem; }
.legend span.item { display: inline-flex; gap: 6px; align-items: center; }

/* waves */
.waves { display: grid; gap: 18px; }
.wave { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.wave > .whd { padding: 14px 16px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); }
.wave .wtitle { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.wave .wid { font: 800 1.2rem var(--f-display); font-stretch: 80%; color: var(--accent); }
.wave .deps { font-size: 0.84rem; color: var(--muted); }
.lanes { display: grid; }
.lane { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 4px 14px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: start; }
.lane:first-child { border-top: 0; }
.lane .lid { font: 600 0.8rem var(--f-mono); color: var(--muted); padding-top: 2px; }
.lane .body { display: grid; gap: 4px; min-width: 0; }
.lane .side { display: grid; gap: 6px; justify-items: end; }
.par { font: 600 0.7rem var(--f-mono); color: var(--muted); }
.status { font: 700 0.7rem var(--f-mono); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.status.running { color: var(--warn); border-color: var(--warn); }
.status.done { color: var(--good); border-color: var(--good); }
.status.blocked { color: var(--bad); border-color: var(--bad); }
.gate { padding: 10px 16px; background: var(--sunk); font-size: 0.88rem; border-top: 1px solid var(--line); }
@media (max-width: 640px) {
  .lane { grid-template-columns: 1fr; }
  .lane .side { justify-items: start; grid-auto-flow: column; justify-content: start; }
}

/* tables */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
thead th { border-top: 0; font: 600 0.74rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--sunk); }
td.nowrap { white-space: nowrap; }

/* decisions */
.decisions { display: grid; gap: 14px; }
.dec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.dec .dhd { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; justify-content: space-between; }
.dec .did { font: 800 1.05rem var(--f-display); color: var(--accent); }
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; }
.opt:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.opt input { margin-top: 4px; accent-color: var(--accent); }
.opt.rec { background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
.opt .ol { font-weight: 600; }
.opt .od { color: var(--muted); font-size: 0.88rem; }
.opt .rtag { font: 700 0.66rem var(--f-mono); color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-left: 6px; }
.dec textarea { width: 100%; min-height: 56px; font: 0.9rem var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; resize: vertical; }
.dec .foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 0.84rem; color: var(--muted); }
button { font: 600 0.84rem var(--f-body); background: var(--ink); color: var(--bg); border: 0; border-radius: var(--r); padding: 7px 12px; cursor: pointer; }
button:focus-visible, .opt:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
button[disabled] { opacity: 0.5; cursor: default; }
.saved { color: var(--good); font-weight: 600; }
.dbnote { font-size: 0.86rem; color: var(--muted); }

.stats { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; display: grid; }
.stat b { font: 800 1.4rem var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.8rem; color: var(--muted); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 0.84rem; color: var(--muted); display: grid; gap: 4px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
html { scroll-behavior: smooth; }
</style>

<nav class="toc" aria-label="Sections"><div class="in">
  <a href="#overview">Overview</a><a href="#map">Map</a><a href="#pillars">Features</a><a href="#waves">Waves</a>
  <a href="#decisions">Decisions</a><a href="#parity">Gangs+ parity</a><a href="#cnc">Cops-n-crooks ideas</a><a href="#docket">Docket</a><a href="#risks">Risks</a><a href="#orchestration">Orchestration</a>
</div></nav>

<div class="wrap" id="app"></div>

<script type="application/json" id="roadmap-data">__ROADMAP_JSON__</script>
<script>
(function () {
  "use strict";
  var R;
  try { R = JSON.parse(document.getElementById("roadmap-data").textContent); } catch (e) { R = {}; }
  var app = document.getElementById("app");
  var arr = function (x) { return Array.isArray(x) ? x : []; };
  var str = function (x) { return x == null ? "" : String(x); };

  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (attrs[k] == null || attrs[k] === false) continue;
      if (k === "class") el.className = attrs[k];
      else if (k === "text") el.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    }
    arr(kids).forEach(function (c) {
      if (c == null || c === false) return;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return el;
  }
  function modelChip(m) {
    var k = str(m).toLowerCase().replace(/[^a-z]/g, "");
    var known = { haiku: 1, sonnet: 1, opus: 1, fable: 1 };
    return h("span", { class: "model " + (known[k] ? k : ""), text: k || "?" });
  }
  function chips(list, cls) {
    list = arr(list).filter(Boolean);
    if (!list.length) return null;
    return h("div", { class: "chips" }, list.map(function (x) { return h("span", { class: "chip " + (cls || ""), text: str(x) }); }));
  }
  function kv(label, value) {
    if (!value || (Array.isArray(value) && !value.length)) return null;
    return h("div", null, [h("span", { class: "eyebrow", text: label + " " }), Array.isArray(value) ? value.join(", ") : str(value)]);
  }

  // Minecraft & colour codes in the sample map frame.
  var MC = { "0": "#000000", "1": "#0000AA", "2": "#00AA00", "3": "#00AAAA", "4": "#AA0000", "5": "#AA00AA", "6": "#FFAA00", "7": "#AAAAAA", "8": "#555555", "9": "#5555FF", "a": "#55FF55", "b": "#55FFFF", "c": "#FF5555", "d": "#FF55FF", "e": "#FFFF55", "f": "#FFFFFF" };
  function mcFrame(text) {
    var pre = h("pre");
    var parts = str(text).split(/(&[0-9a-fk-or])/i);
    var color = null, bold = false, italic = false, under = false;
    parts.forEach(function (p) {
      var m = /^&([0-9a-fk-or])$/i.exec(p);
      if (m) {
        var c = m[1].toLowerCase();
        if (MC[c]) { color = MC[c]; bold = italic = under = false; }
        else if (c === "l") bold = true;
        else if (c === "o") italic = true;
        else if (c === "n") under = true;
        else if (c === "r") { color = null; bold = italic = under = false; }
        return;
      }
      if (!p) return;
      var s = h("span", { text: p });
      if (color) s.style.color = color;
      if (bold) s.style.fontWeight = "600";
      if (italic) s.style.fontStyle = "italic";
      if (under) s.style.textDecoration = "underline";
      pre.appendChild(s);
    });
    return pre;
  }

  // ---------- header ----------
  var T = R.target || {};
  app.appendChild(h("header", { class: "top", id: "overview" }, [
    h("div", { class: "eyebrow", text: "Gangland Warfare · planning wave 2026-09-30" }),
    h("h1", { text: "Gang & Turf Roadmap" }),
    str(R.title).indexOf(":") > -1 ? h("p", { class: "subtitle", text: str(R.title).split(":").slice(1).join(":").trim() }) : null,
    h("div", { class: "meta" }, [
      T.revision ? h("span", { class: "tag" }, ["target ", h("b", { text: str(T.revision) })]) : null,
      T.branch ? h("span", { class: "tag", title: str(T.branch) }, ["branch ", h("b", { text: str(T.branch).split(" (")[0] })]) : null,
      T.keystone ? h("span", { class: "tag", title: str(T.keystone) }, ["keystone ", h("b", { text: str(T.keystone).split(";")[0] })]) : null
    ]),
    R.summary ? h("p", { class: "lede", text: str(R.summary) }) : null,
    arr(T.depends_on).length ? h("p", { class: "muted" }, ["Depends on: " + arr(T.depends_on).join(" · ")]) : null
  ]));
  if (arr(R.player_promise).length) {
    app.appendChild(h("section", null, [
      h("h2", { text: "What players get" }),
      h("ul", { class: "promise" }, arr(R.player_promise).map(function (p) { return h("li", { text: str(p) }); }))
    ]));
  }
  if (arr(R.assumptions).length) {
    app.appendChild(h("section", null, [
      h("h3", { text: "Assumptions" }),
      h("ul", { class: "assume" }, arr(R.assumptions).map(function (a) { return h("li", { text: str(a) }); }))
    ]));
  }

  // ---------- map ----------
  var M = R.map || {};
  app.appendChild(h("section", { id: "map" }, [
    h("h2", { text: "The map" }),
    h("div", { class: "mapgrid" }, [
      h("figure", { class: "mapfig" }, [
        h("div", { class: "chat", role: "img", "aria-label": "Sample chat map frame" }, [
          h("div", { class: "bar", text: "/glw map · sample frame" }),
          mcFrame(M.sample_colored || M.sample_ascii)
        ]),
        M.sample_caption ? h("figcaption", { class: "muted", text: str(M.sample_caption) }) : null
      ]),
      h("ol", { class: "layers" }, arr(M.layers).map(function (L) {
        return h("li", { class: "layer" }, [
          h("div", { class: "row" }, [h("span", { class: "id", text: str(L.id) }), h("h3", { text: str(L.name) }),
            L.surface ? h("span", { class: "chip", text: str(L.surface) }) : null,
            L.wave ? h("span", { class: "chip wave", text: str(L.wave) }) : null]),
          L.description ? h("p", { class: "muted", text: str(L.description) }) : null,
          arr(L.commands).length ? h("div", { class: "chips" }, arr(L.commands).map(function (c) { return h("code", { text: str(c) }); })) : null
        ]);
      }))
    ]),
    arr(M.render_rules).length ? h("details", null, [h("summary", { text: "Render rules (" + arr(M.render_rules).length + ")" }),
      h("ul", { class: "rules" }, arr(M.render_rules).map(function (r) { return h("li", { text: str(r) }); }))]) : null
  ]));

  // ---------- pillars ----------
  app.appendChild(h("section", { id: "pillars" }, [
    h("h2", { text: "Features by pillar" }),
    h("div", { class: "pillars" }, arr(R.pillars).map(function (P) {
      return h("article", { class: "pillar" }, [
        h("div", null, [h("div", { class: "eyebrow", text: str(P.id) }), h("h3", { text: str(P.name) })]),
        P.why ? h("p", { class: "why", text: str(P.why) }) : null
      ].concat(arr(P.features).map(function (F) {
        return h("div", { class: "feat" }, [
          h("div", { class: "hd" }, [h("span", { class: "fid", text: str(F.id) }), h("strong", { text: str(F.name) }),
            F.wave ? h("span", { class: "chip wave", text: str(F.wave) }) : null]),
          F.player_view ? h("p", { text: str(F.player_view) }) : null,
          (F.mechanics || arr(F.code).length || arr(F.docket).length) ? h("details", null, [
            h("summary", { text: "Mechanics and code" }),
            h("div", { class: "kv" }, [F.mechanics ? h("p", { text: str(F.mechanics) }) : null,
              chips(F.code), chips(F.docket, "docket")])
          ]) : null
        ]);
      })));
    }))
  ]));

  // ---------- waves ----------
  var laneStatusEls = {};
  var legend = h("div", { class: "legend" }, ["haiku", "sonnet", "opus", "fable"].map(function (m) {
    var role = arr((R.orchestration || {}).model_roles).filter(function (x) { return str(x.model).toLowerCase() === m; })[0];
    return h("span", { class: "item" }, [modelChip(m), role ? h("span", { class: "muted", text: str(role.used_for) }) : null]);
  }));
  app.appendChild(h("section", { id: "waves" }, [
    h("h2", { text: "Waves and lanes" }),
    h("p", { class: "muted", text: "Lanes marked parallel run at the same time in their own git worktree. Lane status is live: it updates as agents finish work." }),
    legend,
    h("div", { class: "waves" }, arr(R.waves).map(function (W) {
      return h("article", { class: "wave", id: "wave-" + str(W.id) }, [
        h("div", { class: "whd" }, [
          h("div", { class: "wtitle" }, [h("span", { class: "wid", text: str(W.id) }), h("h3", { text: str(W.name) }),
            W.branch ? h("span", { class: "chip", text: str(W.branch) }) : null]),
          W.goal ? h("p", { text: str(W.goal) }) : null,
          arr(W.depends_on).length ? h("p", { class: "deps", text: "After: " + arr(W.depends_on).join(", ") }) : null
        ]),
        h("div", { class: "lanes" }, arr(W.lanes).map(function (L) {
          var st = h("span", { class: "status", text: "planned" });
          laneStatusEls[str(L.id)] = st;
          return h("div", { class: "lane" }, [
            h("div", { class: "lid", text: str(L.id) }),
            h("div", { class: "body" }, [
              h("strong", { text: str(L.name) }),
              L.scope ? h("p", { class: "muted", text: str(L.scope) }) : null,
              h("details", null, [h("summary", { text: "Modules, tests, exit" }), h("div", { class: "kv" }, [
                kv("modules", arr(L.modules)), kv("worktree", L.worktree), kv("tests", L.tests), kv("exit", L.exit),
                chips(L.docket, "docket")])])
            ]),
            h("div", { class: "side" }, [modelChip(L.model), h("span", { class: "par", text: (L.role ? str(L.role) + " · " : "") + (L.parallel ? "parallel" : "sequential") }), st])
          ]);
        })),
        W.gate ? h("div", { class: "gate" }, [h("span", { class: "eyebrow", text: "gate " }), str(W.gate)]) : null
      ]);
    }))
  ]));

  // ---------- decisions ----------
  var decUI = {};
  var dbNote = h("p", { class: "dbnote", text: "Loading saved answers…" });
  app.appendChild(h("section", { id: "decisions" }, [
    h("h2", { text: "Decisions for you" }),
    h("p", { class: "muted", text: "Pick an option and add a note if you like. Answers save to this page, and Claude reads them before the waves start." }),
    dbNote,
    h("div", { class: "decisions" }, arr(R.decisions).map(function (D) {
      var id = str(D.id);
      var name = "dec-" + id;
      var saved = h("span", { class: "saved", text: "" });
      var note = h("textarea", { id: "note-" + id, placeholder: "Note (optional)", "aria-label": "Note for " + id });
      var btn = h("button", { type: "button", text: "Save", disabled: true });
      var radios = [];
      var opts = h("div", { class: "opts", role: "radiogroup", "aria-label": str(D.question) }, arr(D.options).map(function (O) {
        var rid = name + "-" + str(O.key);
        var input = h("input", { type: "radio", name: name, id: rid, value: str(O.key), disabled: true });
        radios.push(input);
        var rec = str(O.key) === str(D.recommended);
        return h("label", { class: "opt" + (rec ? " rec" : ""), for: rid }, [input, h("div", null, [
          h("div", null, [h("span", { class: "ol", text: str(O.key) + ". " + str(O.label) }), rec ? h("span", { class: "rtag", text: "recommended" }) : null]),
          O.detail ? h("div", { class: "od", text: str(O.detail) }) : null])]);
      }));
      decUI[id] = { radios: radios, note: note, btn: btn, saved: saved };
      return h("article", { class: "dec", id: "d-" + id }, [
        h("div", { class: "dhd" }, [h("div", null, [h("span", { class: "did", text: id + " " }), h("strong", { text: str(D.question) })]),
          arr(D.blocks).length ? h("span", { class: "chip wave", text: "blocks " + arr(D.blocks).join(", ") }) : null]),
        opts,
        D.why ? h("p", { class: "muted" }, [h("span", { class: "eyebrow", text: "why " }), str(D.why)]) : null,
        note,
        h("div", { class: "foot" }, [btn, saved])
      ]);
    }))
  ]));

  // ---------- Gangs+ parity ----------
  if (arr(R.parity).length) {
    var counts = {};
    arr(R.parity).forEach(function (p) { var s = str(p.status_after_plan || p.status).toUpperCase(); counts[s] = (counts[s] || 0) + 1; });
    app.appendChild(h("section", { id: "parity" }, [
      h("h2", { text: "Gangs+ parity" }),
      h("p", { class: "muted", text: "Every feature of the Gangs+ plugin, plus a few from other gang plugins, and how Gangland delivers it." }),
      h("div", { class: "stats" }, Object.keys(counts).sort().map(function (k) {
        return h("div", { class: "stat" }, [h("b", { text: String(counts[k]) }), h("span", { text: k.toLowerCase() })]);
      })),
      h("div", { class: "tbl" }, [h("table", null, [
        h("thead", null, [h("tr", null, ["Id", "Feature", "Status", "Delivered by", "Lane"].map(function (t) { return h("th", { text: t }); }))]),
        h("tbody", null, arr(R.parity).map(function (p) {
          var s = str(p.status_after_plan || p.status);
          return h("tr", null, [h("td", { class: "mono nowrap", text: str(p.id) }), h("td", { text: str(p.feature) }),
            h("td", null, [h("span", { class: "status " + (s === "HAVE" ? "done" : s === "EXCLUDED" ? "blocked" : "running"), text: s.toLowerCase() })]),
            h("td", { text: str(p.delivered_by) }), h("td", { class: "mono nowrap", text: str(p.lane) })]);
        }))
      ])])
    ]));
  }

  // ---------- cops-n-crooks transfers ----------
  if (arr(R.cnc_transfers).length) {
    app.appendChild(h("section", { id: "cnc" }, [
      h("h2", { text: "Ideas carried over from cops-n-crooks" }),
      h("div", { class: "tbl" }, [h("table", null, [
        h("thead", null, [h("tr", null, ["Idea", "Source", "Applied as", "Rides on", "Wave"].map(function (t) { return h("th", { text: t }); }))]),
        h("tbody", null, arr(R.cnc_transfers).map(function (c) {
          return h("tr", null, [h("td", { text: str(c.idea) }), h("td", { class: "mono", text: str(c.source) }), h("td", { text: str(c.applied_as) }),
            h("td", { class: "mono", text: str(c.primitive) }), h("td", { class: "nowrap", text: str(c.wave) })]);
        }))
      ])])
    ]));
  }

  // ---------- docket ----------
  var K = R.docket || {};
  var assignedByWave = {};
  arr(K.assigned).forEach(function (a) { (assignedByWave[str(a.wave)] = assignedByWave[str(a.wave)] || []).push(str(a.id)); });
  app.appendChild(h("section", { id: "docket" }, [
    h("h2", { text: "Bug docket" }),
    h("p", { class: "muted", text: "Open gang (GR) and turf (TF) entries, checked against the current code and assigned to a wave or deferred." }),
    h("div", { class: "stats" }, [
      h("div", { class: "stat" }, [h("b", { text: String(arr(K.assigned).length) }), h("span", { text: "fixed in a wave" })]),
      h("div", { class: "stat" }, [h("b", { text: String(arr(K.deferred).length) }), h("span", { text: "deferred" })]),
      h("div", { class: "stat" }, [h("b", { text: String(arr(K.fixed_unrecorded).length) }), h("span", { text: "already fixed, not recorded" })]),
      h("div", { class: "stat" }, [h("b", { text: String(arr(K.obsolete).length) }), h("span", { text: "obsolete" })])
    ]),
    h("div", { class: "two" }, [
      h("div", { class: "card" }, [h("h3", { text: "Assigned by wave" })].concat(Object.keys(assignedByWave).sort().map(function (w) {
        return h("div", null, [h("span", { class: "chip wave", text: w }), " ", chips(assignedByWave[w], "docket")]);
      }))),
      h("div", { class: "card" }, [h("h3", { text: "Deferred" }), h("ul", { class: "plain" }, arr(K.deferred).map(function (d) {
        return h("li", null, [h("code", { text: str(d.id || d) }), d.why ? " " + str(d.why) : ""]);
      }))]),
      arr(K.fixed_unrecorded).length ? h("div", { class: "card" }, [h("h3", { text: "Already fixed, status not written" }), h("ul", { class: "plain" }, arr(K.fixed_unrecorded).map(function (d) {
        return h("li", null, [h("code", { text: str(d.id || d) }), d.evidence ? " " + str(d.evidence) : ""]);
      }))]) : null,
      arr(K.obsolete).length ? h("div", { class: "card" }, [h("h3", { text: "Obsolete" }), chips(arr(K.obsolete).map(function (d) { return str(d.id || d); }), "docket")]) : null
    ])
  ]));

  // ---------- risks + out of scope ----------
  app.appendChild(h("section", { id: "risks" }, [
    h("h2", { text: "Risks and limits" }),
    h("div", { class: "tbl" }, [h("table", null, [
      h("thead", null, [h("tr", null, [h("th", { text: "Risk" }), h("th", { text: "Mitigation" })])]),
      h("tbody", null, arr(R.risks).map(function (r) { return h("tr", null, [h("td", { text: str(r.risk) }), h("td", { text: str(r.mitigation) })]); }))
    ])]),
    arr(R.out_of_scope).length ? h("div", { class: "card" }, [h("h3", { text: "Out of scope" }),
      h("ul", { class: "plain" }, arr(R.out_of_scope).map(function (o) { return h("li", { text: str(o) }); }))]) : null
  ]));

  // ---------- orchestration ----------
  var O = R.orchestration || {};
  app.appendChild(h("section", { id: "orchestration" }, [
    h("h2", { text: "How the agents run it" }),
    h("div", { class: "two" }, [
      h("div", { class: "card" }, [h("h3", { text: "Model roles" }), h("div", { class: "opts" }, arr(O.model_roles).map(function (m) {
        return h("div", { class: "row", style: "display:flex;gap:10px;align-items:baseline" }, [modelChip(m.model), h("span", { text: str(m.used_for) })]);
      }))]),
      h("div", { class: "card" }, [h("h3", { text: "Rules" }), h("ul", { class: "plain" }, arr(O.rules).map(function (r) { return h("li", { text: str(r) }); }))])
    ])
  ]));

  app.appendChild(h("footer", null, [
    h("div", { text: "Sources: brainstorming/gang-turf-wave-2026-09-30/ (census, plans, reviews, PLAN.md, roadmap.json)." }),
    h("div", { text: "Planning only: no product code changed in this wave." })
  ]));

  // ---------- live data ----------
  if (!window.claude || typeof window.claude.use !== "function") { dbNote.textContent = "Answers can be saved when this page is opened on claude.ai."; return; }
  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (res) {
    var db = res[0], user = res[1];
    if (!db) { dbNote.textContent = "Saved answers are not available in this view."; return; }
    var canWrite = user ? user.canEdit() : Promise.resolve(null);
    canWrite.then(function (ok) {
      var writable = ok !== false;
      dbNote.textContent = writable ? "" : "View only: answers are shown but only the page owner or editors can change them.";
      Object.keys(decUI).forEach(function (id) {
        var ui = decUI[id];
        var busy = false, readOnly = !writable;
        function setEnabled() {
          ui.radios.forEach(function (r) { r.disabled = readOnly || busy; });
          ui.note.disabled = readOnly;
          ui.btn.disabled = readOnly || busy;
        }
        function current() { var c = ui.radios.filter(function (r) { return r.checked; })[0]; return c ? c.value : null; }
        function save() {
          if (busy || readOnly) return;
          busy = true; setEnabled(); ui.saved.textContent = "Saving…";
          db.collection("decisions").doc(id).set({ choice: current(), note: ui.note.value.slice(0, 2000), updatedAt: new Date().toISOString() })
            .then(function () { ui.saved.textContent = "Saved"; })
            .catch(function (e) {
              if (e && e.code === "invalid_argument") { readOnly = true; ui.saved.textContent = "Only the owner or editors can save."; }
              else ui.saved.textContent = "Not saved. Try again.";
            })
            .then(function () { busy = false; setEnabled(); });
        }
        ui.radios.forEach(function (r) { r.addEventListener("change", save); });
        ui.btn.addEventListener("click", save);
        ui.note.addEventListener("input", function () { ui.saved.textContent = ""; });
        setEnabled();
      });
    });
    db.collection("decisions").onSnapshot(function (snap) {
      snap.docs.forEach(function (d) {
        var ui = decUI[d.id]; if (!ui || !d.exists) return;
        var body = d.data() || {};
        ui.radios.forEach(function (r) { r.checked = r.value === body.choice; });
        if (document.activeElement !== ui.note) ui.note.value = str(body.note);
        if (body.updatedAt && !ui.saved.textContent) ui.saved.textContent = "Saved " + str(body.updatedAt).slice(0, 10);
      });
    }, function () { dbNote.textContent = "Saved answers could not be loaded."; });
    db.collection("lanes").onSnapshot(function (snap) {
      snap.docs.forEach(function (d) {
        var el = laneStatusEls[d.id]; if (!el || !d.exists) return;
        var s = str((d.data() || {}).status).toLowerCase() || "planned";
        el.textContent = s; el.className = "status " + s;
        var n = str((d.data() || {}).note); if (n) el.title = n;
      });
    }, function () {});
  });
})();
</script>

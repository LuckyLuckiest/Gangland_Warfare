#
# Each entry under Cops.Tiers defines a cop NPC tier, escalating in difficulty.
# Tiers are assigned to spawn points and determine NPC stats and equipment.
#
# Fields:
#   Display_Name:   The cop's rank, the %rank% in Cops.Names.Format (supports & color codes)
#   Health:         Max health in half-hearts (20.0 = 10 hearts)
#   Damage:         Melee damage dealt per hit
#   Speed:          Movement speed multiplier (1.0 = default walk speed)
#   Cuff_Radius:    Distance in blocks within which the cop can cuff a player
#   Can_Use_Weapons: Whether the cop draws from its Weapon_Pool instead of melee
#   Skip_Cuffing:   If true, the cop arrests the player instantly without a cuffing animation
#   Weapon_Pool:    List of items the cop may equip; one is chosen at random on spawn.
#                   Accepts vanilla materials (IRON_SWORD), custom weapons (weapon:<id>),
#                   or items with extra data (LEATHER_HELMET{color=blue})
#   Wearables:
#     Helmet:       Armor piece for the head slot; leave blank for none
#     Chestplate:   Armor piece for the chest slot; leave blank for none
#     Leggings:     Armor piece for the legs slot; leave blank for none
#     Boots:        Armor piece for the feet slot; leave blank for none
#   Difficulty:     Combat profile that scales aim error, reaction time, fire rate, and melee
#                   damage. One of EASY, NORMAL, HARD, DEADLY. Defaults to NORMAL when omitted.
#   Tactics:        Per-tier squad-tactics override, read over Cops.Tactics below (see its own comments).
#   Fire_Rate_Multiplier: Gun cadence as a fraction of the weapon's own (player) fire rate, on top of the
#                   Difficulty's fire rate. 1.0 = as fast as a player holding the gun; 0.1 = a tenth as often.
#                   Must be above 0. When omitted, 1 / settings.yml Cops.Behaviour.AI_Tick_Rate.
#                   The shipped 0.1 keeps the pre-0.12 time-to-kill: NPC guns used to advance one weapon tick
#                   per cop AI tick (AI_Tick_Rate: 10), i.e. a tenth of the weapon's rate. A vanilla BOW/CROSSBOW
#                   (no Bartizan weapon) counts from a 15-tick base, so 0.1 fires every 150 ticks at NORMAL (7.5 s),
#                   exactly as before.
# ============================================
Cops:
   # Melee band for every cop swing. The cooldown is settings.yml Cops.Behaviour.Attack_Cooldown_Ticks.
   Melee:
      # A swing lands only when the cop is at most this many blocks from the target (feet to feet).
      Reach: 3.0
      # Melee cops stop and surround here. Capped at each tier's Cuff_Radius - 0.5. Full damage inside this distance.
      Approach: 2.0
      # Melee damage varies by up to this fraction either way (0.15 = +/-15%).
      Damage_Spread: 0.15
      # Fraction of full damage a swing deals at the very edge of Reach (falls linearly from Approach).
      Edge_Damage: 0.7
   # Squad tactics defaults for every tier. A tier's own Tactics block overrides these key by key.
   Tactics:
      # false = 0.11 positioning only: shooters freeze in their firing band, no formation, no order/contact/reload
      # radio. Casualty/backup/dispatch radio and retreat stay on (Radio, Backup and Retreat have their own switches).
      Enabled: true
      # Degrees the squad's shooters spread over around the target (0-360). Cop-on-cop damage is cancelled, so cops
      # default to a wide horseshoe; melee tiers always surround.
      Formation_Arc: 270.0
      # Degrees a shooter side-steps along its ring at each reposition (0 = walk to its slot and stand).
      Strafe_Degrees: 15.0
      # Server ticks between a shooter's repositions (jittered +/-25%, minimum 20).
      Reposition_Ticks: 60
      # Extra aim error while the cop is walking (same unit as the Difficulty aim error).
      Moving_Aim_Error: 0.10
   Radio:
      # Set to false to silence the police radio for players (cops still respond to each other).
      Enabled: true
      # Players within this many blocks of the speaking cop, or of the addressed cop, hear the line. Also how far
      # other cops hear a Contact / Man_Down / Backup call and respond.
      Range: 32.0
      # The hunted player hears their own pursuers from this far away.
      Target_Range: 64.0
      # Minimum gap between two lines from one squad (priority lines and acks skip it).
      Squad_Gap_Ticks: 30
      # Minimum gap between two low-priority lines reaching one player, across all squads.
      Player_Gap_Ticks: 20
      # Ticks before an ordered cop acknowledges a delivered order. Forced to at least Player_Gap_Ticks + 5.
      Ack_Delay_Ticks: 25
      # Nearby cops (returning, idle or chasing a civilian) pulled in per radio call. 0 = none.
      Responder_Max: 2
      # Line kinds that skip the squad and player gaps (they still respect their own cooldown).
      Priority:
         - "Contact"
         - "Man_Down"
         - "Leader_Down"
         - "Commander_Down"
         - "Backup"
         - "Resisting"
         - "Dispatch_Wanted"
         - "Escalate"
         - "Stand_Down"
         - "Fall_Back"
         - "In_Cover"
      # One squad never repeats the same kind of line within this many ticks.
      Cooldown_Ticks:
         Contact: 160
         Contact_Lost: 160
         Engage: 300
         Push: 200
         Flank_Left: 200
         Flank_Right: 200
         Reposition: 100
         Search: 300
         Route: 300
         Route_High: 300
         Climb: 300
         No_Route: 300
         Check_Fire: 160
         Reloading: 160
         Man_Down: 100
         Leader_Down: 100
         Commander_Down: 100
         Resisting: 200
         Backup: 400
         Responding: 100
         Ack: 40
         Fall_Back: 100
         In_Cover: 200
         Stand_Down: 200
         Hit: 100
         Medic_Moving: 100
         Covering_Fire: 200
         Medic_Pinned: 160
         Patched_Up: 100
      # Short click played to each listener with every line (SoundConfiguration shape).
      Sound:
         Name: BLOCK_NOTE_BLOCK_HAT
         Volume: 0.4
         Pitch: 1.8
   Backup:
      # When a cop goes down, the squad radios for backup.
      Enabled: true
      # Extra cops on top of the wanted-level count (still capped by Behaviour.Max_Per_Player).
      Extra_Cops: 1
      # How long the extra cops stay requested (600 = 30 s). Afterwards the surplus cops that are not fighting walk home.
      Duration_Ticks: 600
      # Minimum gap between two backup requests from one group (1200 = 60 s).
      Cooldown_Ticks: 1200
   # A badly hurt cop breaks off, radios it (Lines.Fall_Back / In_Cover) and takes cover out of the suspect's sight
   # for up to 10 seconds, then comes back out and fights on.
   Retreat:
      # Set to false and cops fight on until they drop (no fall-back after a Commander goes down either).
      Enabled: true
      # Retreat at or below this fraction of max health (0-1; 0.3 = 30%).
      Health_Fraction: 0.3
      # Blocks searched around the cop for a spot the suspect cannot see (2-32).
      Radius: 12.0
   # Every cop gets a callsign such as "Officer Bob #1592", shown above its head and used on the radio.
   Names:
      # %rank% = the tier's Display_Name, %name% = a first name from First_Names, %badge% = 1000 + the NPC id
      # (unique among live NPCs).
      Format: "%rank% &f%name% &7#%badge%"
      # Leave the list empty ([]) for no first name ("Officer #1592"); remove the key for the built-in names.
      First_Names:
         - Bob
         - Jim
         - Carl
         - Dave
         - Frank
         - Mike
         - Tony
         - Steve
         - Ray
         - Eddie
         - Gus
         - Hank
         - Joe
         - Lou
         - Marty
         - Nick
         - Pete
         - Rick
         - Sam
         - Vince
         - Walt
         - Ann
         - Kate
         - Linda
         - Maria
         - Rosa
         - Sue
         - Tina
   Stuck:
      # Set to false and a cop that cannot reach the suspect stays where it is.
      Enabled: true
      # Seconds a cop may find no way to the suspect before it is taken off the map and a new one is sent from a
      # spot closer to his level (at least 1). A cop he is looking at (in front of him, clear line, within
      # Cops.Spawn.Visibility_Check_Distance of settings.yml) is kept; past twice this, only within 24 blocks.
      Recycle_Seconds: 12
      # Seconds the spawner a recycled cop came from is skipped for its replacements (0 = never skipped).
      Avoid_Spawner_Seconds: 60
   # Field care: a hurt cop limps and bleeds and radios Lines.Hit; a Medic-role cop of its squad walks over and treats
   # it. The patient holds still and crouches while treated (it keeps firing), and a hit on the medic starts the
   # treatment over (Lines.Medic_Pinned). A squad without a Medic cop never heals. Every key is optional.
   Field_Care:
      # Set to false: no limp, bleeding or treatment at all.
      Enabled: true
      # Hurt at or below this fraction of max health (0-1; 0.5 = 50%). Keep it above Retreat.Health_Fraction.
      Health_Fraction: 0.5
      # A hurt cop's walking speed, as a fraction of its tier Speed (0.1-1).
      Limp_Speed: 0.7
      # Set to false: cops still get hurt, but no medic treats them.
      Medic_Enabled: true
      # Blocks a medic answers a hurt squad mate within (2-64).
      Medic_Radius: 24.0
      # Blocks from the patient the medic treats it from (1-6).
      Heal_Range: 2.5
      # Ticks one treatment takes (60 = 3 s).
      Channel_Ticks: 60
      # Share of max health one treatment restores (0-1).
      Heal_Fraction: 0.5
   # Squad roles: each new cop takes the next unfilled role of its wanted level's Squad_Composition, laid over its tier
   # (the tier still decides weapons, armour and the formation arc). Set to false and every cop spawns as its plain tier.
   Roles_Enabled: true
   # Role catalogue. A cops.yml without this block uses these same built-in roles; an entry here is read key by key
   # over the built-in role of the same name (or over a plain role for a new name). Every key is optional:
   #   Display_Name:        The role's label (default: its name). Never replaces the tier's Display_Name.
   #   Fan_Placement:       ANY, CENTER or FLANK: where on the squad's firing fan the cop prefers to stand.
   #   Ranged_Min_Distance: The cop's own firing band in blocks (0-64), set together with Ranged_Max_Distance.
   #   Ranged_Max_Distance: Unset = settings.yml's band. Always clamped under the held gun's Projectile Distance.
   #   Health_Multiplier:   Multiplies the tier's Health (0.1-10).
   #   Off_Hand:            An item held in the off hand, e.g. SHIELD (cosmetic, never dropped); "" = none.
   #   Leader_Priority:     The squad's radio voice is its live cop with the highest priority (ties: the first to join).
   #   Strafe_Degrees:      Replaces the tier's Tactics.Strafe_Degrees (0-180; 0 = holds its post).
   #   Fire_Rate_Scale:     Multiplies the tier's Fire_Rate_Multiplier (below 1 fires slower; 0.05-10).
   #   Difficulty_Bonus:    Steps above the tier's Difficulty (0-3), capped at DEADLY: better aim.
   #   Retreat:             Enabled / Health_Fraction / Radius, read over Cops.Retreat above.
   #   Block_Fraction:      Share of each hit taken off when it comes from inside the front cone (0-1; 0 = none).
   #   Block_Cone_Degrees:  The front cone's full width (0-360).
   #   Medic:               true = the role treats hurt squad mates.
   #   Commander:           true = when this cop goes down its squad radios Commander_Down and falls back briefly.
   Roles:
      # Front and centre, close in; leads the squad whenever no Commander is on it.
      Pointman:
         Fan_Placement: CENTER
         Ranged_Min_Distance: 4.0
         Ranged_Max_Distance: 8.0
         Leader_Priority: 1
      # The fan's ends, pushing in and strafing wide.
      Assault:
         Fan_Placement: FLANK
         Ranged_Min_Distance: 5.0
         Ranged_Max_Distance: 9.0
         Strafe_Degrees: 20.0
         Retreat:
            Health_Fraction: 0.25
      # Holds the centre post up front behind a shield that takes half of every hit from its front.
      Defender:
         Fan_Placement: CENTER
         Ranged_Min_Distance: 4.0
         Ranged_Max_Distance: 7.0
         Health_Multiplier: 1.5
         Off_Hand: "SHIELD"
         Strafe_Degrees: 0.0
         Block_Fraction: 0.5
         Block_Cone_Degrees: 60.0
         Retreat:
            Health_Fraction: 0.15
      # The back of the fan: slower but surer shots. The band is clamped under the gun's reach (rifle: 10 blocks).
      Marksman:
         Ranged_Min_Distance: 14.0
         Ranged_Max_Distance: 22.0
         Fire_Rate_Scale: 0.6
         Difficulty_Bonus: 1
         Retreat:
            Health_Fraction: 0.4
      Medic:
         Fan_Placement: CENTER
         Ranged_Min_Distance: 8.0
         Ranged_Max_Distance: 12.0
         Medic: true
         Retreat:
            Health_Fraction: 0.5
      # Leads from the rear of the band; the squad falls back briefly when it goes down.
      Commander:
         Ranged_Min_Distance: 10.0
         Ranged_Max_Distance: 14.0
         Leader_Priority: 2
         Commander: true
         Retreat:
            Health_Fraction: 0.4
   # The roles a squad fills, in order, per wanted level. A level with no entry uses the highest lower one; cops past
   # the end of the list (backup, extra cops) take its last role. Without this block these same compositions apply.
   Squad_Composition:
      1:
         - "Pointman"
         - "Assault"
      2:
         - "Pointman"
         - "Assault"
         - "Assault"
      3:
         - "Commander"
         - "Pointman"
         - "Defender"
         - "Marksman"
         - "Assault"
      4:
         - "Commander"
         - "Pointman"
         - "Defender"
         - "Marksman"
         - "Medic"
         - "Assault"
   Tiers:
      1:
         Display_Name: "&9Officer"
         Health: 20.0
         Damage: 2.0
         Speed: 1.0
         Cuff_Radius: 3.0
         Can_Use_Weapons: false
         Skip_Cuffing: false
         Difficulty: EASY
         # Gun cadence: a fraction of the weapon's own fire rate (see the header). Only used with Can_Use_Weapons.
         Fire_Rate_Multiplier: 0.1
         # Accepts vanilla materials (IRON_SWORD) or custom items (weapon:rifle, LEATHER_HELMET{color=blue})
         Weapon_Pool:
            - "WOODEN_SWORD"
         Wearables:
            Helmet: ""
            Chestplate: ""
            Leggings: ""
            Boots: ""
         # Melee tier: the formation arc is ignored (melee always surrounds at 360/n).
         Tactics:
            Strafe_Degrees: 10.0
            Reposition_Ticks: 80
            Moving_Aim_Error: 0.15
      2:
         Display_Name: "&9Sergeant"
         Health: 25.0
         Damage: 3.0
         Speed: 1.1
         Cuff_Radius: 3.5
         Can_Use_Weapons: false
         Skip_Cuffing: false
         Difficulty: EASY
         # Gun cadence: a fraction of the weapon's own fire rate (see the header). Only used with Can_Use_Weapons.
         Fire_Rate_Multiplier: 0.1
         Weapon_Pool:
            - "STONE_SWORD"
         Wearables:
            Helmet: "LEATHER_HELMET"
            Chestplate: ""
            Leggings: ""
            Boots: ""
         # Melee tier: the formation arc is ignored (melee always surrounds at 360/n).
         Tactics:
            Strafe_Degrees: 10.0
            Reposition_Ticks: 80
            Moving_Aim_Error: 0.15
      3:
         Display_Name: "&1Lieutenant"
         Health: 30.0
         Damage: 4.0
         Speed: 1.2
         Cuff_Radius: 4.0
         Can_Use_Weapons: true
         Skip_Cuffing: false
         Difficulty: NORMAL
         # Gun cadence: a fraction of the weapon's own fire rate (see the header). Only used with Can_Use_Weapons.
         Fire_Rate_Multiplier: 0.1
         Weapon_Pool:
            - "weapon:rifle"
            - "CROSSBOW"
         Wearables:
            Helmet: "CHAINMAIL_HELMET"
            Chestplate: "CHAINMAIL_CHESTPLATE"
            Leggings: ""
            Boots: ""
         Tactics:
            Formation_Arc: 200.0
            Strafe_Degrees: 10.0
            Reposition_Ticks: 80
            Moving_Aim_Error: 0.12
      4:
         Display_Name: "&1SWAT"
         Health: 40.0
         Damage: 5.0
         Speed: 1.3
         Cuff_Radius: 4.5
         Can_Use_Weapons: true
         Skip_Cuffing: true
         Difficulty: HARD
         # Gun cadence: a fraction of the weapon's own fire rate (see the header). Only used with Can_Use_Weapons.
         Fire_Rate_Multiplier: 0.1
         Weapon_Pool:
            - "weapon:rifle"
            - "CROSSBOW"
         Wearables:
            Helmet: "IRON_HELMET"
            Chestplate: "IRON_CHESTPLATE"
            Leggings: "IRON_LEGGINGS"
            Boots: "IRON_BOOTS"
         Tactics:
            Formation_Arc: 270.0
            Strafe_Degrees: 15.0
            Reposition_Ticks: 60
            Moving_Aim_Error: 0.10
      5:
         Display_Name: "&4Military"
         Health: 60.0
         Damage: 7.0
         Speed: 1.4
         Cuff_Radius: 5.0
         Can_Use_Weapons: true
         Skip_Cuffing: true
         Difficulty: DEADLY
         # Gun cadence: a fraction of the weapon's own fire rate (see the header). Only used with Can_Use_Weapons.
         Fire_Rate_Multiplier: 0.1
         Weapon_Pool:
            - "weapon:rifle"
            - "CROSSBOW"
         Wearables:
            Helmet: "DIAMOND_HELMET"
            Chestplate: "DIAMOND_CHESTPLATE"
            Leggings: "DIAMOND_LEGGINGS"
            Boots: "DIAMOND_BOOTS"
         Tactics:
            Formation_Arc: 330.0
            Strafe_Degrees: 20.0
            Reposition_Ticks: 40
            Moving_Aim_Error: 0.08

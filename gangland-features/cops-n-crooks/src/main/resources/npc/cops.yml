#
# Each entry under Cops.Tiers defines a cop NPC tier, escalating in difficulty.
# Tiers are assigned to spawn points and determine NPC stats and equipment.
#
# Fields:
#   Display_Name:   Name shown above the NPC (supports & color codes)
#   Health:         Max health in half-hearts (20.0 = 10 hearts)
#   Damage:         Melee damage dealt per hit
#   Speed:          Movement speed multiplier (1.0 = default walk speed)
#   Cuff_Radius:    Distance in blocks within which the cop can cuff a player
#   Can_Use_Weapons: Whether the cop draws from its Weapon_Pool instead of melee
#   Skip_Cuffing:   If true, the cop arrests the player instantly without a cuffing animation
#   Weapon_Pool:    List of items the cop may equip; one is chosen at random on spawn.
#                   Accepts vanilla materials (IRON_SWORD), custom weapons (weapon:<id>),
#                   or items with extra data (LEATHER_HELMET{color=blue})
#   Wearables:
#     Helmet:       Armor piece for the head slot; leave blank for none
#     Chestplate:   Armor piece for the chest slot; leave blank for none
#     Leggings:     Armor piece for the legs slot; leave blank for none
#     Boots:        Armor piece for the feet slot; leave blank for none
#   Difficulty:     Combat profile that scales aim error, reaction time, fire rate, and melee
#                   damage. One of EASY, NORMAL, HARD, DEADLY. Defaults to NORMAL when omitted.
#
# Rosters (0.12): mixed-squad composition per wanted star, star -> { tier: count }. A star with no entry here
# falls back to the pre-0.12 single-tier roster (one tier from Tiers, sized by Wanted.Level counts), still
# clamped by Max_Per_Player either way.
#
# Backup_Delay_Seconds (0.12): a cop lost from the roster (killed, despawned) does not respawn on the very next
# spawn check — it queues behind this per-star delay instead, so a chase gets a breather instead of an instant
# replacement. The initial response when a player first becomes wanted is never delayed.
# ============================================
Cops:
   Rosters:
      1: { 1: 2 }
      2: { 1: 2, 2: 2 }
      3: { 2: 2, 3: 2 }
      4: { 3: 2, 4: 4 }
      5: { 4: 3, 5: 4 }
   Backup_Delay_Seconds: [15, 12, 10, 8, 6]
   Tiers:
      1:
         Display_Name: "&9Officer"
         Health: 20.0
         Damage: 2.0
         Speed: 1.0
         Cuff_Radius: 3.0
         Can_Use_Weapons: false
         Skip_Cuffing: false
         Difficulty: EASY
         # Accepts vanilla materials (IRON_SWORD) or custom items (weapon:rifle, LEATHER_HELMET{color=blue})
         Weapon_Pool:
            - "WOODEN_SWORD"
         Wearables:
            Helmet: ""
            Chestplate: ""
            Leggings: ""
            Boots: ""
      2:
         Display_Name: "&9Sergeant"
         Health: 25.0
         Damage: 3.0
         Speed: 1.1
         Cuff_Radius: 3.5
         Can_Use_Weapons: false
         Skip_Cuffing: false
         Difficulty: EASY
         Weapon_Pool:
            - "STONE_SWORD"
         Wearables:
            Helmet: "LEATHER_HELMET"
            Chestplate: ""
            Leggings: ""
            Boots: ""
      3:
         Display_Name: "&1Lieutenant"
         Health: 30.0
         Damage: 4.0
         Speed: 1.2
         Cuff_Radius: 4.0
         Can_Use_Weapons: true
         Skip_Cuffing: false
         Difficulty: NORMAL
         Weapon_Pool:
            - "weapon:rifle"
            - "CROSSBOW"
         Wearables:
            Helmet: "CHAINMAIL_HELMET"
            Chestplate: "CHAINMAIL_CHESTPLATE"
            Leggings: ""
            Boots: ""
      4:
         Display_Name: "&1SWAT"
         Health: 40.0
         Damage: 5.0
         Speed: 1.3
         Cuff_Radius: 4.5
         Can_Use_Weapons: true
         Skip_Cuffing: true
         Difficulty: HARD
         Weapon_Pool:
            - "weapon:rifle"
            - "CROSSBOW"
         Wearables:
            Helmet: "IRON_HELMET"
            Chestplate: "IRON_CHESTPLATE"
            Leggings: "IRON_LEGGINGS"
            Boots: "IRON_BOOTS"
      5:
         Display_Name: "&4Military"
         Health: 60.0
         Damage: 7.0
         Speed: 1.4
         Cuff_Radius: 5.0
         Can_Use_Weapons: true
         Skip_Cuffing: true
         Difficulty: DEADLY
         Weapon_Pool:
            - "weapon:rifle"
            - "CROSSBOW"
         Wearables:
            Helmet: "DIAMOND_HELMET"
            Chestplate: "DIAMOND_CHESTPLATE"
            Leggings: "DIAMOND_LEGGINGS"
            Boots: "DIAMOND_BOOTS"

# ============================================
# Heat (0.12): every crime adds heat; stars follow heat thresholds instead of flat per-kill steps.
#
#   Enable:                        false = kills raise wanted as before (Wanted.Level.Increment per kill, or the
#                                  Wanted.Kill_Combo.Kill_Counter thresholds when the kill combo is enabled)
#   Star_Thresholds:               heat needed for each star (1st entry = 1 star). A shorter list than
#                                  Wanted.Level.Maximum is stretched linearly
#   Streak_Bonus:                  multiplier for a crime committed while the kill combo is still running
#                                  (within Wanted.Kill_Combo.Reset_After seconds of the previous kill)
#   Turf_War_Multiplier:           multiplier for a kill whose victim stands inside a contested turf
#   Assault_Cop_Cooldown_Seconds:  one Assault_Cop per player and cop per window, so a single fight does not
#                                  stack heat every hit
#   Crimes:                        heat weight of each crime. Assault_Cop is any non-lethal damage to a cop
#
# Killing a hostile civilian that is fighting back (self-defence) never adds heat.
# ============================================
Heat:
   Enable: true
   Star_Thresholds: [100, 250, 450, 700, 1000]
   Streak_Bonus: 1.5
   Turf_War_Multiplier: 0.5
   Assault_Cop_Cooldown_Seconds: 10
   Crimes:
      Kill_Player: 80
      Kill_Civilian: 100
      Kill_Cop: 150
      Assault_Cop: 100

# ============================================
# Hud (0.12): the wanted boss bar, flashing stars, the search-zone particle ring and the escape compass.
#
#   Enable:            the whole HUD service no-ops when false
#   Boss_Bar:          the wanted boss bar (red while IN SIGHT/WANTED, yellow with the countdown while SEARCHING)
#   Search_Zone_Ring:  a sparse red-dust ring on the search zone edge while SEARCHING, seen only by the wanted player
#   Escape_Compass:    points the compass outside the search zone while SEARCHING; restored once the chase leaves it
#   Star_Gain_Title:   a title/subtitle + sound on every star gained
#   Messages:          %stars% is the star string (flashes filled/grey every second while SEARCHING), %time% is the
#                      remaining search countdown as m:ss. Color codes use '&'
# ============================================
Hud:
   Enable: true
   Boss_Bar: true
   Search_Zone_Ring: true
   Escape_Compass: true
   Star_Gain_Title: true
   Messages:
      In_Sight: "%stars% &c&lIN SIGHT"
      Searching: "%stars% &e&lSEARCHING %time%"
      Wanted: "%stars% &c&lWANTED"
      Star_Lost: "%stars% &a&lSTAR LOST"
      Star_Gained_Title: "&c&lWANTED"
      Star_Gained_Subtitle: "%stars%"

# ============================================
# Pursuit_Report (0.12): a short chat report sent when a chase ends, and a server-wide "breaking news" line for a
# chase that ran long or hot.
#
#   Enable:                     the whole feature no-ops when false: no report, no broadcast
#   Breaking_News.Enable:       the server-wide broadcast
#   Breaking_News.Min_Stars:    broadcasts when the chase's top star reaches this level...
#   Breaking_News.Min_Duration_Seconds:  ...or when the chase ran at least this long
#   Breaking_News.Cooldown_Seconds:      global cooldown between broadcasts
#   Messages.Report:            the report's lines, sent to the player in order. %outcome%, %duration% (m:ss),
#                                %stars%, %cops%
#   Messages.Outcome_Escaped/Busted/Wasted:  the colored %outcome% value for each outcome
#   Messages.Breaking_News:     the broadcast line. %player%, %outcome_plain% (a plain, uncolored verb phrase),
#                                %duration%, %stars%, %cops%
# ============================================
Pursuit_Report:
   Enable: true
   Breaking_News:
      Enable: true
      Min_Stars: 4
      Min_Duration_Seconds: 120
      Cooldown_Seconds: 300
   Messages:
      Report:
         - "&8&m----------&r &c&lPURSUIT REPORT &8&m----------"
         - "&7Outcome: %outcome%"
         - "&7Duration: &f%duration%  &7Top stars: %stars%"
         - "&7Cops down: &f%cops%"
      Outcome_Escaped: "&aESCAPED"
      Outcome_Busted: "&9BUSTED"
      Outcome_Wasted: "&4WASTED"
      Breaking_News: "&c&lBREAKING NEWS &7» &f%player% %outcome_plain% after a %duration% chase at %stars%&f, %cops% officers down."

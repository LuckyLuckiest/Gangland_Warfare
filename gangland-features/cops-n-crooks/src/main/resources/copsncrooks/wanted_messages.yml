#   +------------------------------------------------------+   #
# |                File: wanted_messages.yml                 | #
#   +------------------------------------------------------+   #
#
# The text of the chase HUD and the charge sheet. & colour codes work. Placeholders in %percent% signs are filled in
# by the plugin: %stars%, %time%, %arrow%, %distance%, %crime%, %tier%, %stance%, %count% (also the number of stars
# a star-drop line reports), %amount%, %paid%, %money_symbol%, %player%, %seconds%, %ending%, %xp%.

# The boss bar and the star card
Hud:
   Bar:
      # A cop can see you
      Seen: "&c%stars% &4&lIN SIGHT"
      # No cop can see you, the search is on
      Searching: "&e%stars% &6&lSEARCHING %time%"
      # A star was just lost
      Evaded: "&a%stars% &2&lSTAR LOST"
      # Several stars were just lost at once; %count% is how many
      Evaded_Many: "&a%stars% &2&l-%count% STARS"
      # Added after Searching while Wanted.Hud.Compass is on: an arrow to the way out of the search zone, seen from
      # where you face, and the blocks to go
      Way: "   &f%arrow% %distance%m"
      # The bar after an escape while a bounty stands; %money_symbol% and %amount% are the bounty
      Bounty: "&6&lBOUNTY &e%money_symbol%%amount% &7· &cCops still looking"
      # The bar after an escape with no bounty on you
      Bounty_None: "&7Cops still looking"
   # The lines said in chat when the post-escape search starts or ends (Wanted.Post_Escape)
   Announce:
      # The escape with a bounty on you; %money_symbol% and %amount% are the bounty
      Bounty: "&6&lBOUNTY &e%money_symbol%%amount% &7is on you, the cops are still looking"
      # The escape with no bounty on you
      No_Bounty: "&7The cops are still looking for you"
      # The search runs out with no bounty on you
      Gave_Up: "&7The cops gave up the search"
      # The search runs out with a bounty still on you
      Gave_Up_Bounty: "&7The cops gave up the search &6BOUNTY %money_symbol%%amount% still stands"
   Card:
      # Why a star was raised, with the tier of cop on the way
      Raise: "&f%crime%&7: &e%tier% &7inbound, %stance%"
      # %stance% when the cops want to cuff you
      Stance_Cuffs: "they still want you in cuffs"
      # %stance% when the cops shoot first
      Stance_Shoot: "they shoot first"
      # A star dropped because you stayed out of sight
      Drop_Evasion: "&aYou stayed out of sight"
      # A star dropped because the timer ran out
      Drop_Decay: "&aThe trail went cold"
      # A star dropped for any other reason
      Drop_Other: "&aA star is gone"
      # AUTO: a small chase, every star dropped at once; %count% is how many
      Drop_Petty: "&aSmall fry, the heat is off you for now &7(-%count%)"
      # AUTO: a long chase that went quiet, every star dropped at once
      Drop_Cold_Trail: "&aThe trail is fading &7(-%count%)"
      # AUTO: you left the search area and lost a share of your stars
      Drop_Clean_Break: "&aClean break, you left the area &7(-%count%)"
      # AUTO: only one star, because the chase is still hot (a rampage, or you logged out)
      Drop_Still_Hot: "&eStill hot, one star at a time"
      # AUTO: only one star, because the cops know you (you keep getting away)
      Drop_Known_Face: "&eThey know your face, one star at a time"
      # AUTO: one star after a narrow escape; the next timer is quicker
      Drop_Narrow: "&aThat was close, they are losing you"

# What an arrest costs
Charge_Sheet:
   # First line
   Header: "&8&m-----&r &6&lCHARGE SHEET &8&m-----"
   # One line per crime
   Crime: "&7- &f%crime% &8x%count%"
   # The fine
   Total: "&7Fine: &c%money_symbol%%amount%"
   # What the wallet covered
   Paid: "&7Paid from your wallet: &a%money_symbol%%amount%"
   # Jail time added for what the wallet could not cover
   Extra_Time: "&7Unpaid &c%money_symbol%%amount% &7served as &c+%time%"
   # The line on the paperwork screen
   Paperwork: "&7Fine paid: &a%money_symbol%%paid% &8| &7Extra time: &c%time%"

# The police bribe star pickups (Wanted.Bribe_Stars in wanted.yml)
Bribe_Star:
   # You took one; %stars% is how many stars it removed
   Taken: "&6You pocketed a police bribe star. &e-%stars% star(s)."
   # You tried while a cop had seen you recently (shown at most once every 5 seconds)
   Seen: "&cNot with a cop watching."

# Crime names used on the charge sheet and the star card
Crimes:
   Brandish_Near_Cop: "Brandishing a weapon near an officer"
   Assault_Civilian: "Assault"
   Car_Theft: "Car theft"
   Kill_Player: "Murder"
   Kill_Civilian: "Killing a civilian"
   Assault_Cop: "Assault on an officer"
   Resisting_Arrest: "Resisting arrest"
   Kill_Cop: "Killing an officer"
   Safe_Cracking: "Safe cracking"
   Store_Robbery: "Store robbery"
   Trespass_Restricted: "Trespassing"
   Jailbreak: "Jailbreak"
   # A sighting by the post-escape search: the cops spotted a player they were looking for
   Spotted: "Spotted by the cops"
   # The star card's text when no crime is on record, for example a sign or an admin raise
   Unknown_Crime: "Reported crime"

# 0.21.0: the surrender, busted, lockpick, crew-heat, rescue, pursuit report and breaking news lines
Surrender:
   # Your hands are up and the cops hold their fire
   Accepted: "&eHands where we can see them. &7The cops hold their fire, stay down."
   # You hit a cop soon after surrendering
   Resisted: "&cYou resisted arrest."
   # Too much heat to surrender; the cops are not taking you alive
   Too_Hot: "&cAt this heat they are not taking you alive."
# A lethal hit with a cop close by arrests instead of downing you (Detainment.Busted)
Busted:
   # The title on the screen when you are cuffed this way
   Title: "&c&lBUSTED"
   # The subtitle under the title
   Subtitle: "&7A cop got the cuffs on you"
# Breaking the lock on a cuff with a lockpick (Detainment.Break_Free.Lockpick)
Lockpick:
   # A lockpick broke while you were picking the lock
   Snapped: "&7Your lockpick snapped."
# Crimes shared with gang mates and allies (Wanted.Crew_Heat); %player% is who committed it, %crime% the crime
Crew_Heat:
   # The crew member's crime lands on you too
   Shared: "&c%player%'s %crime% is on you too."
# Freeing a cuffed player (Detainment.Rescue); %seconds% is the hold time left
Rescue:
   # The rescuer's progress while holding right-click
   Progress: "&eFreeing %player%... &f%seconds%s"
   # Said to the rescuer when the prisoner is freed
   Freed: "&aYou broke %player% out. &cThe cops want you both."
   # Said to the prisoner when a crew mate frees them
   Freed_By: "&a%player% broke you out!"
# The pursuit report shown when a chase ends (Wanted.Pursuit_Report); %ending% is one of the Endings below
Pursuit_Report:
   # First line
   Header: "&8&m-----&r &6&lPURSUIT REPORT &8&m-----"
   # How the chase ended
   Ending: "&7Ending: &f%ending%"
   # How long the chase lasted
   Duration: "&7Duration: &f%time%"
   # The highest wanted level reached
   Peak: "&7Peak: %stars%"
   # How many cops went down; %count% is how many
   Cops_Down: "&7Cops down: &f%count%"
   # How many times you were cuffed; %count% is how many
   Busts: "&7Times cuffed: &f%count%"
   # The cost to the city; %money_symbol% and %amount% are the cost
   Cost: "&7Cost to the city: &c%money_symbol%%amount%"
   Endings:
      # You got away: the search ran out or the timer cleared your stars
      Escaped: "Escaped"
      # You surrendered
      Surrendered: "Surrendered"
      # You were busted
      Busted: "Busted"
      # You were arrested
      Arrested: "Arrested"
      # You were killed
      Wasted: "Wasted"
      # You paid a contact or bribed the cops
      Paid_Off: "Paid off"
      # Your stars were cleared another way (an admin command or a sign)
      Cleared: "Cleared"
# Server-wide headlines for a chase (Wanted.Pursuit_Report.Breaking_News)
Breaking_News:
   # Said while the chase is live; %player% and %stars% are the chase
   Live: "&4&lBREAKING &fPolice are chasing %player% across the city &c%stars%"
   # Said when the chase is over; %ending% is how it ended
   End: "&4&lBREAKING &fThe %stars% &fchase of %player% is over: %ending%"
# 0.21.0 wave 2: the getaway XP lines (Wanted.Getaway) and the Most Wanted headline (Wanted.Most_Wanted)
Getaway:
   # You got away clean; %xp% is the XP you earned
   Line: "&7Getaway: &a+%xp% XP"
   # The daily XP cap for getaways is reached
   Capped: "&7Getaway: &8daily XP cap reached"
   # Said to each wanted crew mate who gets a share; %player% is who got away, %xp% the mate's XP
   Share: "&a%player% got away clean: &f+%xp% XP &7for the crew"
Most_Wanted:
   # Said when a player becomes the city's Most Wanted; %player% and %stars% are that player and their level
   New: "&4&lMOST WANTED &f%player% &7is now the city's Most Wanted &c%stars%"

# 0.20.0
# Patrol stops: a beat cop's warnings during a traffic stop; %seconds% is the seconds left to comply
Patrol:
   # The cop tells you to put a weapon away; %seconds% is the time to comply
   Put_Away: "&eBeat cop: &fPut that away! &7(%seconds%s)"
   # You complied in time
   Complied: "&aThanks, carry on."
   # The cop orders a stop; %seconds% is the seconds you have to stop
   Pull_Over: "&cBeat cop: &fPull over! Stop within %seconds%s"
   # The ticket; %money_symbol% and %amount% are the fine
   Ticket: "&7Ticket: &c%money_symbol%%amount%"
   # You ran from a traffic stop
   Fled: "&cYou fled a traffic stop!"
# Trackers: a car tagged by a cop; %seconds% is the seconds left on the tag
Tracker:
   # The car was tagged
   Tagged: "&cYour car has been tagged. Ditch it."
   # The tag countdown on the HUD; %seconds% is the seconds left
   Hud: "&cTagged &7%seconds%s"
# Trespass: the line shown when you enter a restricted area
Trespass: "&cRestricted area!"
# Suspect: the words a cop's description of a suspect is built from
Suspect:
   # No description known
   Unknown: "unknown suspect"
   # The bare word for a suspect
   Bare: "suspect"
   # The suspect is on foot
   On_Foot: "on foot"
   # The suspect is in a car
   In_Car: "in a car"
   # The mask part of a masked suspect; %head% is what is on the head
   Mask: "in a %head%"
   # The whole description; %who% is the word for the suspect, %mask% the mask, %chest% the chest, %vehicle% the vehicle
   Format: "%who%%mask%, %chest%, %vehicle%"

# 0.20.0 hot-cash bag: the action bar, the bag's messages and the fence's messages
Bag:
   # 0.20.0 the action bar while you carry a bag; %money_symbol% and %amount% are filled in
   Hud: "&6Bag: &a%money_symbol%%amount%"
   # 0.20.0 the bag is full: no more cash goes in
   Full: "&cYour bag is full."
   # 0.20.0 a getaway banks the bag; %amount% is what is kept
   Banked: "&aYou got away: &f%money_symbol%%amount% &afrom your bag is clean."
   # 0.20.0 the day's bank limit is reached: the fence takes its cut of the rest; %cut% is the fence's share, %rest% the bag cash it took
   Over_Cap: "&7Over today's limit: the fence took &f%money_symbol%%cut% &7of &f%money_symbol%%rest%&7."
   # 0.20.0 the chase ended and the fence paid for the bag; %bag% is the bag, %amount% what you got
   Converted: "&7Chase over: the fence turned your bag of &f%money_symbol%%bag% &7into &a%money_symbol%%amount%&7."
   # 0.20.0 the cops seize the bag on arrest; %amount% is what was taken
   Seized: "&cBag seized: &f%money_symbol%%amount%"
   # 0.20.0 the paperwork line for a seized bag; %amount% is what was taken
   Paperwork: "&7Bag seized: &c%money_symbol%%amount%"
   # 0.20.0 the bag spilled on death or quit; %amount% is what is on the street
   Spilled: "&cYour bag spilled: &f%money_symbol%%amount% &cis on the street."
   # 0.20.0 hot cash picked up or held while wanted: the cops want you now
   Hot: "&cHot cash! The cops want you now."
   # 0.20.0 a bribe paid partly from the bag; %bag% is the bag share, %wallet% the wallet share
   Bribe: "&7Paid &f%money_symbol%%bag% &7from your bag and &f%money_symbol%%wallet% &7from your wallet."
# 0.20.0 the fence: selling the bag to the fence
Fence:
   # 0.20.0 the fence paid for the bag; %amount% is the payment, %bag% the bag's value
   Done: "&aThe fence paid &f%money_symbol%%amount% &afor your bag of &f%money_symbol%%bag%&a."
   # 0.20.0 the fence has nothing to buy: the bag is empty
   Empty: "&7Your bag is empty."
   # 0.20.0 the fence refuses a cuffed player
   Cuffed: "&cNot while you are in cuffs."

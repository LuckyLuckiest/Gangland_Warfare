# Cops N Crooks: police radio lines. Every Lines key is a list; one line is picked at random. [] mutes that kind.
# Spanish variant: cop_radio_messages_es.yml, picked by Settings.Language (see CopRadioMessages/LocalizedModuleYaml).
#
# Placeholders:
#   %unit%      speaker name, built from Speaker_Name below, e.g. Officer Medic Bob #1592
#   %member%    the addressed or downed cop
#   %target%    suspect name
#   %distance%  blocks from the speaker to the spot (Medic_Moving: to the patient)
#   %direction% compass word from the speaker to the spot
#   %side%      the spot relative to the way the suspect faces
#   %health%    a cop's health in percent (Hit, Medic_Treating, Patched_Up)
#   %eta%       seconds the medic needs to reach the patient (Medic_Moving)
#   %role%      the speaker's role, e.g. Medic, Marksman
#   %tier%, %level% dispatch lines only
#   %place%     the named place near the spot (a district, hideout, turf or waypoint), or Unknown_Place
#   %station%   the police station the units leave from (Dispatch_En_Route)
#   %count%     how many units are on their way (Dispatch_En_Route)
#   %eta%       also seconds until backup arrives (Dispatch_En_Route, Wipe_Refill)

# Line-wrapping template for an ordinary radio line.
Format: "&9&l[RADIO] &b%unit%&8: &7%line%"
# Line-wrapping template for a Dispatch-origin line (Dispatch_Wanted, Escalate).
Dispatch_Format: "&9&l[DISPATCH] &7%line%"

# Compass words for %direction%, starting at north and going clockwise.
Compass:
   - "north"
   - "north-east"
   - "east"
   - "south-east"
   - "south"
   - "south-west"
   - "west"
   - "north-west"

# The word %place% falls back to when no named place is near.
Unknown_Place: "the area"

# How a speaker is named on the radio (%unit%, and a cop named in a line). Placeholders:
#   {rank}    the tier's Display_Name, colour kept, e.g. "&9Officer"
#   {role}    the role word in its colour, no symbol, e.g. "&cMedic"; empty for a role-less cop
#   {name}    the first name (Cops.Names.First_Names); empty when that list is empty
#   {number}  the badge number, e.g. 1592
# An empty placeholder takes its colour code with it and the doubled space goes.
# The line's own colour resumes after the name. Rank and name only: "{rank} {name}"
Speaker_Name: "{rank} {role} &f{name} &7#{number}"

# Words for %side%, relative to the way the suspect faces.
Sides:
   - "front"
   - "left"
   - "right"
   - "back"

Lines:
   # A spotter first sees the suspect while the squad is not already in contact.
   Contact:
      - "Contact! Suspect %distance% blocks %direction%!"
      - "Eyes on %target%, %direction%!"
   # No member has seen the suspect for a while after contact.
   Contact_Lost:
      - "Lost visual near %place%. Searching the last known position."
   # A ranged shooter's order becomes the squad's fan centre.
   Engage:
      - "Suspect in sight, engaging!"
      - "Shots fired, engaging!"
   # The leader orders a member to close in.
   Push:
      - "%member%, move in on him!"
      - "%member%, close the distance!"
   # The leader orders a member to the left flank.
   Flank_Left:
      - "%member%, take his %side%!"
      - "%member%, swing round and cover his %side%!"
   # The leader orders a member to the right flank.
   Flank_Right:
      - "%member%, take his %side%!"
      - "%member%, cut him off on his %side%!"
   # A shooter strafes to a new fan post (not its first).
   Reposition:
      - "Moving, cover me!"
      - "Changing position!"
   # The leader orders the squad to search around the last-known position.
   Search:
      - "Spread out, find him!"
      - "Sweep the area!"
   # A member starts following a route to a suspect it cannot see directly, on level ground.
   Route:
      - "Going round, finding a way to him."
      - "Cutting round to him!"
   # The same, when the suspect is well above the member.
   Route_High:
      - "He's up high, finding a way up."
   # A member starts climbing a ladder, vine or scaffolding on its route.
   Climb:
      - "Taking the ladder!"
      - "Going up!"
   # A member finds no route to the suspect and waits at the nearest reachable spot.
   No_Route:
      - "Can't reach him, surround the building!"
      - "Hold the exits!"
   # A shooter holds a shot because a squad-mate stands in its line of fire.
   Check_Fire:
      - "Check your fire, friendly in the line!"
   # A shooter starts reloading.
   Reloading:
      - "Reloading, cover me!"
      - "Changing mags!"
   # A non-leader member goes down.
   Man_Down:
      - "Officer down! %member% is down!"
      - "Man down!"
   # The leader goes down and a new leader takes point.
   Leader_Down:
      - "%member% is down! %unit% taking point!"
   # The squad's Commander goes down: the new leader calls it and the squad falls back to cover briefly.
   Commander_Down:
      - "Commander down! Fall back, fall back!"
      - "We lost %member%! Pull back to cover!"
   # An ordered member acknowledges a delivered order.
   Ack:
      - "Copy."
      - "Moving."
      - "On it."
   # A nearby cop pulled in by a radio call announces itself.
   Responding:
      - "%unit% responding, en route!"
      - "Copy, moving to assist!"
   # A badly hurt cop breaks off to cover (Cops.Retreat in cops.yml).
   Fall_Back:
      - "Taking fire, falling back to cover!"
      - "Pulling back, cover me!"
   # The retreating cop reached cover.
   In_Cover:
      - "In cover!"
      - "I'm behind cover, keep him busy!"
   # Field care (Cops.Field_Care in cops.yml). A cop drops to its hurt threshold.
   Hit:
      - "I'm hit! I'm at %health%%, need a medic!"
      - "Taking hits, I'm bleeding - %health%% left, need a medic!"
      - "Hit, I'm at %health%%, somebody cover me!"
   # A medic sets off for a hurt squad mate (%member%).
   Medic_Moving:
      - "Medic en route to %member%, %distance% blocks out, ETA %eta% seconds!"
      - "%member%, hold on, %distance% blocks out, I'm coming to you!"
      - "Moving up to %member%, %distance% blocks, stay down!"
   # The squad covers the medic (said by the leader, or another cop when the leader is the medic or the patient).
   Covering_Fire:
      - "Cover the medic, lay it down!"
      - "Covering fire!"
   # A hit on the medic starts the treatment over.
   Medic_Pinned:
      - "Pinned down, can't reach %member%!"
   # The medic finished treating %member%.
   Patched_Up:
      - "%member% is stable at %health%%, back in it!"
      - "Patient stable, %health%% health. You're good, get back in there!"
      - "%member% patched up - %health%%. Back in the fight!"
   # A Marksman starts engaging: it has taken its overwatch post (replaces Engage for that role). Also said three ack
   # delays after its flank or push order, if it is then within its firing band of the suspect (an approximation of
   # "reached its post": the squad sends no arrival signal).
   Overwatch_Set:
      - "Overwatch in position, %distance% blocks %direction%, I have eyes on the suspect."
      - "%role% set, %distance% blocks %direction%. Eyes on %target%."
      - "In the nest, %distance% blocks %direction%. Clear line on the suspect."
   # A Marksman sights the suspect (replaces Contact for that role; a throttled one stays silent, the generic Contact
   # is not said in its place).
   Marksman_Spotted:
      - "Target spotted, %distance% blocks %direction%! Holding for the shot."
      - "I have eyes on %target%, %distance% blocks %direction%!"
      - "Visual on the suspect, %direction%, range %distance%."
   # A Marksman loses sight of the suspect (replaces Contact_Lost for that role).
   Marksman_Lost:
      - "Lost the target! Scanning %direction%."
      - "Target's out of my scope, last seen %direction%."
      - "No visual from overwatch, check %direction%!"
   # A Marksman starts reloading (replaces Reloading for that role).
   Marksman_Reloading:
      - "Overwatch reloading, I'm blind for a few seconds!"
      - "Changing mags, someone watch my sector!"
      - "Reloading the rifle, keep his head down!"
   # A Defender starts engaging (replaces Engage for that role). Also said three ack delays after its flank or push
   # order, if it is then within 12 blocks of the suspect.
   Shield_Up:
      - "Shield up, holding the line!"
      - "%role% up front, nobody gets past me!"
      - "Covering the squad, shields up!"
   # An Assault cop is ordered to a flank and calls its move two ack delays later (the order itself may have been
   # throttled, the call still goes out).
   Flanking:
      - "Moving to flank, %direction%!"
      - "Going wide %direction%, I'll get behind him!"
      - "Flanking %direction%, keep him busy!"
   # The squad starts engaging, a Commander is alive and the squad has a Defender, an Assault and a Marksman: it
   # orders those roles into place. Without all three the role-neutral Commander_Orders_Basic is said instead.
   Commander_Orders:
      - "Defender, hold the line! Assault, flank %direction%! Marksman, overwatch!"
      - "All units, engage! Defender up front, Assault go wide %direction%!"
      - "Squad, positions! Defender hold, Assault flank, Marksman take the high ground!"
   # The same two lines when the signal carries no spot (nothing to name a direction for).
   Commander_Orders_Undirected:
      - "All units, engage! Stay together and cover each other!"
      - "Squad, positions! Watch your sectors!"
      - "Contact ahead! Spread out and keep him pinned!"
   Flanking_Undirected:
      - "Moving to flank!"
      - "Going wide, I'll get behind him!"
      - "Flanking, keep him busy!"
   Commander_Orders_Basic:
      - "All units, engage! Stay together and cover each other!"
      - "Squad, positions! Watch your sectors, %direction% first!"
      - "Contact ahead, %direction%! Spread out and keep him pinned!"
   # The squad loses the suspect and a Commander is alive: it calls the squad in.
   Status_Check:
      - "Lost him! All units, sound off - report your status."
      - "Contact broken, check in, who's hurt?"
      - "Regroup on me and report your status."
   # A cop goes down and a Commander is alive: it pulls the squad back.
   Pull_Back:
      - "%member% is down! Everyone fall back to cover and regroup on me!"
      - "Man down, %member%! Pull back to cover, medic on him!"
      - "We lost %member%! Don't bunch up, fall back and cover each other!"
   # The medic reaches the patient and starts the treatment.
   Medic_Treating:
      - "Applying field dressing, %member%, stay with me."
      - "Hold still %member%, patching you up. You're at %health%%."
      - "%role% here, applying pressure, hold still, %member%!"
   # A cuffed suspect's escape attempts exhaust Max_Cuff_Attempts; the group switches to combat.
   Resisting:
      - "Suspect is resisting! Take him down!"
   # A cop goes down and the squad radios for backup.
   Backup:
      - "Requesting backup at my location!"
      - "Need more units here, now!"
   # Dispatch announces a fresh wanted level.
   Dispatch_Wanted:
      - "All units, be advised: %target% is wanted in %place%, level %level%."
   # Dispatch announces a wanted-tier escalation.
   Escalate:
      - "%tier% units en route to %target%."
   # Dispatch announces the wanted level clearing.
   Stand_Down:
      - "Suspect cleared. Returning to patrol."
   # The squad lost men fast and falls back to cover until backup arrives.
   Regroup:
      - "Two down! Pull back to cover, backup is coming!"
      - "We're losing men, fall back and wait for backup!"
   # Backup has arrived: the squad pushes together.
   Regroup_Push:
      - "Backup's here! All units, push together!"
      - "Everyone move in, now!"
   # Cops heard a shot and converge on it.
   Shots_Fired:
      - "Shots fired! Converge on the sound!"
      - "Gunfire, he's close! Move in!"
   # Dispatch announces the units sent from a station and their ETA.
   Dispatch_En_Route:
      - "%count% units en route from %station%, ETA %eta% s."
   # Dispatch announces backup for a wiped squad.
   Wipe_Refill:
      - "Squad down. Backup inbound in %eta% s."
   # The leader reports the heading of a suspect who broke contact.
   Handoff:
      - "Lost him heading %direction%. Units ahead, pick him up."
   # A cop takes a post on the perimeter.
   Post_Up:
      - "Holding the corner."
   # A posted cop sees the suspect.
   Eyes_On:
      - "Eyes on suspect near %place%, moving %direction%."
   # The leader calls the squad back to patrol.
   Returning_To_Patrol:
      - "Units returning to patrol."

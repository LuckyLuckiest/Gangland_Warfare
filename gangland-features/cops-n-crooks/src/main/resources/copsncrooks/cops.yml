#
# Each entry under Cops.Tiers defines a cop NPC tier, escalating in difficulty.
# Tiers are assigned to spawn points and determine NPC stats and equipment. Squad roles (Medic, Marksman, ...), their
# gear and weapons per tier, and the squad compositions live in copsncrooks/cop_roles.yml; a role's gear and weapons replace
# the tier's Wearables and Weapon_Pool slot by slot.
#
# Fields:
#   Display_Name:   The cop's rank, the %rank% in Cops.Names.Format (supports & color codes)
#   Health:         Max health in half-hearts (20.0 = 10 hearts)
#   Damage:         Melee damage dealt per hit
#   Speed:          Movement speed multiplier (1.0 = default walk speed)
#   Cuff_Radius:    Distance in blocks within which the cop can cuff a player
#   Can_Use_Weapons: Whether the cop draws from its Weapon_Pool instead of melee
#   Skip_Cuffing:   If true, the cop arrests the player instantly without a cuffing animation
#   Weapon_Pool:    List of items the cop may equip; one is chosen at random on spawn.
#                   Accepts vanilla materials (IRON_SWORD), custom weapons (weapon:<id>),
#                   or items with extra data (LEATHER_HELMET{color=blue})
#   Wearables:
#     Helmet:       Armor piece for the head slot; leave blank for none
#     Chestplate:   Armor piece for the chest slot; leave blank for none
#     Leggings:     Armor piece for the legs slot; leave blank for none
#     Boots:        Armor piece for the feet slot; leave blank for none
#   Difficulty:     Combat profile that scales aim error, reaction time, fire rate, and melee
#                   damage. One of EASY, NORMAL, HARD, DEADLY. Defaults to NORMAL when omitted.
#   Tactics:        Per-tier squad-tactics override, read over Cops.Tactics below (see its own comments).
#   Fire_Rate_Multiplier: Gun cadence as a fraction of the weapon's own (player) fire rate, on top of the
#                   Difficulty's fire rate. 1.0 = as fast as a player holding the gun; 0.1 = a tenth as often.
#                   Must be above 0. When omitted, 1 / Cops.Behaviour.AI_Tick_Rate (below).
#                   The shipped 0.1 keeps the pre-0.12 time-to-kill: NPC guns used to advance one weapon tick
#                   per cop AI tick (AI_Tick_Rate: 10), i.e. a tenth of the weapon's rate. A vanilla BOW/CROSSBOW
#                   (no Bartizan weapon) counts from a 15-tick base, so 0.1 fires every 150 ticks at NORMAL (7.5 s),
#                   exactly as before.
# ============================================
Cops:
   # Count, Behaviour, Spawn, Pursuit, Return and Navigation moved here from settings.yml in 0.15.1. A value still
   # tuned in settings.yml, or in the settings-old.yml backup the upgrade leaves, is used (console warning) until it
   # is copied here; delete it there afterwards.
   Count:
      # Set to true to evaluate the Formula string below instead of the linear Base/Per_Level/Max calculation.
      Formula_Enabled: false
      # Formula evaluated when Formula_Enabled is true.
      # Available variables: level, base, perLevel, max
      # Example: "base + (level - 1) * perLevel" (equivalent to the built-in linear formula)
      Formula: "base + (level - 1) * perLevel"
      # Cops at wanted level 1 (used for both the linear formula and as the 'base' variable)
      Base: 2
      # Additional cops per wanted level above 1 (used for both modes, exposed as 'perLevel')
      Per_Level: 1
      # Hard cap - result is always clamped to this value
      Max: 8

   # Core behavior values shared across all cop tiers.
   Behaviour:
      # Hard cap on the number of cop NPCs active per wanted player at any time.
      Max_Per_Player: 8
      # Game ticks between each AI evaluation cycle. Lower = faster reactions, higher CPU cost.
      AI_Tick_Rate: 10
      # Game ticks between each check that decides whether to spawn more cops.
      Spawn_Check_Rate: 40
      # Default radius within which a cop can attempt to cuff the target (blocks). Tiers may override this.
      Cuff_Radius: 3.0
      # How many cuff attempts a cop makes before giving up and switching to combat.
      Max_Cuff_Attempts: 3
      # Game ticks the cop waits between consecutive cuff attempts.
      Cuff_Cooldown_Ticks: 100
      # Sight range (blocks): a cop sees a wanted player within this distance when it has line of sight, and
      # every sighting is shared with the other cops chasing that player.
      Alert_Range: 40.0
      # Distance at which a MELEE cop may start an attack. Ranged cops fire at anything they can see within
      # Alert_Range. A swing lands only within Cops.Melee.Reach (below).
      Combat_Range: 4.0
      # Game ticks between melee attacks.
      Attack_Cooldown_Ticks: 20
      # Radius (blocks) the guarding cop tries to stay within the cuffed player.
      # (Formerly settings.yml Detainment.Transit.Guard_Radius.)
      Guard_Radius: 5.0

   # Controls where cop NPCs spawn relative to the target player.
   Spawn:
      # Minimum distance from the player to spawn a cop (blocks).
      Min_Distance: 10.0
      # Maximum distance from the player to spawn a cop (blocks).
      Max_Distance: 50.0
      # Minimum ring distance used during phase-1 (preferred-ring, behind-player) spawn attempts (blocks).
      Phase1_Min_Distance: 30.0
      # Amount the ring radius shrinks per phase-2 iteration (blocks).
      Radius_Shrink_Step: 5.0
      # Vertical range searched above/below the player's Y level to find valid ground (blocks).
      Vertical_Search_Range: 10
      # Y-offset added to the player's Y when searching for spawn ground. 0 = same level as player.
      Y_Offset: 0
      # Minimum number of open horizontal sides required at a spawn position.
      Min_Open_Sides: 2
      # Radius within which a registered cop spawner is preferred over a random position (blocks).
      Spawner_Preference_Radius: 80.0
      # Distance within which another player triggers the visibility check during despawn (blocks).
      Visibility_Check_Distance: 48.0
      # Number of attempts in phase-1 (preferred ring, behind-player) of spawn location selection.
      Phase1_Attempts: 20
      # Number of attempts per shrink step in phase-2 of spawn location selection.
      Phase2_Attempts: 15
      # Maximum |spawnY - playerY| allowed for a chosen spawn location (blocks). The vertical search
      # may scan further to locate ground (see Vertical_Search_Range) but the resulting position is
      # rejected if the cop ends up too far above or below the player — prevents cops from spawning
      # on a rooftop while the player is on the street, or vice-versa.
      Max_Y_Diff: 4.0
      # Maximum |spawnerY - playerY| allowed when picking a registered cop spawner (blocks). Filters
      # out spawners whose Y is too far from the player so the spawned cop can plausibly path to them.
      # Generous default so a roof-vs-ground-floor pair both apply, but a tower 25+ blocks above the
      # street is excluded.
      Spawner_Max_Y_Diff: 16.0

   # Controls when a pursuing cop gives up chasing its target and transitions to RETURNING.
   # Acts as a final-fallback leash so stuck/unreachable cops don't occupy the per-player cap forever.
   Pursuit:
      # Distance from the target (blocks) beyond which the pursuing cop gives up.
      Max_Distance: 80.0
      # AI ticks a pursuing cop may stay stuck while no cop chasing the same player can see them before it gives up
      # (the spawner replaces it). Ticks where it moves or anyone sees the player reset the count.
      # Default 120 = ~60 s at AI_Tick_Rate: 10 (10 game ticks per AI tick, 20 TPS).
      Max_Ticks: 120

   # Controls how a cop returns to its station and despawns after the target is detained.
   Return:
      # Maximum AI ticks the cop waits before being force-despawned. (600 = ~300 s at the default AI_Tick_Rate: 10)
      # A cop whose way back to the station has no route despawns sooner, after Cops.Stuck.Recycle_Seconds.
      Max_Ticks: 600
      # Distance to the station at which the cop considers itself arrived and attempts to despawn (blocks).
      Station_Arrival_Distance: 3.0

   # Pathfinding and stuck detection for cops: the cops' own copy of settings.yml NPC_Navigation (civilians keep
   # theirs).
   Navigation:
      # Ticks between navigation path recalculations. Lower = more responsive but higher CPU cost.
      Recalculation_Ticks: 10
      # Ticks a cop waits before re-pathing after losing its route.
      Min_Repath_After_Loss_Ticks: 2
      # AI ticks between movement-progress samples for stuck detection.
      Stuck_Check_Interval: 5
      # Consecutive stuck samples required before navigation is considered stuck.
      Max_Stuck_Checks: 3
      # Consecutive stuck samples required before navigation is considered permanently hopeless.
      Max_Hopeless_Stuck_Checks: 6
      # Distance (blocks) below which a hopeless NPC can still navigate to the target directly.
      Hopeless_Close_Threshold: 8.0
      # Minimum distance the NPC must travel between samples to count as progress (blocks).
      Min_Progress_Distance: 0.75
      # Ranged cops hold their firing position when the target is within this distance range (blocks).
      # A role in copsncrooks/cop_roles.yml can set its own band.
      Ranged_Min_Distance: 7.0
      Ranged_Max_Distance: 12.0

   # Melee band for every cop swing. The cooldown is Cops.Behaviour.Attack_Cooldown_Ticks (above).
   Melee:
      # A swing lands only when the cop is at most this many blocks from the target (feet to feet).
      Reach: 3.0
      # Melee cops stop and surround here. Capped at each tier's Cuff_Radius - 0.5. Full damage inside this distance.
      Approach: 2.0
      # Melee damage varies by up to this fraction either way (0.15 = +/-15%).
      Damage_Spread: 0.15
      # Fraction of full damage a swing deals at the very edge of Reach (falls linearly from Approach).
      Edge_Damage: 0.7
   # Squad tactics defaults for every tier. A tier's own Tactics block overrides these key by key.
   Tactics:
      # false = 0.11 positioning only: shooters freeze in their firing band, no formation, no order/contact/reload
      # radio. Casualty/backup/dispatch radio and retreat stay on (Radio, Backup and Retreat have their own switches).
      Enabled: true
      # Degrees the squad's shooters spread over around the target (0-360). Cop-on-cop damage is cancelled, so cops
      # default to a wide horseshoe; melee tiers always surround.
      Formation_Arc: 270.0
      # Degrees a shooter side-steps along its ring at each reposition (0 = walk to its slot and stand).
      Strafe_Degrees: 15.0
      # Server ticks between a shooter's repositions (jittered +/-25%, minimum 20).
      Reposition_Ticks: 60
      # Extra aim error while the cop is walking (same unit as the Difficulty aim error).
      Moving_Aim_Error: 0.10
   Radio:
      # Set to false to silence the police radio for players (cops still respond to each other).
      Enabled: true
      # Players within this many blocks of the speaking cop, or of the addressed cop, hear the line. Also how far
      # other cops hear a Contact / Man_Down / Backup call and respond.
      Range: 32.0
      # The hunted player hears their own pursuers from this far away.
      Target_Range: 64.0
      # Minimum gap between two lines from one squad (priority lines and acks skip it).
      Squad_Gap_Ticks: 30
      # Minimum gap between two low-priority lines reaching one player, across all squads.
      Player_Gap_Ticks: 20
      # Ticks before an ordered cop acknowledges a delivered order. Forced to at least Player_Gap_Ticks + 5.
      Ack_Delay_Ticks: 25
      # Nearby cops (returning, idle or chasing a civilian) pulled in per radio call. 0 = none.
      Responder_Max: 2
      # Line kinds that skip the squad and player gaps (they still respect their own cooldown).
      Priority:
         - "Contact"
         - "Man_Down"
         - "Leader_Down"
         - "Commander_Down"
         - "Backup"
         - "Resisting"
         - "Dispatch_Wanted"
         - "Escalate"
         - "Stand_Down"
         - "Fall_Back"
         - "In_Cover"
         - "Hit"
         - "Patched_Up"
         - "Marksman_Spotted"
         # Dispatch lines read right after Dispatch_Wanted: they must not lose to the player gap.
         - "Dispatch_En_Route"
         - "Wipe_Refill"
      # One squad never repeats the same kind of line within this many ticks.
      Cooldown_Ticks:
         Contact: 160
         Contact_Lost: 160
         Engage: 300
         Push: 200
         Flank_Left: 200
         Flank_Right: 200
         Reposition: 100
         Search: 300
         Route: 300
         Route_High: 300
         Climb: 300
         No_Route: 300
         Check_Fire: 160
         Reloading: 160
         Man_Down: 100
         Leader_Down: 100
         Commander_Down: 100
         Resisting: 200
         Backup: 400
         Responding: 100
         Ack: 40
         Fall_Back: 100
         In_Cover: 200
         Stand_Down: 200
         Hit: 100
         Medic_Moving: 100
         Covering_Fire: 200
         Medic_Pinned: 160
         Patched_Up: 100
         Overwatch_Set: 400
         Marksman_Spotted: 160
         Marksman_Lost: 160
         Marksman_Reloading: 160
         Shield_Up: 400
         Flanking: 200
         Commander_Orders: 400
         Status_Check: 400
         Pull_Back: 300
         Medic_Treating: 200
         # Squad pulls back after casualties, then pushes once it is regrouped with its backup (see Cops.Regroup).
         Regroup: 1200
         Regroup_Push: 1200
         # A shot heard by cops; one squad hunts one player, so this is the per-shooter throttle (60 = 3 s).
         Shots_Fired: 60
         # Dispatch and perimeter lines (see Cops.Dispatch, Cops.Handoff, Cops.Perimeter). The two dispatch lines have
         # no cooldown: each is one announcement.
         Dispatch_En_Route: 0
         Wipe_Refill: 0
         Handoff: 200
         Post_Up: 100
         Eyes_On: 60
         Returning_To_Patrol: 1200
      # Short click played to each listener with every line (SoundConfiguration shape).
      Sound:
         Name: BLOCK_NOTE_BLOCK_HAT
         Volume: 0.4
         Pitch: 1.8
   Backup:
      # When a cop goes down, the squad radios for backup.
      Enabled: true
      # Extra cops on top of the wanted-level count (still capped by Behaviour.Max_Per_Player).
      Extra_Cops: 1
      # How long the extra cops stay requested (600 = 30 s). Afterwards the surplus cops that are not fighting walk home.
      Duration_Ticks: 600
      # Minimum gap between two backup requests from one group (1200 = 60 s).
      Cooldown_Ticks: 1200
   # A squad that loses Casualties cops within Window_Seconds falls back to cover (Lines.Regroup) for up to
   # Fall_Back_Seconds, then pushes together (Lines.Regroup_Push) once the whole squad, backup included, is within
   # Arrival_Radius blocks of the suspect. A regroup also grants the backup it waits for (past the Backup cooldown)
   # unless one is already active. With Backup off (or Extra_Cops 0) the squad still falls back and pushes, silently.
   # One regroup per Cooldown_Seconds; squads set to cuff first never regroup.
   Regroup:
      Enabled: true
      Casualties: 2
      Window_Seconds: 20
      Fall_Back_Seconds: 15
      Cooldown_Seconds: 60
      Arrival_Radius: 24.0
   # Where a wanted level's cops come from. With Enabled, units leave the nearest police station (spawners within
   # Station_Radius blocks of a station belong to it) and arrive after an ETA of distance / Unit_Speed, clamped to
   # Min_Eta_Seconds..Max_Eta_Seconds and rounded up; the radio announces the units en route. A world with no
   # station keeps the old ring spawn around the suspect. Disabled = the 0.15 instant ring spawn.
   Dispatch:
      Enabled: true
      # Blocks a unit covers per second on its way.
      Unit_Speed: 10.0
      # Shortest and longest ETA, in seconds.
      Min_Eta_Seconds: 0
      Max_Eta_Seconds: 40
      # Spawners within this many blocks of a station join that station.
      Station_Radius: 32.0
      # Seconds a player's pending units survive his logout, so a quick rejoin keeps them.
      Rejoin_Grace_Seconds: 15
   # The pause after a squad is wiped out before its replacement is dispatched.
   Breather:
      Enabled: true
      # Seconds of breather for 1, 2, 3, 4 and 5 stars (more stars, shorter pause); other levels use the nearest end.
      Seconds:
         - 15
         - 13
         - 10
         - 8
         - 6
      # A squad counts as wiped when it loses every cop within this many seconds.
      Wipe_Window_Seconds: 10
   # When a suspect breaks contact the squad radios the heading and units ahead pick him up.
   Handoff:
      Enabled: true
      # Seconds of travel used to read the suspect's heading.
      Heading_Seconds: 2
      # Seconds the hand-off biases where reinforcements appear.
      Bias_Seconds: 10
      # Half-angle, in degrees, either side of the heading of that bias.
      Cone_Degrees: 60.0
   # While a suspect of at least Min_Level stars is out of sight, up to Posts cops hold posts on a ring around the zone
   # (Roles first) and watch for him, for at most Max_Seconds.
   Perimeter:
      Enabled: true
      Min_Level: 3
      # Most cops posted at once; the last free cop is never posted.
      Posts: 2
      # Roles posted first.
      Roles:
         - "Marksman"
         - "Defender"
      Max_Seconds: 60
      # Blocks of clear lane kept toward the centre of the zone.
      Lane_Length: 16.0
      # How far a posted cop sees. The ring radius is the smaller of the zone radius and 0.8 x this.
      Sight_Range: 40.0
      # How far a posted cop may stray from its post.
      Leash_Radius: 4.0
   # How far cops hear a shot, in blocks, by weapon type (0 = silent). Unlisted types are silent. The ids below are
   # weapon-type enum names (GUN, THROWABLE, MELEE), matched case-insensitively; they are not config keys in the
   # Capitalized_Underscore style.
   Shot_Noise:
      Enabled: true
      Radius:
         GUN: 48
         THROWABLE: 16
         MELEE: 0
   # A badly hurt cop breaks off, radios it (Lines.Fall_Back / In_Cover) and takes cover out of the suspect's sight
   # for up to 10 seconds, then comes back out and fights on.
   Retreat:
      # Set to false and cops fight on until they drop (no fall-back after a Commander goes down either).
      Enabled: true
      # Retreat at or below this fraction of max health (0-1; 0.3 = 30%).
      Health_Fraction: 0.3
      # Blocks searched around the cop for a spot the suspect cannot see (2-32).
      Radius: 12.0
   # Every cop gets a callsign such as "Officer ✚ Medic Bob #1592", shown above its head and (without colours) used
   # on the radio.
   Names:
      # %rank% = the tier's Display_Name, %role% = the cop's squad role as its coloured symbol and word (Display in
      # copsncrooks/cop_roles.yml; for a cop with no role it goes away with the extra space), %name% = a first name from
      # First_Names, %badge% = 1000 + the NPC id (unique among live NPCs). Remove %role% to hide the role.
      Format: "%rank% %role% &f%name% &7#%badge%"
      # Leave the list empty ([]) for no first name ("Officer #1592"); remove the key for the built-in names.
      First_Names:
         - Bob
         - Jim
         - Carl
         - Dave
         - Frank
         - Mike
         - Tony
         - Steve
         - Ray
         - Eddie
         - Gus
         - Hank
         - Joe
         - Lou
         - Marty
         - Nick
         - Pete
         - Rick
         - Sam
         - Vince
         - Walt
         - Ann
         - Kate
         - Linda
         - Maria
         - Rosa
         - Sue
         - Tina
   Stuck:
      # Set to false and a cop that cannot reach the suspect stays where it is.
      Enabled: true
      # Seconds a cop may find no way to the suspect before it is taken off the map and a new one is sent from a
      # spot closer to his level (at least 1). A cop he is looking at (in front of him, clear line, within
      # Cops.Spawn.Visibility_Check_Distance above) is kept; past twice this, only within 24 blocks.
      # A cop returning to its station that finds no way there for this long despawns too (Return.Max_Ticks is the
      # final backstop).
      Recycle_Seconds: 12
      # Seconds the spawner a recycled cop came from is skipped for its replacements (0 = never skipped).
      Avoid_Spawner_Seconds: 60
   # Field care: a hurt cop limps and bleeds and radios Lines.Hit; a Medic-role cop of its squad walks over and treats
   # it. The patient holds still and crouches while treated (it keeps firing), and a hit on the medic starts the
   # treatment over (Lines.Medic_Pinned). A squad without a Medic cop never heals. Every key is optional.
   Field_Care:
      # Set to false: no limp, bleeding or treatment at all.
      Enabled: true
      # Hurt at or below this fraction of max health (0-1; 0.5 = 50%). Keep it above Retreat.Health_Fraction.
      Health_Fraction: 0.5
      # A hurt cop's walking speed, as a fraction of its tier Speed (0.1-1).
      Limp_Speed: 0.7
      # Set to false: cops still get hurt, but no medic treats them.
      Medic_Enabled: true
      # Blocks a medic answers a hurt squad mate within (2-64). 36 reaches a Marksman holding its far post.
      Medic_Radius: 36.0
      # Blocks from the patient the medic treats it from (1-6).
      Heal_Range: 2.5
      # Ticks one treatment takes (60 = 3 s).
      Channel_Ticks: 60
      # Share of max health one treatment restores (0-1).
      Heal_Fraction: 0.5
      # The blood a hurt cop sheds: redstone-block particles at random body spots (1-2 per burst), denser the more hurt,
      # plus a heavier burst on every hit taken while hurt.
      Hurt:
         # Particle type. BLOCK_CRACK (BLOCK on 1.20.5+) is drawn with redstone-block data; any other name that is not
         # found falls back to the block particle, then to red dust.
         Bleed_Particle: BLOCK_CRACK
         # Particles per spot at the hurt threshold (1-50); up to double that at death's door.
         Bleed_Count: 6
         # Spots a burst picks from: HEAD, CHEST, LEFT_ARM, RIGHT_ARM, LEFT_LEG, RIGHT_LEG.
         Bleed_Spots:
            - HEAD
            - CHEST
            - LEFT_ARM
            - RIGHT_ARM
            - LEFT_LEG
            - RIGHT_LEG
   Tiers:
      1:
         Display_Name: "&9Officer"
         Health: 20.0
         Damage: 2.0
         Speed: 1.0
         Cuff_Radius: 3.0
         Can_Use_Weapons: false
         Skip_Cuffing: false
         Difficulty: EASY
         # Gun cadence: a fraction of the weapon's own fire rate (see the header). Only used with Can_Use_Weapons.
         Fire_Rate_Multiplier: 0.1
         # Accepts vanilla materials (IRON_SWORD) or custom items (weapon:rifle, LEATHER_HELMET{color=blue})
         Weapon_Pool:
            - "WOODEN_SWORD"
         Wearables:
            Helmet: ""
            Chestplate: ""
            Leggings: ""
            Boots: ""
         # Melee tier: the formation arc is ignored (melee always surrounds at 360/n).
         Tactics:
            Strafe_Degrees: 10.0
            Reposition_Ticks: 80
            Moving_Aim_Error: 0.15
      2:
         Display_Name: "&9Sergeant"
         Health: 25.0
         Damage: 3.0
         Speed: 1.1
         Cuff_Radius: 3.5
         Can_Use_Weapons: false
         Skip_Cuffing: false
         Difficulty: EASY
         # Gun cadence: a fraction of the weapon's own fire rate (see the header). Only used with Can_Use_Weapons.
         Fire_Rate_Multiplier: 0.1
         Weapon_Pool:
            - "STONE_SWORD"
         Wearables:
            Helmet: "LEATHER_HELMET"
            Chestplate: ""
            Leggings: ""
            Boots: ""
         # Melee tier: the formation arc is ignored (melee always surrounds at 360/n).
         Tactics:
            Strafe_Degrees: 10.0
            Reposition_Ticks: 80
            Moving_Aim_Error: 0.15
      3:
         Display_Name: "&1Lieutenant"
         Health: 30.0
         Damage: 4.0
         Speed: 1.2
         Cuff_Radius: 4.0
         Can_Use_Weapons: true
         Skip_Cuffing: false
         Difficulty: NORMAL
         # Gun cadence: a fraction of the weapon's own fire rate (see the header). Only used with Can_Use_Weapons.
         Fire_Rate_Multiplier: 0.1
         Weapon_Pool:
            - "weapon:rifle"
            - "CROSSBOW"
         Wearables:
            Helmet: "CHAINMAIL_HELMET"
            Chestplate: "CHAINMAIL_CHESTPLATE"
            Leggings: ""
            Boots: ""
         Tactics:
            Formation_Arc: 200.0
            Strafe_Degrees: 10.0
            Reposition_Ticks: 80
            Moving_Aim_Error: 0.12
      4:
         Display_Name: "&1SWAT"
         Health: 40.0
         Damage: 5.0
         Speed: 1.3
         Cuff_Radius: 4.5
         Can_Use_Weapons: true
         Skip_Cuffing: true
         Difficulty: HARD
         # Gun cadence: a fraction of the weapon's own fire rate (see the header). Only used with Can_Use_Weapons.
         Fire_Rate_Multiplier: 0.1
         Weapon_Pool:
            - "weapon:rifle"
            - "CROSSBOW"
         Wearables:
            Helmet: "IRON_HELMET"
            Chestplate: "IRON_CHESTPLATE"
            Leggings: "IRON_LEGGINGS"
            Boots: "IRON_BOOTS"
         Tactics:
            Formation_Arc: 270.0
            Strafe_Degrees: 15.0
            Reposition_Ticks: 60
            Moving_Aim_Error: 0.10
      5:
         Display_Name: "&4Military"
         Health: 60.0
         Damage: 7.0
         Speed: 1.4
         Cuff_Radius: 5.0
         Can_Use_Weapons: true
         Skip_Cuffing: true
         Difficulty: DEADLY
         # Gun cadence: a fraction of the weapon's own fire rate (see the header). Only used with Can_Use_Weapons.
         Fire_Rate_Multiplier: 0.1
         Weapon_Pool:
            - "weapon:rifle"
            - "CROSSBOW"

#   +------------------------------------------------------+   #
# |                    File: wanted.yml                      | #
#   +------------------------------------------------------+   #
#
# The chase: how crimes add up to stars (Heat), how losing the cops takes them away (Evasion), what the player sees
# (Hud) and what an arrest costs (Charge_Sheet). Every feature has its own Enable key; switching one off restores
# the behaviour from before 0.15.0.

Wanted:
   # Number of kills to get a wanted level. Moved here from settings.yml (Wanted.Kill_Combo) in 0.15.1; a value still
   # tuned in settings.yml, or in the settings-old.yml backup the upgrade leaves, is used (console warning) until it
   # is copied here. Delete it there afterwards.
   Kill_Combo:
      # false = no combo: with Heat off every counted kill adds a star at once, and no crime is ever chained.
      Enable: true
      # The time till the kill combo resets (seconds). Also the window Heat.Streak_Bonus chains crimes in.
      Reset_After: 10
      # The kill counter to increment the wanted level.
      Kill_Counter:
         - 2
         - 5
         - 10
         - 15
         - 20

   # Crimes add heat; heat becomes stars.
   Heat:
      # false = no heat ledger, stars rise the way they did before 0.15.0
      Enable: true
      # Heat needed for star 1, 2, 3, ... A shorter list than the max wanted level is stretched evenly
      Star_Thresholds:
         - 100
         - 250
         - 450
         - 700
         - 1000
      # Multiplier for crimes chained inside Kill_Combo.Reset_After (above). It only applies while
      # Kill_Combo.Enable is true; with the kill combo off no crime is ever treated as chained.
      Streak_Bonus: 1.5
      # Multiplier when a cop saw the crime
      Seen_By_Cop_Multiplier: 1.5
      # Multiplier for a crime inside a contested turf
      Turf_War_Multiplier: 0.5
      # Seconds before hitting the same victim counts as a new assault
      Assault_Repeat_Seconds: 10
      # Heat per crime. Kill_*, Assault_Cop and Resisting_Arrest are reported in 0.15.0; the rest are read by later
      # releases
      Crimes:
         # Aiming a weapon with a cop close by
         Brandish_Near_Cop: 25
         # Hitting a civilian
         Assault_Civilian: 30
         # Stealing a car
         Car_Theft: 60
         # Killing another player
         Kill_Player: 80
         # Killing a civilian
         Kill_Civilian: 100
         # Hitting a cop
         Assault_Cop: 100
         # Fighting off an arrest
         Resisting_Arrest: 100
         # Killing a cop
         Kill_Cop: 150
         # Cracking a safe
         Safe_Cracking: 150
         # Robbing a store
         Store_Robbery: 200
         # Entering a restricted place
         Trespass_Restricted: 300
         # Breaking out of jail
         Jailbreak: 450

   # Losing the cops takes stars away.
   Evasion:
      # false = the old fixed decay timer only. Replaces the fixed decay timer while cops hunt you; settings.yml
      # Wanted.Repeating_Timer stays as the safety net
      Enable: true
      # Seconds with no cop seeing you before the search zone appears
      Lost_Sight_Seconds: 3
      # What a completed evasion takes: ONE_STAR (one star), ALL_STARS (every star) or AUTO (the cops judge how the
      # chase went and take one star, a share of them or all; see the Auto block below)
      Drop_Mode: ONE_STAR
      # Search zone radius in blocks for wanted level 1, 2, 3, ...
      Search_Radius:
         - 40
         - 60
         - 90
         - 130
         - 180
      # Seconds to stay hidden for wanted level 1, 2, 3, ...
      Seconds_To_Drop:
         - 10
         - 20
         - 30
         - 45
         - 60
      # How much faster the timer runs while you are outside the search zone
      Outside_Zone_Speed: 2.0
      # While you are inside a hideout (a gang waypoint, or a region tagged hideout) the timer runs this many times
      # faster; set Enable false to make hideouts no different from open ground
      Hideout:
         Enable: true
         Speed: 2.0
      # The longer you go without a crime the faster the timer runs (stars from signs or commands do not count);
      # it never applies while a cop sees you
      Quiet_Speed:
         Enable: true
         # Speed added for every full quiet minute
         Per_Minute: 0.25
         # Highest speed the quiet bonus reaches
         Max: 2.0
         # After this many quiet seconds the next backup wave is skipped
         Backup_Skip_Seconds: 60
      # Cap on the zone, hideout and quiet speeds multiplied together (at least 1)
      Max_Speed: 4.0
      # Read only while Drop_Mode is AUTO. First match wins when the hide timer runs out: a hot chase loses one star;
      # a small chase or a long quiet one loses every star; leaving the search zone loses half your stars; anything
      # else loses one star, and the next timer is shorter
      Auto:
         # Seconds from the first crime of a chase that count as its opening
         Opening_Seconds: 30
         # Crimes in the opening that make the chase a rampage
         Rampage_Crimes: 4
         # Only crimes at least this heavy count toward the rampage opening; the shipped cheap crimes
         # (Brandish_Near_Cop 25, Assault_Civilian 30, Car_Theft 60) never do
         Rampage_Min_Weight: 80
         # Peak stars that make a chase a rampage however it started (killing a cop always does)
         Rampage_Peak_Level: 4
         # A rampage, or a chase you logged out of, loses one star at a time until this many seconds pass with no
         # new crime and no new star
         Lock_Cool_Seconds: 180
         # Times the cops may spot you again after losing you before small chases and clean breaks stop paying out
         Respot_Limit: 4
         # A small chase: the cops let it go and every star drops at once
         Petty:
            # Most crimes a chase may hold to count as small (a chase with no crime never counts)
            Max_Crimes: 2
            # Highest star level a chase may reach to count as small (keep it below Rampage_Peak_Level)
            Max_Peak_Level: 2
         # A long chase that went quiet: every star drops at once
         Cold_Trail:
            # A fresh server's guess, in seconds, of how long the cops stay on your tail before they lose you for
            # good, for a chase that peaks at star 1, 2, 3, ... With Learning on, the server replaces it with what it
            # measures, never below half or above double these numbers
            Typical_Seconds:
               - 30
               - 60
               - 90
               - 120
               - 150
            # The whole chase must have lasted this many times that typical time
            Ratio: 2.0
            # Seconds with no new crime and no new star
            Quiet_Seconds: 90
         # You ran out of the search zone instead of sitting in it. A teleport of more than 32 blocks or into another
         # world (a command, a plugin or a portal; not an ender pearl) during the search never counts as a clean break
         Clean_Break:
            # Share of the search time you must spend outside the zone (0 to 1)
            Outside_Ratio: 0.5
            # Share of your stars that drop (0 to 1), rounded up, at least one star
            Drop_Fraction: 0.5
         # After a star falls and you are still hidden, the next timer is shorter
         Momentum:
            # Each step is this share of the previous timer (1.0 = no speed-up)
            Step_Speed: 0.75
            # The same after a narrow escape. A chase that is still hot (a rampage, or you logged out) gets no
            # speed-up at all, narrow or not
            Narrow_Step_Speed: 0.5
            # Seconds a cop must have kept you in sight before you broke away for it to count as a narrow escape
            Narrow_Seen_Seconds: 20
            # No timer ever shrinks below this share of Seconds_To_Drop, whatever momentum and the learned habit say
            Floor: 0.4
         # Chases with at least one crime that you ended recently; at this many the cops stop going easy (0 = off, at most 8)
         Repeat_Chases: 3
         # How far back those chases count, in minutes (kept in memory, forgotten at restart)
         Repeat_Window_Minutes: 30
         # Learning from finished chases (two small tables in the plugin database)
         Learning:
            # false = nothing is stored or read; AUTO uses Typical_Seconds and treats everyone as a stranger
            Enable: true
            # How often chases that peak at 1, 2, 3, ... stars end in a getaway on a fresh server (0 to 1)
            Escape_Rate:
               - 0.90
               - 0.75
               - 0.55
               - 0.35
               - 0.20
            # Chases of evidence a player needs before his habit counts fully (bigger = slower to judge)
            Prior_Chases: 5
            # How much an older chase still counts after each newer one (0.90 = roughly the last 10 chases)
            Decay_Per_Chase: 0.90
            # A player whose escape habit reaches this is a known face: no small-fry or clean-break lumps
            Habitual_Escaper_Delta: 0.20
            # How strongly the habit stretches (always escapes) or shortens (always caught) the timer
            Habit_Time_Strength: 0.8
            # The habit on its own never shortens a timer below this share; with momentum on top, Momentum.Floor is
            # the overall limit
            Min_Time_Factor: 0.6
            # No timer is ever stretched above this share of Seconds_To_Drop
            Max_Time_Factor: 1.6
            # Chases shorter than this many seconds are not learned from
            Min_Chase_Seconds: 30
            # A player's chases that end closer together than this many seconds are not learned from
            Min_Seconds_Between_Outcomes: 180
            # Habit rows of players not seen in a chase for this many days, and star-level rows not updated for this
            # many days, are deleted at startup
            Forget_After_Days: 90

   # What happens after an escape: you lost your last star by staying out of sight. The cops keep searching, and a
   # bounty is put on you (the auto bounty of your level and the wanted level you fled at).
   Post_Escape:
      # false = an escape ends the chase at once, as before the search: the cops stand down and walk home, no search,
      # no bounty
      Enable: true
      # How long the cops keep searching after the escape, in seconds. The search ends early if you are arrested, die
      # or get wanted again
      Search_Seconds: 120
      # false = no chat line when the bounty goes on you and when the cops give up (the bounty bar still shows)
      Announce: true

   # What the player sees and hears while chased.
   Hud:
      # The boss bar with the stars and the state of the chase
      Boss_Bar:
         # false = no boss bar
         Enable: true
      # The line explaining why a star was raised or lost
      Star_Card:
         # false = no star card
         Enable: true
      # The star count flashed on the screen
      Title:
         # false = no title
         Enable: true
      # The siren sound, played with the title flash when a star is gained
      Siren:
         # false = silent
         Enable: true
         # Sound name
         Sound: "BLOCK_NOTE_BLOCK_BELL"
         # Loudness
         Volume: 1.0
         # Pitch
         Pitch: 0.5
      # The ring of particles marking the search zone, seen only by the chased player
      Zone_Ring:
         # false = no ring
         Enable: true
         # Particle name
         Particle: "DUST"
         # Particles drawn around the ring
         Points: 48
      # The way out of the search zone: an arrow and the distance in the boss bar, and the needle of a compass (or the
      # phone) in your hand. It never shows where the cops are
      Compass:
         # false = no arrow, and a held compass keeps its own target
         Enable: true
      # The bounty bar after an escape: the bounty on you and that the cops are still looking, counting down with the
      # search. Shown only while Post_Escape is on
      Bounty:
         # false = no bounty bar (the chat line about the bounty still shows)
         Enable: true
         # Bar colour: BLUE, GREEN, PINK, PURPLE, RED, WHITE or YELLOW
         Bar_Color: "YELLOW"

   # The fine charged when you are arrested. Wallet only, never the bank, never below zero.
   Charge_Sheet:
      # false = no fine
      Enable: true
      # Fine at no stars
      Base: 200
      # Added to the fine per wanted level
      Per_Wanted_Level: 250
      # The fine never exceeds this
      Maximum: 10000
      # Extra jail seconds per unpaid money
      Seconds_Per_Unpaid: 0.1
      # The extra jail time never exceeds this many seconds
      Max_Extra_Seconds: 600

   # A nether star lying somewhere in the world: pick it up while wanted and the cops let some stars go.
   Bribe_Stars:
      # false = no bribe stars
      Enable: true
      # Stars a pickup takes
      Stars: 1
      # Seconds before a taken pickup comes back
      Respawn_Seconds: 300
      # Blocks within which a player takes it
      Pickup_Radius: 1.5
      # The pickup's material
      Item: NETHER_STAR

#   +------------------------------------------------------+   #
# |                  File: detainment.yml                    | #
#   +------------------------------------------------------+   #
#
# Jails, cuffs, bail, bribes and sentences. Moved here from settings.yml (Detainment) in 0.15.1; the guarding cop's
# radius (Transit.Guard_Radius) went to cops.yml as Cops.Behaviour.Guard_Radius. A value still tuned in settings.yml,
# or in the settings-old.yml backup the upgrade leaves, is used (console warning) until it is copied here; delete it
# there afterwards.

Detainment:
   Jail:
      # The maximum capacity of jail inmates a jail can hold
      Max_Capacity: 10
   # After a cop successfully handcuffs a player, the cop stays in GUARDING state
   # next to the player. When the delay expires (or the player dies), the player
   # is teleported to the nearest non-full jail, their inventory is seized, and
   # they are given a Jail Paperwork item that opens the bail/bribe/sentence GUI.
   Transit:
      # Ticks between the cuff landing and the auto-teleport to jail. 400 = 20 seconds.
      Delay_Ticks: 400
   # While handcuffed, the player can spam the Sneak key to fill a break-free meter. If they reach the required
   # number of taps before the reset window runs out the cuffs come off and they run free — wanted level stays, so
   # cops will re-engage on the next AI tick.
   Break_Free:
      # Total sneak taps needed within the window to break out.
      Taps_Required: 25
      # Ticks of inactivity that reset the counter back to zero (20 ticks = 1 second).
      Reset_Window_Ticks: 40
      # 0.21.0: each sneak tap counts this much while a lockpick is in the inventory.
      Lockpick:
         Tap_Weight: 2
         # 0.21.0: chance per weighted tap that one lockpick breaks (0.0 - 1.0).
         Snap_Chance: 0.05
   # While handcuffed, right-clicking the guarding cop opens a small GUI with a
   # "Bribe" button. Cost is debited from the player's balance; no money item
   # needs to be in hand. The money.yml variation closest to the cost is shown
   # as the button icon.
   Handcuff_Bribe:
      # Cost at wanted level 0.
      Base_Cost: 500.0
      # Added per wanted level.
      Per_Wanted_Level: 250.0
   # Once jailed, "Pay Bail" on the Jail Paperwork item releases the player
   # immediately for this cost. Balance-based.
   Bail:
      # Cost at wanted level 0.
      Base_Cost: 2_500.0
      # Added per wanted level.
      Per_Wanted_Level: 1_000.0
   # "Bribe Officer" on the Jail Paperwork item is cheaper than bail but rolls
   # a chance. On failure the money is still consumed and the sentence timer is
   # extended by Fail_Penalty_Seconds.
   Jail_Bribe:
      # Cost at wanted level 0.
      Base_Cost: 1_000.0
      # Added per wanted level.
      Per_Wanted_Level: 500.0
      # Chance the bribe works (0.0 - 1.0).
      Success_Chance: 0.35
      # Seconds added to the sentence when the bribe fails.
      Fail_Penalty_Seconds: 60
   # "Serve Sentence" closes the GUI and counts down. Sentence length is based
   # on the player's wanted level at arrest time. Expires -> automatic release.
   Sentence:
      # Sentence at wanted level 0.
      Base_Seconds: 180
      # Added per wanted level.
      Per_Wanted_Level_Seconds: 60
   # Waypoint used when a jail has no explicit exit location configured via
   # /glw jail setexit. Resolved through the existing Waypoint
   Fallback_Exit_Waypoint: spawn
   # Sound names played at key detainment moments.
   Sounds:
      # Bail paid.
      Bail_Success: BLOCK_NOTE_BLOCK_PLING
      # A bribe worked, or the player broke free of the cuffs.
      Bribe_Success: ENTITY_VILLAGER_YES
      # A jail bribe failed.
      Bribe_Fail: ENTITY_VILLAGER_NO
      # The cuffed player is taken to jail.
      Transit_Commit: BLOCK_IRON_DOOR_CLOSE
      # The sentence is served.
      Sentence_Complete: BLOCK_BELL_USE
   # 0.21.0: crouch with empty hands (or a white banner) while the cops see you to surrender.
   Surrender:
      # Turns the surrender on or off.
      Enabled: true
      # Highest wanted level you can surrender at; tiers 4 and 5 skip cuffing by default.
      Max_Stars: 3
      # Sentence scale for a surrender.
      Sentence_Multiplier: 0.5
      # Charge-sheet fine scale for a surrender.
      Fine_Multiplier: 0.5
      # Bail scale for a surrender.
      Bail_Multiplier: 0.75
      # Hitting a cop this soon after surrendering adds Resisting_Arrest.
      Resist_Window_Seconds: 10
   # 0.21.0: a lethal hit with a cop within its Cuff_Radius arrests instead of downing (downed mode only).
   Busted:
      # Turns the busted arrest on or off.
      Enabled: true
   # 0.21.0: a crew mate can free a cuffed player by holding right-click on the guarding cop.
   Rescue:
      # Turns the rescue on or off.
      Enabled: true
      # How long the right-click must be held.
      Hold_Seconds: 3
      # Stars added to both the rescuer and the prisoner.
      Stars: 1

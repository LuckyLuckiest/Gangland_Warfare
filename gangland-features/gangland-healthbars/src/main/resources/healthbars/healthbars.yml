# Gangland Health Bars: a health bar over Gangland's own Citizens NPCs (cops, civilians) while they are hurt.
# The bar sits directly under a cop's callsign line, or above the head of an NPC without one, and is hidden at
# full health. Persistent (saved) and protected Citizens NPCs, such as traders and bankers, never show one.
# Every key is optional: a missing key uses the default shown here.

# Set to false to turn the bars off without removing the module.
Enabled: true
# How many cells the bar has.
Segments: 10
# The cell character; "❤" gives a row of hearts.
Symbol: "|"
# The line shown. %bar% = the bar, %health% / %max% = current / max health (one decimal), e.g. "%bar% &7%health%".
# Plain text and & colour codes only: Citizens reads "<...>" as a tag.
Format: "%bar%"
# Colour of the filled cells above 50% health, above 25% health, and at 25% or below.
High_Color: "&a"
Medium_Color: "&e"
Low_Color: "&c"
# Colour of the empty cells.
Empty_Color: "&8"

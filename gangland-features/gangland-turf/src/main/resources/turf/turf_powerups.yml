# +-----------------+ #
# | Turf Powerups   | #
# +-----------------+ #
# Catalogue of purchasable timed buffs the per-turf Quartermaster NPC sells. Each entry is keyed by a lowercase
# lookup id; the id is what code asks for and what admin commands accept. Every value is hot-reloadable — drop the
# server, edit, restart, and the registry rebuilds at next file-load phase.
#
# Effect_Type values:
#   INCOME_MULTIPLIER     Magnitude is the multiplier on the per-interval payout. 1.25 → +25% income.
#   GARRISON_DISCOUNT     Magnitude is the multiplier on the guard price (Garrison.Cost_Per_Guard below). 0.8 → 20% off.
#                         The result is clamped to 10-100% of the full price; a Magnitude outside (0, 1] warns at load.
#   CAPTURE_DEFENSE_BONUS retired in 0.17.0 (guards on the capture bar replaced it). An entry that still uses it is
#                         skipped with a warning.
#
# Cost is paid out of the owning gang's bank when the buff is activated. The prices here are the shipped defaults.
# The reserve cap on guards per turf is turf_rules.yml Garrison.Max_Reserve.
# Duration_Seconds is wall-clock; the buff expires once that many seconds elapse, regardless of capture activity.
Powerups:
   # Income boost, 1.25 times the payout for an hour.
   small_income_boost:
      Display_Name: "&aSmall Income Boost"
      # Price in the gang bank.
      Cost: 300
      Effect_Type: INCOME_MULTIPLIER
      Magnitude: 1.25
      Duration_Seconds: 3600
   # Income boost, 1.75 times the payout for an hour.
   large_income_boost:
      Display_Name: "&2Large Income Boost"
      # Price in the gang bank.
      Cost: 1000
      Effect_Type: INCOME_MULTIPLIER
      Magnitude: 1.75
      Duration_Seconds: 3600
   # Cheaper guards at the Quartermaster for half an hour.
   garrison_discount:
      Display_Name: "&bGarrison Discount"
      # Price in the gang bank.
      Cost: 2500
      Effect_Type: GARRISON_DISCOUNT
      Magnitude: 0.8
      Duration_Seconds: 1800

# Guards bought at the Quartermaster ("Garrison" panel). They hold the capture bar and fight attackers.
Garrison:
   # Price of one guard, paid from the gang bank. A garrison_discount boost multiplies it (0.8 = 20% off).
   Cost_Per_Guard: 1000

# +-------------------+ #
# | Turf NPC Settings | #
# +-------------------+ #
# Per-NPC-type knobs for the turf system's Citizens-backed NPCs:
#   - Powerup_Npc — the per-turf Quartermaster: staff place it with /glw turf powerupnpc set, the owning gang with /glw turf quartermaster
#   - Defender    — deploy-side knobs only. Defender NPCs ARE civilian NPCs (defined in civilians.yml under
#                   the type id below). Their model, health, equipment, damage, AI tuning, etc. all live there.
#                   This section only controls how the deployer routes them: which type to spawn, how far they
#                   chase attackers, and a safety lifespan in case the recall event misses them.
#
# These are NOT the powerup catalogue (which lives in turf_powerups.yml). They're hot-reloadable.
Powerup_Npc:
   # civilians.yml type id used to spawn the per-turf Quartermaster. Display name, model, equipment, health,
   # invulnerability, AI, and combat stats all live in civilians.yml under this type — turf module just routes
   # to it. While the turf is being contested, TurfPowerupNpc.engage() flips this NPC into COMBAT and points
   # its target at the closest attacker; on capture-end it pacifies back to IDLE.
   Type_Id: quartermaster
   # Quartermaster name used in its panel titles and chat lines (%npc%). The name over its head comes from civilians.yml
   # (the type above); the owning gang's tag is drawn on a line above it (turf_messages.yml Quartermaster.Nameplate_Tag).
   Display_Name: "Quartermaster"
   # Blocks from the Quartermaster within which a contest target (an attacker) is picked up. Minimum 1.0.
   Targeting_Radius: 32.0
   # Price the owning gang pays from its gang bank to place (or move) its Quartermaster with /glw turf quartermaster.
   # Staff placing it with /glw turf powerupnpc set pay nothing. 0 = free. Minimum 0.
   Placement_Cost: 5000.0
# Cop response (T-189): while a cop NPC hits a player standing on a turf their gang protects, the turf's
# Quartermaster and garrison defenders within range of the cop turn on it. They never start a fight with a cop on
# their own, and they stop again when the cop dies, the victim leaves or stops being protected, or the cop moves
# out of range.
Cop_Response:
   # Set to false and turf defenders ignore cops entirely.
   Enabled: true
   # Blocks from the defender or Quartermaster within which it answers a cop. Minimum 1.0.
   Targeting_Radius: 32.0
   # Also protect members of gangs allied with the turf owner, not only the owner's own members.
   Include_Allies: true
# Owner alerts (W7-E): a chat line and an action-bar line to the owning gang's online members when a cop attacks
# one of them on the turf, a guard falls, or the Quartermaster is attacked or killed. Allies and rivals never get them.
# Texts: turf_messages.yml Alerts.Cop_Hit, Arrested, Guard_Down, Quartermaster_Hit, Quartermaster_Down.
Owner_Alerts:
   # Seconds before the same alert for the same turf is sent again. 0 = every time. Minimum 0.
   Cooldown_Seconds: 60
Defender:
   # civilians.yml type id to spawn for each garrisoned defender. The type's combat behaviour, equipment, and
   # stats are fully owned by civilians.yml.
   Type_Id: turf_defender
   # Defenders only attack players within this distance (blocks) from their own position. Set comfortably larger
   # than the average turf radius so defenders inside the region don't lose targets who are also inside but on
   # the far edge.
   Targeting_Radius: 32.0
   # Safety lifespan — TurfDefenderDeployer.recall() should fire on capture-end, this is the fallback.
   Lifespan_Seconds: 600
# Garrison: how the guards bought at the Quartermaster defend a turf under attack. They spawn at hidden posts in waves,
# are taken out of the turf's reserve only once they have spawned, stay near the turf, and go back to the reserve when
# the fight ends. Nothing is spent on a server without Citizens.
Garrison:
   # Guards spawned per wave.
   Wave_Size: 3
   # Most guards standing at once on one turf.
   Max_Alive: 6
   # Seconds after a guard falls before the next top-up.
   Wave_Cooldown_Seconds: 20
   # Seconds survivors stay after the fight before they leave (and return to the reserve).
   Stand_Down_Seconds: 8
   # Blocks past the turf edge a guard may chase before walking back to a post.
   Leash_Margin: 16
   # Roles the guards of a turf take in spawn order (guard 1, 2, ...); the rest are plain guards. Names are the
   # AI.Combat.Roles of the Defender type in civilians.yml (Shield blocks half of a frontal hit, Marksman keeps its
   # distance, Commander: when it falls the others take cover for 5 s). "Name@2" gives two guards that role; an
   # unknown name is reported once and that guard is plain. An empty list means no roles.
   Composition:
      - "Commander@1"
      - "Shield@2"
      - "Marksman@2"
   # Share of a guard's price paid to a rival who kills it, as cash at its feet (0 turns the bounty off). Funded by the
   # owner's purchase (turf_powerups.yml Garrison.Cost_Per_Guard, discount included); nothing is minted. The owning
   # gang and its allies get nothing, and a guard drops no civilian cash.
   Bounty_Share: 0.5
   # A guard that cannot reach anyone for this many seconds, with no attacker looking at it, reappears at another post
   # (0 turns it off). The garrison's stock is unchanged.
   Recycle_Seconds: 12
   # Blocks around its post a guard keeps to while the owning gang's order is Hold (Quartermaster hub, Guard Orders):
   # it picks only attackers this close to the post and walks back when it strays further. Minimum 3.0.
   Hold_Radius: 6.0
# end Garrison

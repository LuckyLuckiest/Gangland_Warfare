# +---------------+ #
# | Turf Settings | #
# +---------------+ #
# Income, wand, outline, capture and sound knobs of the turf module. These keys lived in settings.yml
# under Turf: until 0.15.1; a value still tuned in settings.yml, or in the settings-old.yml backup the upgrade leaves,
# keeps working for now (the server log says so once),
# but copy the value here and delete it there. The turf-NPC knobs are in turf_npcs.yml and the powerup catalogue is
# in turf_powerups.yml.

# Interval (minutes) between income payouts to each turf's owning gang. Paid straight into
# the gang vault; orphaned turfs (owning gang deleted) auto-release.
Income_Interval_Minutes: 10
# Income stamped on NEW turfs by /glw turf create when no amount is given, paid every Income_Interval_Minutes while an
# owner was online in the last turf_rules.yml Income.Idle_Hours. Existing turfs keep their own amount (/glw turf income
# <amount> changes one).
Default_Income_Amount: 250
# Material given by /glw turf wand; any ItemStack NBT-tagged as a turf wand still works, so
# changing this does not invalidate previously given wands.
Wand_Item_Type: CARROT_ON_A_STICK
# Seconds the /glw turf show particle outline runs before self-cancelling.
Visualization_Duration_Seconds: 30
# Particle type spawned along the 4 vertical edges by /glw turf show (XSeries-resolved name).
Visualization_Particle: FLAME
# Whether the big title screen flashes on the player when they enter a turf. Disable to
# keep the announcement to just the action-bar line, which is less intrusive when sprinting
# across multiple turfs in a row.
Show_Enter_Title: true
# Capture subsystem. Runtime state (contested/cooldown/progress) is not persisted — only
# Last_Capture_Timestamp anchors cooldowns across restarts.
Capture:
   # Base time (seconds) for one attacker with nobody against them to fill the capture bar from 0 to 100, for owned and
   # unclaimed turfs alike. More attackers fill it faster (never faster than turf_rules.yml Capture.Min_Capture_Seconds);
   # defenders and guards push it back.
   Duration_Seconds: 180
   # Unused since 0.17.0: every capture, owned or unclaimed, fills one bar at Duration_Seconds. Kept so older files load.
   Unclaimed_Phase1_Seconds: 90
   Unclaimed_Phase2_Seconds: 90
   # Lockout window (minutes) after a capture completes during which the turf cannot be
   # contested again.
   Cooldown_Minutes: 15
   # Grace (seconds) after the challenger leaves the turf before the contest cancels as
   # ABANDONED.
   Abandon_Grace_Seconds: 15
   # Minutes after the owner gang's last member logs off. With turf_rules.yml Capture.Window OWNERS_ONLINE (the default)
   # a turf stays attackable this long after its last owner leaves, then is shielded until an owner returns. With
   # OWNERS_OFFLINE it is the other way round: shielded this long, then attackable.
   Post_Logoff_Protection_Minutes: 10
   # Days without any owner online before every turf the gang owns is released. Servers that already have this file
   # keep their own value.
   Inactivity_Auto_Release_Days: 4
   # Play the capture start / complete / failed sounds (see Sounds below) to players inside
   # the turf. Disable to keep captures silent.
   Enable_Sound: true
   # When true, a capture completing fires a server-wide broadcast message. Disable on
   # servers where capture results should stay local.
   Broadcast_Globally: true
   # Progress % thresholds that fire TurfCaptureProgressEvent on an upward crossing only —
   # oscillation in a see-saw fight does not re-emit them.
   Progress_Milestones:
      - 25
      - 50
      - 75
   # Sounds played on every player currently inside the turf when the capture state
   # transitions. Sound names resolved via XSeries so both 1.13+ and legacy ids work.
   Sounds:
      Start:
         Name: BLOCK_NOTE_BLOCK_PLING
         Volume: 1.0
         Pitch: 1.0
      Complete:
         Name: UI_TOAST_CHALLENGE_COMPLETE
         Volume: 1.0
         Pitch: 1.0
      Failed:
         Name: ENTITY_VILLAGER_NO
         Volume: 1.0
         Pitch: 1.0
      # Subtle click played to players inside the turf on every upward bossbar tick (~1 Hz) so attackers get
      # audio feedback that progress is moving. Keep Volume low — this fires every second while contesting.
      Tick:
         Name: BLOCK_NOTE_BLOCK_HAT
         Volume: 0.3
         Pitch: 1.8
      # Played to players inside a turf when its owning gang is cleared (admin
      # /glw turf setowner none, inactivity auto-release, etc.) — distinct from a failed capture so the audio
      # cue makes the meaning obvious.
      Unclaimed:
         Name: ENTITY_ENDER_DRAGON_GROWL
         Volume: 0.5
         Pitch: 1.5

# +----------------------+ #
# | Turf module messages | #
# +----------------------+ #
# Turf texts added since 0.17.0. Older turf texts are still in message_en.yml (Commands.Turf and Errors.Turf).
# Colour codes use &. Words between % signs are filled in by the plugin.

# ---------------- Reason: one sentence for every surface (map hover, HUD, info card, enter feedback) ----------------
Reason:
   # Nothing stops you from capturing this turf right now.
   Attackable: "&aattackable"
   # Captured recently. %time% = time left until it can be attacked again.
   Cooldown: "&eshielded: just captured, attackable in %time%"
   # OWNERS_OFFLINE window only: an owner was online recently. %gang% = owning gang, %grace% = Post_Logoff_Protection_Minutes.
   Owners_Active: "&eshielded: %gang% were online in the last %grace%"
   # OWNERS_ONLINE window: nobody of the owning gang online now or recently. %gang% = owning gang.
   No_Owners_Online: "&eshielded: no %gang% online (attackable when one logs in)"
   # The owning gang just came online; attackable when the wake-up shield ends. %gang%, %time% = time left.
   Waking_Up: "&eshielded: %gang% waking up, attackable in %time%"
   # The viewer's gang already holds as many turfs as its level allows (turf_rules.yml Turf_Cap).
   Over_Cap: "&eshielded: your gang already holds its turf cap"
# end Reason

# ---------------- Map: /glw map ----------------
Map:
   # First line. %owned% = turfs your gang owns.
   Header: "&7Map - &fTurfs %owned% &7- north is up - &f+ &7you"
   # First line for a player without a gang.
   Header_Gangless: "&7Map - north is up - &f+ &7you"
   # First line when no turf is in view. %turf%, %distance% (blocks), %direction% (N, NE, E, ...).
   Header_Empty: "&7No turf in view - nearest &f%turf% &7%distance%m %direction%"
   # First line when the world has no turf at all.
   Header_None: "&7No turf in this world."
   # Second legend line; it never changes.
   Legend_Key: "&7# unclaimed  &8- &7none  &7&oitalic&r &7attacked  &7&nunderlined&r &7shielded"
   # Words after a gang in the first legend line.
   Legend_You: "(you)"
   Legend_Ally: "(ally)"
   Legend_Rival: "(rival)"
   # End of the first legend line when not every gang fits. %count% = gangs left out.
   Legend_More: "+%count% more"
   # Replies of /glw map auto.
   Auto_On: "&7Auto map &aon&7: the map is sent again when what it shows changes."
   Auto_Off: "&7Auto map &coff&7."
   # Hover of a turf run, first line: the turf name. %name% = the turf display name (its own colour codes are kept).
   Hover_Name: "&f%name%"
   # Hover of a turf run: the owning gang (%gang%).
   Hover_Owner: "&7Owner &f%gang%"
   # Hover of a turf run nobody owns.
   Hover_Unclaimed: "&7Owner &fUnclaimed"
   # Hover line for a turf nobody is capturing.
   Hover_Quiet: "&7Quiet"
   # Hover line while a gang is capturing. %gang% = the challenger, %percent% = capture progress.
   Hover_Under_Attack: "&cUnder attack by %gang%, %percent%%"
   # Owning gang only: the last member logout, %time% = how long ago.
   Hover_Online: "&7Last member online &f%time% &7ago"
   # Owning gang only: a member is online now.
   Hover_Online_Now: "&7Members &aonline now"
   # Income per interval: %money_symbol% and %amount% = the income, %time% = the interval.
   Hover_Pays: "&7Pays &f%money_symbol%%amount% &7per %time%"
   # A turf with no income.
   Hover_Dormant: "&7Pays &fnothing &7(dormant)"
   # Owning gang only: %count% = guards in reserve on the turf.
   Hover_Guards: "&7Your guards: &f%count% &7in reserve"
   # Admins only, plain text, never a click. %id% = the turf id.
   Hover_Admin_Tp: "&7Admin: &f/glw turf tp %id%"
   # Hover of the plus. %place% = the turf under you or Hover_You_No_Turf, %x% and %z% = your block, %facing% = compass.
   Hover_You: "&fYou&7: %place% &8(%x%, %z%) &7facing %facing%"
   # The %place% of Hover_You when no turf covers you.
   Hover_You_No_Turf: "no turf"
   # One row of /glw map text. %relation% = Relation_ word, %reason% = a Reason line.
   Text_Row: "&f%name% &7- &f%owner% &7(%relation%) - %distance%m %direction% - %reason%"
   # The direction of a text row when the viewer stands inside that turf (no compass direction then).
   Text_Here: "here"
   # The owner in a text row when no gang owns the turf.
   Text_Unclaimed: "Unclaimed"
   # Relation words of a text row.
   Relation_Own: "own"
   Relation_Ally: "ally"
   Relation_Rival: "rival"
   Relation_Unclaimed: "unclaimed"
   # A gang with no gang of the viewer's own (gangless viewer).
   Relation_Other: "other"
   # One row of /glw map legend. %name% = full name, %relation% = Legend_You, Legend_Ally, Legend_Rival or nothing.
   Legend_Row: "&7%name% %relation%"
   # Suffix of a legend row when the gang is shielded.
   Legend_Shielded: "&7shielded"
   # Suffix of a legend row when the gang's turf is under attack.
   Legend_Under_Attack: "&7under attack"
   # /glw map legend when no gang is in view.
   Legend_Empty: "&7No gang in view."
   # Hover of the +N more entry. %list% = the entries not shown.
   Legend_More_Hover: "&7Not shown: %list%"
# end Map

# ---------------- Hud: the action-bar turf line ----------------
Hud:
   # Inside a turf. %turf% = turf name, %owner% = one of the Owner_ lines, %reason% = a Reason line, Quiet,
   # Under_Attack or Gangless.
   Inside: "&f%turf% &7- %owner% &7- %reason%"
   Owner_Own: "&ayour turf"
   Owner_Ally: "&b%gang% turf"
   Owner_Rival: "&c%gang% turf"
   # An owned turf as seen by a player without a gang.
   Owner_Gangless: "&e%gang% turf"
   Owner_Unclaimed: "&7unclaimed"
   # Reason part for a player without a gang.
   Gangless: "&ejoin a gang to capture"
   # Reason part on your own or an allied turf that nobody attacks.
   Quiet: "&aquiet"
   # Reason part on your own or an allied turf under attack. %gang% = attacker, %percent% = capture progress.
   Under_Attack: "&cunder attack by %gang%, %percent%%"
   # Outside every turf, only after /glw map hud on.
   Nearest: "&7Nearest turf: &f%turf% &7%distance%m %direction%"
   # Replies of /glw map hud.
   Mode_On: "&7Turf line: &finside turfs and the nearest turf&7."
   Mode_Off: "&7Turf line: &coff&7."
   Mode_Default: "&7Turf line: &finside turfs only&7."
   # Placeholder answer (%gangland_turf-name%, %gangland_turf-owner%, ...) when there is no turf to name.
   Placeholder_None: "-"
# end Hud

# ---------------- Info: /glw turf info card and the capture boss bar ----------------
Info:
   # Line added to /glw turf info. %reason% = a Reason line.
   Reason_Line: "&7Capture: %reason%"
   # Chat line when a gang member enters a rival or unclaimed turf that cannot be captured yet. %turf% = turf name,
   # %reason% = a Reason line.
   Blocked_Line: "&e%turf% &7- %reason%"
   # Capture boss bar title. %gang%, %turf%, %attackers%, %defenders%, %time% (time left at this pace, or Stalled).
   BossBar_Title: "&c%gang% &fis capturing &e%turf% &7- &f%attackers% &7vs &f%defenders% &7- &f%time%"
   # %time% when the capture is not moving forward.
   BossBar_Stalled: "stalled"
   # Added to the boss bar defenders count while guards hold the bar. %guards% = guards counted.
   BossBar_Guards: " &7+%guards% guards"
# end Info

# ---------------- Turf: /glw turf admin and player texts ----------------
Turf:
   # Enter title for a player without a gang.
   Title_Gangless: "&eJoin a gang to capture turf"
   # Refusal when a player without turf admin rights runs a turf admin command.
   Admin_Only: "&cOnly turf admins can do that."
   # Enter subtitle on your own turf.
   Subtitle_Own: "&aYour turf"
   # Enter subtitle on an allied turf. %gang% = owning gang.
   Subtitle_Ally: "&b%gang% turf - allied"
   # Enter subtitle on a rival turf. %gang% = owning gang, %reason% = a Reason line.
   Subtitle_Rival: "&c%gang% turf &7- %reason%"
   # Enter subtitle on an unclaimed turf. %reason% = a Reason line.
   Subtitle_Unclaimed: "&7Unclaimed &7- %reason%"
   # Refusal when a new turf is smaller than Create.Min_Side_Blocks. %x%, %z% = the sides, %min%, %max% = the limits.
   Create_Too_Small: "&cThat turf is too small: %x% x %z% blocks. The minimum side is %min% blocks."
   # Refusal when a new turf is larger than Create.Max_Side_Blocks.
   Create_Too_Large: "&cThat turf is too large: %x% x %z% blocks. The maximum side is %max% blocks."
   # Info line after a snapped create. The bounds are the snapped ones.
   Create_Snapped: "&7Snapped to chunks: (%minx%, %minz%) to (%maxx%, %maxz%)"
   # Refusal when a turf already has this name (ignoring case and colour codes).
   Name_Taken: "&cA turf named %turf% already exists."
   # Refusal when a wand corner is in another world than the other corner. Giving a new wand starts a new selection.
   Selection_Other_World: "&cThat corner is in another world than your selection. Run /glw turf wand to start a new one."
   # Reply of /glw turf rename. %old% = the old name, %turf% = the new name.
   Renamed: "&7Renamed turf &f%old% &7to &f%turf%&7."
   # Wand item name and lore.
   Wand_Name: "&6Turf Wand"
   # Wand item lore (the click controls).
   Wand_Lore: "&7Left-click = pos1, right-click = pos2."
   # Wand corner message. %corner% = Corner_1 or Corner_2, %x%, %y%, %z%, %world%.
   Corner_Set: "&7Turf %corner% &7set to &f(%x%, %y%, %z%)&7 in world &f%world%"
   # Corner names used in Corner_Set: the first and the second corner.
   Corner_1: "&apos1"
   # Name of the second corner, see Corner_1.
   Corner_2: "&epos2"
   # /glw turf status while the turf is in cooldown. %turf% = turf name, %reason% = a Reason line.
   Status_Cooldown: "&7%turf% &7- %reason%"
   # Header of /glw turf list. %page%, %pages%.
   List_Header: "&7Turfs - page %page%/%pages%"
   # One row of /glw turf list in your world. %distance% blocks, %direction% a compass word (empty when inside).
   List_Row: "&f%turf% &7- %owner% &7- &f%distance%m %direction%"
   # One row of /glw turf list in another world (and every row for the console).
   List_Row_Elsewhere: "&f%turf% &7- %owner% &7- in %world%"
   # Footer of /glw turf list when a next page exists. %next% = the page number.
   List_Next: "&7Next: /glw turf list %next%"
   # Clickable line under /glw turf help and the gang turf list.
   Map_Link: "&7[map] &8- open /glw map"
   # Refusal when a turf create or rename name is empty once colour codes are stripped (T-243).
   Name_Empty: "&cA turf name needs at least one letter or digit."
# end Turf

# ---------------- Capture: capture-rule lines (W2-R1) ----------------
Capture:
   # To the member whose login woke the gang, once per owned turf with rivals inside. %gang% = the rival gang,
   # %turf%, %time% = when the wake-up shield ends.
   Camping: "&c%gang% are camping %turf% &7- shield ends in %time%"
   # Entering an attackable rival or unclaimed turf while Presence_Seconds is on. %turf%, %seconds%.
   Count_In: "&e%turf% &7- attackable - you count after %seconds% s inside"
# end Capture

# ---------------- Alerts: turf alerts that reach a gang anywhere (W2-N1) ----------------
Alerts:
   # To the owning gang, anywhere, when a capture of their turf starts. %turf%, %count% = attackers counted,
   # %gang% = attacking gang, %direction% = N, NE, E ... from the turf centre.
   Start: "&c%turf% is under attack! &f%count% %gang% &cfrom the %direction%"
   # Same as Start when no attacker is seen on a side yet (the direction is unknown). %turf%, %count%, %gang%.
   Start_No_Side: "&c%turf% is under attack! &f%count% %gang%"
   # To the owner's allies when the capture starts (the only alert allies get). %turf%, %owner%, %gang%.
   Start_Ally: "&e%turf% &7(%owner%) &eis under attack by %gang%"
   # To the owners, once per capture, when half the guards of the turf are down. %turf%.
   Half_Guards: "&eHalf the guards at %turf% are down"
   # To the owners, once per capture, when the bar passes 75%. %turf%, %progress%.
   Last_Stand: "&cLast stand at %turf% &7- %progress%%"
   # To the owners when the attack failed (defended or abandoned). %turf%, %gang% = attackers.
   Held: "&a%turf% held &7against %gang%"
   # To the attackers when their attack failed. %turf%.
   Attack_Failed: "&7Your attack on %turf% failed"
   # To both sides when the capture ran out of time (turf_rules.yml Capture.Max_Contest_Minutes). %turf%.
   Stalled: "&7%turf%: the attack stalled"
   # To the old owners when the turf was taken. %turf%, %gang% = new owner.
   Lost: "&c%turf% lost to %gang%"
   # To the new owners. %turf%.
   Taken: "&aYou took %turf%"
# end Alerts

# ---------------- Income: the payout line and the turf cap line (W2-N2) ----------------
Income:
   # Action bar to online members at each payout. %money_symbol%, %amount% = paid this payout, %count% = turfs that
   # paid, %bank% = gang bank after the payout.
   Action_Bar: "&aTurf income +%money_symbol%%amount% &7(%count% turfs) - bank %money_symbol%%bank%"
   # Line in /glw turf for your gang. %owned% = turfs held, %cap% = turfs your gang may hold, %paying% = turfs paying now.
   Cap_Line: "&7Turfs &f%owned%/%cap% &7- &f%paying% &7paying"
# end Income

# ---------------- Digest: what happened while you were away (W2-N2) ----------------
Digest:
   # First line on join when your gang earned turf income since you left. %money_symbol%, %amount%.
   Income: "&7Income earned while you were away: &a%money_symbol%%amount%"
   # Your gang took a turf. %turf%, %gang% = previous owner ("unclaimed" when none).
   Captured: "&aCaptured %turf% &7from %gang%"
   # Your gang lost a turf to a capture. %turf%, %gang% = new owner.
   Lost: "&cLost %turf% &7to %gang%"
   # Your gang held a turf. %turf%, %gang% = attackers.
   Held: "&aHeld %turf% &7against %gang%"
   # An attack ran out of time (both sides). %turf%.
   Stalled: "&7Attack on %turf% stalled"
   # Your gang lost a turf because nobody was online for the inactivity limit. %turf%, %days%.
   Released_Inactive: "&cLost %turf% &7(no owner online for %days% days)"
   # Your gang lost a turf because its record could not be found. %turf%.
   Released_Orphaned: "&cLost %turf% &7(gang data missing)"
# end Digest

# ---------------- Quartermaster: the turf shop panels (W2-Q) ----------------

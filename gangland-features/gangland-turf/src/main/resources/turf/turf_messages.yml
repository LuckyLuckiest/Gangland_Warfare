   Title_Menu: "&8&l[&6&l%npc%&8&l]"
   # Buff catalogue title. %npc% = the Quartermaster's name.
   Title_Buffs: "&8&l[&b&lBuffs &8— &6%npc%&8&l]"
   # Garrison title. %npc% = the Quartermaster's name.
   Title_Garrison: "&8&l[&c&lGarrison &8— &6%npc%&8&l]"
   # Back button on the buff catalogue and garrison panels.
   Back: "&7← Back"
   # Close button on every panel.
   Close: "&cClose"
   # Catalogue arrow to the next page (shown only when a next page exists).
   Page_Next: "&7Next page →"
   # Catalogue arrow to the previous page (shown only after page one).
   Page_Previous: "&7← Previous page"
   # Catalogue page counter. %page%, %pages% = this page and the page count.
   Page_Info: "&7Page %page% of %pages%"
   # Menu item name. %turf% = the turf display name (its own colour codes are kept).
   Menu_Turf: "&6&l%turf%"
   # Menu line: the owning gang. %gang% = owner gang name.
   Menu_Owner: "&7Owning gang: &e%gang%"
   # Menu line for an allied viewer. %gang% = the viewer's own gang name.
   Menu_Allied: "&7You: &b%gang% &8(allied)"
   # Menu line: guards in reserve. %count% = guard count.
   Menu_Stock: "&7Garrison stock: &f%count%"
   # Menu line: active buffs. %count% = buff count.
   Menu_Active: "&7Active buffs: &f%count%"
   # Menu line: the viewer's gang bank. %money% = the balance.
   Menu_Bank: "&7Your gang bank: &a%money%"
   # Timed Buffs button name.
   Menu_Buffs_Name: "&b&lTimed Buffs"
   # Timed Buffs button lore, line 1.
   Menu_Buffs_Lore_1: "&7Browse the powerup catalogue and"
   # Timed Buffs button lore, line 2.
   Menu_Buffs_Lore_2: "&7buy timed boosts on this turf."
   # Timed Buffs button lore, line 3. %count% = active buffs on the turf.
   Menu_Buffs_Active: "&7Currently active: &f%count%"
   # Garrison button name.
   Menu_Garrison_Name: "&c&lGarrison"
   # Garrison button lore, line 1.
   Menu_Garrison_Lore_1: "&7View / buy defender stock."
   # Garrison button lore, line 2.
   Menu_Garrison_Lore_2: "&7Guards hold the capture bar"
   # Garrison button lore, line 3.
   Menu_Garrison_Lore_3: "&7and fight attackers on this turf."
   # Garrison button lore, line 4. %count% = guards in reserve.
   Menu_Garrison_Stock: "&7Current stock: &f%count%"
   # Menu line: this turf's guards alive in the field right now. %count% = guard count.
   Menu_On_Duty: "&7Guards on duty: &f%count%"
   # Menu line for the owning gang's members (allies see Menu_Spend_Ally).
   Menu_Spend_Owner: "&aYour gang buys here."
   # Menu line for an allied viewer. %gang% = owner gang name.
   Menu_Spend_Ally: "&7Only &e%gang% &7buys here; allies can look."
   # Placement menu title (/glw turf quartermaster). %npc% = turf_npcs.yml Powerup_Npc.Display_Name.
   Place_Title: "&8&l[&6&lPlace %npc%&8&l]"
   # Placement button name when the turf has no Quartermaster yet. %npc% = the Quartermaster's name.
   Place_Name: "&a&lPlace the %npc% here"
   # Placement button name when the turf already has one (it moves). %npc% = the Quartermaster's name.
   Place_Move_Name: "&a&lMove the %npc% here"
   # Placement button lore: the turf. %turf% = turf name.
   Place_Lore_Turf: "&7Turf: &f%turf%"
   # Placement button lore: the price (turf_npcs.yml Powerup_Npc.Placement_Cost). %money% = the price.
   Place_Lore_Cost: "&7Cost: &6%money% &7from the gang bank"
   # Placement button lore, last line.
   Place_Lore_Click: "&aClick to place it where you stand."
   # Chat after a placement. %npc%, %turf%, %money% = name, turf, price paid.
   Placed: "&aThe %npc% now stands here on &f%turf%&a. Paid &6%money%&a."
   # Chat when the player's gang does not own the turf (allies included). %turf%, %npc%.
   Place_Not_Owner: "&cOnly the gang that owns %turf% can place its %npc%."
   # Chat when Citizens is missing; nothing is charged. %npc% = the Quartermaster's name.
   Place_No_Citizens: "&cThe %npc% needs the Citizens plugin, which this server does not have."
   # Chat when the player left the turf before clicking. %turf%, %npc%.

   # Catalogue item lore: the duration. %seconds% = Duration_Seconds.
   Buffs_Duration: "&7Duration: &b%seconds%s"
   # Catalogue item lore: the cost. %money% = the price.
   Buffs_Cost: "&7Cost: &6%money%"
   # Catalogue item lore when the gang can pay.
   Buffs_Click: "&aClick to activate."
   # Catalogue item lore when the gang cannot pay.
   Buffs_Insufficient: "&cInsufficient gang funds."
   # Garrison item name.
   Garrison_Name: "&c&lGarrison"
   # Garrison info lore. %turf% = turf name, %count% = guards in reserve.
   Garrison_Stock: "&7Stock on &f%turf%&7: &f%count%"
   # Garrison info lore: the price of one guard after any discount. %money% = the price.
   Garrison_Per_Guard: "&7Per defender: &6%money%"
   # Garrison info lore: the viewer's gang bank. %money% = the balance.
   Garrison_Bank: "&7Gang bank: &a%money%"
   # Garrison buy button name.
   Garrison_Buy_Name: "&aBuy &f1 &aDefender"
   # Garrison buy button lore: the price. %money% = the price.
   Garrison_Buy_Cost: "&7Cost: &6%money%"
   # Garrison buy button lore when the gang can pay.
   Garrison_Buy_Click: "&aClick to add &f1 &ato the garrison."
   # Garrison buy button lore when the gang cannot pay.
   Garrison_Buy_Insufficient: "&cInsufficient gang funds."
   # Chat after a guard is bought. %turf% = turf name.
   Bought_Guard: "&aBought &f1 &adefender for &f%turf%&a."
   # Chat after a boost is bought. %boost% = the boost id, %turf% = turf name.
   Bought_Boost: "&aActivated &f%boost% &aon &f%turf%&a."
   # Chat when the gang bank cannot cover a purchase. %money% = the price.
   Cannot_Afford: "&cYour gang bank can't cover &f%money%&c."
   # %max% = turf_rules.yml Garrison.Max_Reserve. Guards already deployed in a contest count too.
   Reserve_Full: "&cThis turf already has %max% guards (stock and on duty)."
   # Chat when the viewer's rank may not spend (needs gangland.turf.upgrade).
   No_Rank: "&cYour rank may not spend gang money here."
   # Chat for an allied viewer who tries to buy: they may only look.
   Allies_Look: "&eAllied gangs can look, but only the owning gang can buy."
   # Chat when the turf no longer exists. Also the open-contract refusal.
   Turf_Gone: "&cThis turf no longer exists."
   # Chat when the turf changed hands while the panel was open; the panel closes.
   Owner_Changed: "&cThis turf changed hands. The panel is closed."
   # Chat when the viewer is no longer in the owning gang; the panel closes.
   Not_Member: "&cYou are no longer in the owning gang."
   # Chat when an allied gang's alliance with the owner ended while the panel was open; the panel closes.
   Not_Allied: "&cYour gang is no longer allied with the owning gang."
   # Chat when the turf has no owner yet (open contract).
   No_Owner: "&cThis turf has no owner — nothing to manage here yet."
   # Chat for a player who is in no gang that owns or allies the turf (open contract).
   Only_Owner_Or_Allies: "&cOnly members of the owning gang or its allies can use this NPC."
   # Chat when a gang record is missing (open contract).
   Gang_Missing: "&cGang record missing — contact an admin."
# end Quartermaster

# ---------------- Rules: /glw turf rules (W2-E1) ----------------
# Sentences of /glw turf rules. Placeholders: %window%, %wake_up%, %presence%, %guards%, %min_capture%, %max_contest%,
# %cap_base%, %per_level%, %ceiling%, %money_symbol%, %amount%, %interval%, %idle%, %max_mult%. Durations are filled in
# with the server's own numbers; a sentence whose rule is off is left out.
Rules:
   # The header line.
   Header: "&6How turf wars work"
   # OWNERS_ONLINE window. %window% = Capture.Post_Logoff_Protection_Minutes (turf_settings.yml) as a duration.
   Window_Online: "&7You can attack a turf while one of its owners is online, and for &f%window%&7 after the last one logs off."
   # OWNERS_ONLINE window when Post_Logoff_Protection_Minutes is 0: the attack clause without a window.
   Window_Online_Only: "&7You can attack a turf while one of its owners is online."
   # OWNERS_OFFLINE window. %window% = Capture.Post_Logoff_Protection_Minutes as a duration.
   Window_Offline: "&7You can attack a turf once all its owners have been offline for &f%window%&7."
   # OWNERS_ONLINE only, when Wake_Up_Shield_Seconds is above 0. %wake_up% = that many seconds as a duration.
   Wake_Up: "&7When the first owner logs in, the turf stays shielded for &f%wake_up%&7."
   # First sentence of the start rule.
   Start: "&7A capture starts when your gang has more people inside than the owners and their allies, and more than any other gang."
   # Second sentence of the start rule, only when Presence_Seconds is above 0. %presence% = that many seconds as a duration.
   Start_Presence: "&7You count after &f%presence%&7 inside; dying or leaving starts your count again."
   # Guard clause, only when Guard_Weight_Cap is above 0. %guards% = the cap.
   Bar_Guards: "&7Each living guard holds back one attacker (up to &f%guards%&7)."
   # Minimum-capture clause, only when Min_Capture_Seconds is above 0. %min_capture% = that many seconds as a duration.
   Bar_Min_Capture: "&7A capture takes at least &f%min_capture%&7."
   # Stall clause, only when Max_Contest_Minutes is above 0. %max_contest% = that many minutes as a duration.
   Bar_Max_Contest: "&7A capture that goes nowhere for &f%max_contest%&7 ends."
   # Third-gang clause, always shown.
   Bar_Third_Gang: "&7A third gang inside a capture of someone else's turf does not count."
   # Cap sentence. %cap_base%, %per_level%, %ceiling% = Turf_Cap.Base, Turf_Cap.Per_Level, Turf_Cap.Ceiling.
   Cap: "&7Your gang can hold &f%cap_base%&7 turfs, plus &f%per_level%&7 for each gang level, at most &f%ceiling%&7."
   # Cap sentence when Turf_Cap.Per_Level is 0 (no level clause). %cap_base%, %ceiling% as above.
   Cap_Flat: "&7Your gang can hold &f%cap_base%&7 turfs, at most &f%ceiling%&7."
   # Income sentence. %money_symbol% and %amount% = Default_Income_Amount, %interval% = Income_Interval_Minutes as a
   # duration, %idle% = Income.Idle_Hours as a duration, %max_mult% = Income.Max_Multiplier.
   Income: "&7A new turf pays &f%money_symbol%%amount%&7 every &f%interval%&7 while one of its owners was online in the last &f%idle%&7; boosts at most x&f%max_mult%&7."
# end Rules

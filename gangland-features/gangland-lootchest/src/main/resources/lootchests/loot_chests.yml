# The loot tables to generate the required items in.
#
# Mental model (just two ideas):
#   - A CHEST TIER (see tiers.yml) decides what opens the chest and which tables it can draw from (Allowed_Tiers).
#   - An item's DROP_CHANCE decides how often a roll lands on that item:
#       COMMON 1.0 · UNCOMMON 0.7 · RARE 0.4 · EPIC 0.15 · LEGENDARY 0.05 (base; per-table Rarity_Overrides may adjust).
#
# Each entry under "Items" must specify an "Item" string parsed by the global ItemParser.
# Format: "<type>:<id>{attr=value,...}" — e.g. "weapon:ak47", "ammo:9mm{name=&6Gold Bullets}", "material:golden_apple".
# Stack-size is rolled by Min_Amount/Max_Amount and applied after parsing (clamped to the item's max stack size, so
# weapons/uniques always end up as 1).
Loot_Tables:
   # Street-level loot (common items)
   street_loot:
      Display_Name: "&7Street Loot"
      Min_Items: 2
      Max_Items: 5
      Allowed_Tiers:
         - "common"
         - "uncommon"

      Items:
         9mm_ammo:
            Item: "ammo:9mm"
            Drop_Chance: COMMON
            Min_Amount: 5
            Max_Amount: 20
            Weight: 10.0

         slugs_ammo:
            Item: "ammo:slugs"
            Drop_Chance: UNCOMMON
            Min_Amount: 3
            Max_Amount: 10
            Weight: 6.0

         pistol_weapon:
            Item: "weapon:pistol"
            Drop_Chance: RARE
            Weight: 2.0

         lockpick_item:
            Item: "unique:lockpick"
            Drop_Chance: RARE
            Weight: 1.5

   # Military-grade loot (better items) — rare/epic chests only. Legendary trophies live in military_vault.

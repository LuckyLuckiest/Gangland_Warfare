# Civilians module — player-facing strings (Spanish). Moved off gangland-api's message_es.yml (WS6 G3): the
# strings deleted from core's message_es.yml live here now, not lost. Picked when Settings.Language is "es" (see
# CivilianMessages/LocalizedModuleYaml); falls back to civilian_messages.yml (English) otherwise.
List_Empty: "No hay civiles activos actualmente."
Groups_Empty: "No hay grupos de civiles activos actualmente."
Spawned: "&aCivil &e%type%&a generado cerca de ti."
Group_Spawned: "&aGrupo de civiles &e%group%&a generado en tu ubicación."
Group_Unknown: "&cGrupo desconocido &e%group%&c."
Type_Unknown: "&cTipo desconocido &e%type%&c."
Spawner_Removed: "&aGenerador de civiles &e%id%&a eliminado."
Spawner_Teleported: "Teletransportado al generador de civiles &e(&b%id%&e)&7."
Spawn_Failed: "&cError al generar civil. Verifica que el tipo &e%type%&c sea válido y se encontró una ubicación."
Spawner_Type_Set: "&aGenerador de civiles &e%type%&a colocado en tu ubicación."
Spawner_Group_Set: "&aGenerador de grupo &e%group%&a colocado en tu ubicación."
Spawner_List_Header: "Generadores de civiles:"
Spawner_List_Empty: "No hay generadores de civiles colocados actualmente."
# Cuenta atrás en la barra de acción mientras un testigo llama al 911 (0.21.1). %caller% quien llama, %seconds% segundos.
Witness_Calling: "&c911 &f%caller% &7está llamando - &e%seconds%s"
# Barra de acción cuando el criminal cortó la llamada: golpe, susto (apuntado) o intimidación (clic derecho) (0.21.1).
Witness_Stopped: "&aLlamada cortada."
# %place% de la línea Witness_Landed cuando ningún lugar con nombre cubre el crimen (0.21.1).
Witness_Unknown_Place: "aquí"

# Gritos de facción (fase H12). Mismas claves que civilian_messages.yml (inglés); si falta una, se usa el inglés.
Shouts:
   Format: "&c[%faction%] &f%unit%&7: &f%line%"
   # Formato de las líneas de un testigo del 911 (Witness_Start, Witness_Scared, Witness_Landed) (0.21.1).
   Witness_Format: "&c[911] &f%unit%&7: &f%line%"
   # Dicho por un guardia al retirarse tras mantener / perder un territorio. Líneas simples, no listas.
   Turf_Held: "El territorio es nuestro. Volved a vuestros puestos."
   Turf_Lost: "Lo perdimos. Replegaos."
   Compass:
      - "norte"
      - "noreste"
      - "este"
      - "sureste"
      - "sur"
      - "suroeste"
      - "oeste"
      - "noroeste"
   Sides:
      - "frente"
      - "izquierda"
      - "derecha"
      - "espalda"
   Lines:
      Contact:
         - "¡Ahí está! ¡Al %direction%!"
         - "¡Por aquí!"
      Contact_Lost:
         - "¿A dónde se fue?"
      Engage:
         - "¡Dénle duro!"
      Push:
         - "¡%member%, métete ahí!"
      Flank_Left:
         - "¡%member%, rodea por su %side%!"
      Flank_Right:
         - "¡%member%, rodea por su %side%!"
      Reposition: []
      Search:
         - "¡Búsquenlo!"
      Route: []
      No_Route:
         - "¡Está allá arriba! Espérenlo."
      Check_Fire:
         - "¡Cuidado, casi me das!"
      Reloading:
         - "¡Recargando!"
      Man_Down:
         - "¡Le dieron a %member%!"
      Leader_Down:
         - "¡El jefe cayó! %unit%, tú lideras!"
      Commander_Down:
         - "¡Cayó el jefe! ¡A cubierto!"
      Fall_Back:
         - "¡Me dieron! ¡Cúbranme!"
         - "¡Me echo para atrás!"
      In_Cover:
         - "¡Estoy a cubierto!"
      Ack: []
      Responding: []
      Rally:
         - "¡%faction%! ¡Nos atacan, %count% en camino!"
      # 0.21.1 testigo del 911: vio el crimen y empieza a marcar.
      Witness_Start:
         - "¡Eh! ¡Lo he visto! ¡Voy a llamar a la policía!"
      # 0.21.1 testigo del 911: el criminal cortó la llamada.
      Witness_Scared:
         - "¡Vale, vale! ¡Ya cuelgo!"
      # 0.21.1 testigo del 911: la llamada conectó. %place% el lugar del crimen, si no Witness_Unknown_Place.
      Witness_Landed:
         - "¿Policía? ¡Está aquí mismo, cerca de %place%!"

         Combat:
            Enabled: true
            Attack_Damage: 6.0
            # Melee engage distance; ranged types fire at anything they see within Alert_Range.
            Attack_Range: 14.0
            Attack_Interval_Ticks: 16
            Difficulty: HARD
            Alert_Range: 16.0
            Search_Seconds: 20
            # Gun cadence: a fraction of the weapon's own fire rate (see the header). Must be above 0.
            Fire_Rate_Multiplier: 0.05
            # A badly hurt member breaks off and takes cover out of the target's sight.
            Retreat:
               # Set to false and this type fights on until it drops.
               Enabled: true
               # Retreat at or below this fraction of max health (0-1; 0.3 = 30%).
               Health_Fraction: 0.3
               # Blocks searched around the NPC for a spot the target cannot see (2-32).
               Radius: 12.0
            Tactics:

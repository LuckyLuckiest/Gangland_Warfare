# +--------+ #
# | Groups | #
# +--------+ #
#
# Groups define sets of NPC types that spawn together and stay near each other.
#
# Hostile        — All members inherit hostile targeting behavior regardless of individual type settings.
# Health_Bonus   — Extra max health added to every member of this group (half-hearts).
# Speed_Bonus    — Speed multiplier bonus added to every member (e.g. 0.1 = +10%).
# Stay_Together_Range — Members navigate back toward the group center when they stray beyond this range (blocks).
# Members        — Map of <type-id>: <count> specifying how many of each type spawn per group.

Groups:
   street_gang:
      Display_Name: "&cStreet Gang"
      Hostile: true
      Health_Bonus: 5.0
      Speed_Bonus: 0.1
      Stay_Together_Range: 15
      Members:
         gang_member: 3

   market_crowd:
      Display_Name: "&7Market Crowd"
      Hostile: false
      Health_Bonus: 0.0
      Speed_Bonus: 0.0
      Stay_Together_Range: 10
      Members:
         pedestrian: 4
         trader: 1

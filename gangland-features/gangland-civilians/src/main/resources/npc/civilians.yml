# +------------------+ #
# | Default_Entities | #
# +------------------+ #
#
# Default entity-type classifications used for wanted-level logic.
# Individual NPC types are defined in the Types section below.

Default_Entities:
   Civilian:
      - "VILLAGER"
      - "WANDERING_TRADER"
      - "PLAYER"
   Police: []

# +---------+ #
# | Shouts  | #
# +---------+ #
#
# Faction-shout delivery tuning (phase H12). The shouted text itself lives in civilian_messages.yml's own
# Shouts block. Same shape as cops.yml's Cops.Radio, minus the Sound/Dispatch pieces gangs don't use.
Shouts:
   # Set to false to silence faction shouts (recruitment by shout still works).
   Enabled: true
   # Players within this many blocks of the shouting NPC hear it. A Contact shout also recruits same-faction allies
   # this close to the shouter. Keep it above Alert_Range so a shout reaches further than sight.
   Range: 24.0
   # The hunted player hears the shouts from this far away.
   Target_Range: 32.0
   # Minimum gap between two lines from one squad (priority lines and acks skip it).
   Squad_Gap_Ticks: 30
   # Minimum gap between two low-priority lines reaching one player, across all squads.
   Player_Gap_Ticks: 20
   # Ticks before an ordered member acknowledges a delivered order. Forced to at least Player_Gap_Ticks + 5.
   Ack_Delay_Ticks: 25
   # Nearby allies pulled in per shout. Gangs recruit through the Contact shout itself, not this counter.
   Responder_Max: 0
   # Line kinds that skip the squad and player gaps (they still respect their own cooldown).
   Priority:
      - "Contact"
      - "Man_Down"
      - "Leader_Down"
      - "Rally"
   # One squad never repeats the same kind of line within this many ticks.
   Cooldown_Ticks:
      Contact: 160
      Contact_Lost: 200
      Engage: 300
      Push: 200
      Flank_Left: 200
      Flank_Right: 200
      Search: 300
      No_Route: 300
      Check_Fire: 160
      Reloading: 200
      Man_Down: 100
      Leader_Down: 100
      Rally: 120
      Fall_Back: 100
      In_Cover: 200

# +----------------+ #
# | Civilian Types | #
# +----------------+ #
#
# Each type defines one kind of spawnable civilian NPC.
#
# Entity_Type   — Bukkit EntityType name for the Citizens NPC body (e.g. VILLAGER, PLAYER).
# Health        — Max health in half-hearts.
# Hostile       — If true the NPC will attack nearby players and use its Weapon_Pool.
# Faction       — Side the NPC fights for (default: the type id). When a hostile NPC is hit, every combat-enabled
#                 NPC of the same faction within its own AI.Combat.Alert_Range joins the fight as one squad.
# Wearables     — ItemParser strings for armor slots. Use "" for empty.
#                 Supported prefixes: material:, wearable:
# Item_Pool     — Items randomly given to the NPC on spawn (not weapons).
#                 Supported prefixes: material:, weapon:, ammunition:, wearable:
# Weapon_Pool   — Weapons randomly selected and held on spawn for hostile types.
#                 Prefix "weapon:" selects a gangland weapon (with ammo); vanilla materials are fallback.
# Drops         — Items and experience awarded to the killer on death.
#                 Each item entry may append "@<chance>" (0.0-1.0) to roll independently per death.
#                 Example: "material:GOLD_INGOT@0.25" drops ~25% of the time. Omit the suffix to always drop.
# AI            — Per-type behavior settings (wander range, flee, combat).
#                 Technical navigation settings (recalculation ticks, stuck detection) live in settings.yml.
#                 Combat.Difficulty selects a combat profile (EASY, NORMAL, HARD, DEADLY) that scales
#                 aim error, reaction time, fire rate, and melee damage. Defaults to NORMAL when omitted.
#                 Combat.Alert_Range (default 16.0) is the NPC's sight range and how far it hears a faction member
#                 being hit. Combat.Search_Seconds (default 20) is how long its squad may go without seeing the
#                 target before the NPC gives up. Combat.Attack_Range is the melee engage distance; ranged types
#                 fire at anything they see within Alert_Range. Combat.Tactics (formation arc, engagement) and
#                 Combat.Melee (reach, approach, damage falloff; the cooldown is always Attack_Interval_Ticks) tune
#                 squad behaviour (phase H12) — defaults below apply when a type omits either block.
#                 Combat.Fire_Rate_Multiplier is the gun cadence as a fraction of the weapon's own (player) fire
#                 rate, on top of Difficulty (> 0; omitted = 1 / settings.yml Civilians.Behaviour.AI_Tick_Rate). The
#                 shipped 0.05 keeps the pre-0.12 time-to-kill: NPC guns used to advance one weapon tick per civilian AI
#                 tick (AI_Tick_Rate: 20), i.e. a twentieth of the weapon's rate. Combat.Retreat sends a badly hurt
#                 member to cover out of the target's sight (shouted as Fall_Back / In_Cover).

Types:
   pedestrian:
      Display_Name: "&f&lPedestrian"
      Entity_Type: VILLAGER
      Health: 20.0
      Hostile: false
      Wearables:
         Helmet: ""
         Chestplate: ""
         Leggings: ""
         Boots: ""
      Item_Pool:
         - "material:BREAD"
         - "material:GOLD_NUGGET"
      Weapon_Pool: []
      Drops:
         Experience: 5
         Items:
            - "material:BREAD@0.5"
            - "material:GOLD_NUGGET@0.2"
      AI:
         Wander:
            Enabled: true
            Range: 20
         Flee_On_Damage:
            Enabled: true
            Flee_Range: 15
         Combat:
            Enabled: false
            Attack_Damage: 0.0
            Attack_Range: 0.0
            Attack_Interval_Ticks: 0

   gang_member:
      Display_Name: "&c&lGang Member"
      Entity_Type: PLAYER
      Health: 25.0
      Hostile: true
      Faction: gang_member
      Wearables:
         Helmet: ""
         Chestplate: "LEATHER_CHESTPLATE"
         Leggings: "LEATHER_LEGGINGS"
         Boots: ""
      Item_Pool:
         - "material:GOLD_INGOT"
      Weapon_Pool:
         - "weapon:pistol"
         - "weapon:rifle"
      Drops:
         Experience: 25
         Items:
            - "weapon:pistol@0.15"
            - "material:GOLD_INGOT@0.4"
      AI:
         Wander:
            Enabled: true
            Range: 10
         Flee_On_Damage:
            Enabled: false
            Flee_Range: 0
         Combat:
            Enabled: true
            Attack_Damage: 4.0
            # Melee engage distance; ranged types (this one carries a rifle) fire at anything seen within Alert_Range.
            Attack_Range: 12.0
            Attack_Interval_Ticks: 20
            Difficulty: NORMAL
            Alert_Range: 16.0
            Search_Seconds: 20
            # Gun cadence: a fraction of the weapon's own fire rate (see the header). Must be above 0.
            Fire_Rate_Multiplier: 0.05
            # A badly hurt member breaks off and takes cover out of the target's sight.
            Retreat:
               # Set to false and this type fights on until it drops.
               Enabled: true
               # Retreat at or below this fraction of max health (0-1; 0.3 = 30%).
               Health_Fraction: 0.3
               # Blocks searched around the NPC for a spot the target cannot see (2-32).
               Radius: 12.0
            Tactics:
               Formation_Arc: 140.0
               Strafe_Degrees: 12.0
               Reposition_Ticks: 60
               Moving_Aim_Error: 0.15
            Melee:
               Reach: 3.0
               Approach: 2.0
               Damage_Spread: 0.20
               Edge_Damage: 0.7

   trader:
      Display_Name: "&e&lTrader"
      Entity_Type: VILLAGER
      Health: 20.0
      Hostile: false
      Wearables:
         Helmet: ""
         Chestplate: ""
         Leggings: ""
         Boots: ""
      Item_Pool: []
      Weapon_Pool: []
      Drops:
         Experience: 0
         Items: []
      AI:
         Wander:
            Enabled: false
            Range: 0
         Flee_On_Damage:
            Enabled: true
            Flee_Range: 10
         Combat:
            Enabled: false
            Attack_Damage: 0.0
            Attack_Range: 0.0
            Attack_Interval_Ticks: 0

   turf_defender:
      Display_Name: "&c&lTurf Defender"
      Entity_Type: PLAYER
      Health: 30.0
      Hostile: true
      Faction: turf_defender
      Wearables:
         Helmet: ""
         Chestplate: "IRON_CHESTPLATE"
         Leggings: "IRON_LEGGINGS"
         Boots: "IRON_BOOTS"
      Item_Pool: []
      Weapon_Pool:
         - "weapon:rifle"
      Drops:
         Experience: 0
         Items: []
      AI:
         Wander:
            Enabled: false
            Range: 0
         Flee_On_Damage:
            Enabled: false
            Flee_Range: 0
         Combat:
            Enabled: true
            Attack_Damage: 5.0
            # Melee engage distance; ranged types fire at anything they see within Alert_Range.
            Attack_Range: 14.0

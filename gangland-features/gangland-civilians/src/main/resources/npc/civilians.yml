            Alert_Range: 16.0
            Search_Seconds: 20
            # Gun cadence: a fraction of the weapon's own fire rate (see the header). Must be above 0.
            Fire_Rate_Multiplier: 0.05
            # A badly hurt member breaks off and takes cover out of the target's sight.
            Retreat:
               # Set to false and this type fights on until it drops.
               Enabled: true
               # Retreat at or below this fraction of max health (0-1; 0.3 = 30%).
               Health_Fraction: 0.3
               # Blocks searched around the NPC for a spot the target cannot see (2-32).
               Radius: 12.0
            Tactics:
               Formation_Arc: 100.0
               Strafe_Degrees: 8.0
               Reposition_Ticks: 80
               Moving_Aim_Error: 0.12

   quartermaster:
      Display_Name: "&6&lQuartermaster"
      Entity_Type: PLAYER
      Health: 40.0
      Hostile: true
      Faction: quartermaster
      Wearables:
         Helmet: "GOLDEN_HELMET"
         Chestplate: "GOLDEN_CHESTPLATE"
         Leggings: "GOLDEN_LEGGINGS"
         Boots: "GOLDEN_BOOTS"
      Item_Pool: []
      Weapon_Pool:
         - "weapon:rifle"
      Drops:

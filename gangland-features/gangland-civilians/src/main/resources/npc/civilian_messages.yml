# Civilians module — player-facing strings. Moved off gangland-api's Messages enum (WS6 G3): module-owned
# strings live in the module's own YAML, never the core message file. Spanish variant: civilian_messages_es.yml,
# picked by Settings.Language (see CivilianMessages/LocalizedModuleYaml).
List_Empty: "No civilians are currently active."
Groups_Empty: "No civilian groups are currently active."
Spawned: "&aCivilian &e%type%&a spawned near you."
Group_Spawned: "&aCivilian group &e%group%&a spawned at your location."
Group_Unknown: "&cUnknown group &e%group%&c."
Type_Unknown: "&cUnknown type &e%type%&c."
Spawner_Removed: "&aCivilian spawner &e%id%&a removed."
Spawner_Teleported: "Teleported to civilian spawner &e(&b%id%&e)&7."
Spawn_Failed: "&cFailed to spawn civilian. Check that type &e%type%&c is valid and a location was found."
Spawner_Type_Set: "&aCivilian spawner &e%type%&a set at your location."
Spawner_Group_Set: "&aGroup spawner &e%group%&a set at your location."
Spawner_List_Header: "Civilian spawners:"
Spawner_List_Empty: "No civilian spawners are currently set."
# Action-bar countdown a criminal sees while a witness calls 911 (0.21.1). %caller% the caller, %seconds% seconds left.
# A text without the placeholders still works, it just shows as written.
Witness_Calling: "&c911 &f%caller% &7is calling - &e%seconds%s"
# Action-bar line when the criminal stopped the call: hit, scared (aimed at) or intimidated (right-clicked) (0.21.1).
Witness_Stopped: "&aCall stopped."
# %place% of the Witness_Landed line when no named place covers the crime spot (0.21.1).
Witness_Unknown_Place: "here"

# Faction shouts (phase H12). Delivery tuning (Range, cooldowns, ...) lives in civilians.yml's own Shouts block;
# this is only the shouted text. Every Lines key is a list; one line is picked at random. [] mutes that kind.
# Placeholders: %unit% speaker, %member% addressed member, %target% suspect name, %distance%/%direction%/%side%
# same as police radio, %faction% the shouter's faction, %gang% the guard's gang tag (empty for street civilians), %count% allies recruited (Rally only).
Shouts:
   Format: "&c[%faction%] &f%unit%&7: &f%line%"
   # The format of a 911 witness's lines (Witness_Start, Witness_Scared, Witness_Landed) (0.21.1).
   Witness_Format: "&c[911] &f%unit%&7: &f%line%"
   # Said by a guard standing down after a held / lost turf. Plain lines, not pools.
   Turf_Held: "Turf's ours. Back to your posts."
   Turf_Lost: "We lost it. Fall back."
   Compass:
      - "north"
      - "north-east"
      - "east"
      - "south-east"
      - "south"
      - "south-west"
      - "west"
      - "north-west"
   Sides:
      - "front"
      - "left"
      - "right"
      - "back"
   Lines:
      Contact:
         - "There he is! %direction%!"
         - "Over here!"
      Contact_Lost:
         - "Where'd he go?"
      Engage:
         - "Light him up!"
      Push:
         - "%member%, get in there!"
      Flank_Left:
         - "%member%, go round his %side%!"
      Flank_Right:
         - "%member%, go round his %side%!"
      # Gangs don't call out repositions.
      Reposition: []
      Search:
         - "Find him!"
      # Gangs don't call out taking a route.
      Route: []
      No_Route:
         - "He's up there! Wait for him!"
      Check_Fire:
         - "Watch it, you almost hit me!"
      Reloading:
         - "Reloading!"
      Man_Down:
         - "They got %member%!"
      Leader_Down:
         - "Boss is down! %unit%, you lead!"
      # A squad's commander (AI.Combat.Roles with Commander: true) fell: shouted once while the squad takes cover for 5 s.
      Commander_Down:
         - "The boss is down! Take cover!"
      # A badly hurt member breaks off to cover (AI.Combat.Retreat in civilians.yml).
      Fall_Back:
         - "I'm hit! Cover me!"
         - "Pulling back!"
      # The retreating member reached cover.
      In_Cover:
         - "I'm behind cover!"
      # Gangs don't run radio drills — no acknowledgements.
      Ack: []
      # Gangs don't announce responders.
      Responding: []
      Rally:
         - "%faction%! They're hitting us, %count% on the way!"
      # 0.21.1 911 witness: noticed the crime, starts dialling (heard by the criminal and bystanders in Shouts.Range).
      Witness_Start:
         - "Hey! I saw that! I'm calling the cops!"
      # 0.21.1 911 witness: the criminal stopped the call (hit, aimed at, or right-clicked).
      Witness_Scared:
         - "Okay, okay! I'm hanging up!"
      # 0.21.1 911 witness: the call connected. %place% the named place of the crime, else Witness_Unknown_Place.
      Witness_Landed:
         - "Yes, police? He's right here, near %place%!"

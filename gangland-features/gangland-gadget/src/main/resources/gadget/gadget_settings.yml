# Gadget physics knobs (moved here from settings.yml in 0.15.1; values tuned in settings.yml, or in the
# settings-old.yml backup the upgrade leaves, are still honoured for one release when this file keeps the defaults).
Gadgets:
   Jetpack:
      # Ticks of continuous thrust to ramp from 10% to 100% ascend power.
      Thrust_Ramp_Ticks: 20
      # Downward acceleration added per tick while descending (m/tick²).
      Descent_Accel: 0.022
      # Terminal descent speed — descent will not exceed this (negative = downward).
      Max_Descent_Speed: -0.5
      # Horizontal speed delta added per tick when a directional key is held (m/tick).
      Horiz_Influence: 0.03
      # Maximum horizontal speed while airborne (m/tick).
      Max_Horiz_Speed: 0.25
   Car:
      # Fraction of max speed used when reversing (0.5 = half max speed).
      Reverse_Speed_Ratio: 0.5
      # Multiplier applied to deceleration when the driver hard-brakes (sneak key).
      Hard_Brake_Multiplier: 3.0
      # Fuel units consumed per tick while the car is moving.
      Fuel_Consume_Per_Tick: 1
# Car events: CarMoveEvent cadence (ticks between events while the car moves).
Car_Events:
   # One CarMoveEvent every N ticks while the car is moving (minimum 1).
   Move_Interval_Ticks: 4
# Hotwire: start the engine of a car you do not own with a lockpick.
Hotwire:
   # Turn hotwiring off entirely (false = only owners and gang mates can mount).
   Enable: true
   # Seconds the hotwire takes before the engine starts.
   Seconds: 6
   # Maximum distance (blocks) from the car to start hotwiring.
   Max_Distance: 3.0
   # Consume the lockpick when the hotwire succeeds.
   Consume_Lockpick: true
   # Item id of the lockpick (an item from the item vocabulary).
   Lockpick_Item: lockpick

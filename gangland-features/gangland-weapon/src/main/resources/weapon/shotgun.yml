# +-----------------+ #
# |  Pump Shotgun   | #
# +-----------------+ #

Information:
   Name: "&7Pump Shotgun&r"
   Category: gun
   Material: IRON_AXE
   Durability:
      Base: 100
      Change:
         On_Shot: 0
   Lore:
      - "&7Pump-action 12-gauge.&r"
      - "&7Devastating up close, useless at range.&r"
   Drop_Hologram: true

Shoot:
   Selective_Fire: single
   Allowed_Modes:
      - single

   Projectile:
      Speed: 4
      Type: SPREAD
      Damage:
         Base: 3
         Explosion_Damage: 0
         Fire_Ticks: 0
         Head: 2
         Critical_Hit:
            Chance: 2
            Amount: 2
      Consumed_Amount: 1
      Per_Shot: 2
      Cooldown: 3
      Distance: 18
      Particle: true
      Gravity: 0.2

   Weapon_Consumed:
      Consume_On_Shot: 0
      Time: -1

   Spread:
      Starting_Spread: 0.25
      Time: 5
      Change:
         Base: 0.0
         Bounds:
            Reset_On_Bound: true
            Min: 0.25
            Max: 0.25

   Recoil:
      Amount: 0.18
      Push: 0.15
      Power_Up: 0.0006
      Pattern:
         - 2.5;1
         - 0;0
         - 0.5;1
         - 1;1

   Sound:
      Default_Sound:
         Sound: ENTITY_GENERIC_EXPLODE
         Volume: 1.4
         Pitch: 1.0
      Custom_Sound:
         Sound: sound.gta.double_barreled_shotgun_shoot
         Volume: 1
         Pitch: 1.5
      Empty_Default_Sound:
         Sound: BLOCK_NOTE_BLOCK_HAT
         Volume: 1.0
         Pitch: 0.8
      Empty_Custom_Sound:
         Sound: sound.gta.empty_mag2
         Volume: 1
         Pitch: 1
      Flyby_Range: 2.5
      Flyby_Default_Sound:
         Sound: ENTITY_ARROW_SHOOT
         Volume: 0.6
         Pitch: 1.4
      Flyby_Custom_Sound:
         Sound: sound.gta.bullet_fly_by
         Volume: 0.8
         Pitch: 1.0
      Impact_Default_Sound:
         Sound: BLOCK_STONE_HIT
         Volume: 0.9
         Pitch: 1.0
      Impact_Custom_Sound:
         Sound: sound.gta.bullet_fly_by
         Volume: 1.0
         Pitch: 1.0

Ammunition:
   Capacity: 8
   Ammo_Type: slugs
   Consume: 1
   Restore: 2

Reload:
   Cooldown: 1

   Sound:
      Default_Sound_Before:
         Sound: BLOCK_WOODEN_TRAPDOOR_OPEN
         Volume: 1.0
         Pitch: 1.2
      Default_Sound_After:
         Sound: BLOCK_WOODEN_TRAPDOOR_CLOSE
         Volume: 1.0
         Pitch: 1.2
      Custom_Sound:
         Start:
            Sound: sound.gta.double_barreled_shotgun_reload_start
            Volume: 1
            Pitch: 1
         Mid:
            Sound: sound.gta.double_barreled_shotgun_reload_mid
            Volume: 1
            Pitch: 1
         End:
            Sound: sound.gta.double_barreled_shotgun_reload_end
            Volume: 1
            Pitch: 1

   Action_Bar:
      Reloading: "&cChambering shells...&r"
      Opening: "&cOpening...&r"

   Type: one

Scope:
   Level: 1

Modifiers:
   Break_Blocks:
      - GLASS-3
   Flat_Damage: 0.0
   Armor_Piercing: 0.1

Death_Messages:
   - "&c%victim% ate a shell from %killer%'s %item%."
   - "&c%killer% blasted %victim% point-blank."
   - "&c%victim% got pumped by %killer%."

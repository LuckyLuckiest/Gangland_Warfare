# ---------------- Commands ----------------
Commands:
   # Console commands run once per join/leave/kick. Tokens: %gang% (the ASCII gang name, only when it matches
   # [A-Za-z0-9_]+, else the id), %gang_id%, %player%. The display name is never spliced.
   On_Join: []
   On_Leave: []
   On_Kick: []
# end Commands

# ---------------- Purge ----------------
Purge:
   # Off by default. Staff can always run /glw option gang purge preview, then run.
   Enabled: false
   # A gang none of whose members played for this many days is disbanded.
   Inactive_Days: 30
   # A member not seen for this many days no longer keeps a gang alive.
   Member_Inactive_Days: 60
   # Hours after a restart before the first purge run.
   First_Run_Delay_Hours: 24
   # Give back the creation fee when a gang is purged.
   Refund_Fee: false
# end Purge

# ---------------- Worlds ----------------
Worlds:
   # Worlds where gangs do not exist: gang commands, friendly-fire rules, gang stats, safehouses and rallies are off
   # there. settings.yml Gang.Enable false turns gangs off everywhere. One world name per line, for example:
   #    - world_nether
   Disabled: []
# end Worlds

# ---------------- Friendly_Fire ----------------
Friendly_Fire:
   # OFF (never between gangmates), GANG_CHOICE (each gang's /glw gang pvp), ON (always). Allies hurt each other only
   # when both sides turned /glw gang ally pvp on.
   Global: GANG_CHOICE
   # Whether a player may hurt himself (own splash potions, own arrows).
   Allow_Self_Damage: true
   # NEGATIVE_ONLY (only harmful potions are blocked between friends) or ALL.
   Potions: NEGATIVE_ONLY
   # Per-world override, for example:
   #    Worlds:
   #       world_pvp: ALLOW
   #       world_peace: DENY
# end Friendly_Fire

# ---------------- Combat ----------------
Combat:
   # A gang member hit by a member of another gang cannot leave the gang or take a gang teleport for this long.
   Tag_Seconds: 15
# end Combat

# ---------------- Safehouse ----------------
Safehouse:
   # Gang safehouses and rallies; the count is capped per level (Levels.Level_<n>.Max_Safehouses).
   Enabled: true
   Warm_Up_Seconds: 5
   Cooldown_Seconds: 60
   # Money taken from the player after each successful safehouse teleport (0 = free). Setting a safehouse and joining a rally never cost anything.
   Cost: 0
   # Refuse a safehouse spot that is not safe to stand on.
   Safe_Check: true
   # How long a rally call stays open for members to answer.
   Rally_Consent_Seconds: 60
# end Safehouse

# ---------------- Chat ----------------
Chat:
   # Also print gang and ally chat lines to the server console.
   Log_To_Console: false
   # What {glw_gang} shows for a player without a gang.
   No_Gang_Tag: ""
   # Public_Tag replaces {glw_gang} in the public chat format (off by default).
   Public_Tag:
      Enabled: false
# end Chat

# ---------------- Stats ----------------
Stats:
   # Gang stats never count kills between gangmates or allies, of gangless players, of members younger than
   # Min_Victim_Member_Age_Hours, or in Worlds.Disabled.
   Assist_Window_Seconds: 10
   Min_Victim_Member_Age_Hours: 24
   Repeat_Kill_Cooldown_Seconds: 300
   Max_Kills_Per_Victim_Per_Day: 3
   Snapshot_Seconds: 60
# end Stats

# ---------------- Ranking ----------------
Ranking:
   # /glw gang ranking.
   Min_Kills: 10
   Page_Size: 10
# end Ranking

# ---------------- Placeholders ----------------
Placeholders:
   # Shown by a gang placeholder for a gangless player or an empty board row.
   Default_Value: "-"
# end Placeholders

# ---------------- Display_Name ----------------
Display_Name:
   # The free-form display name (any language). Uniqueness ignores colour, case and look-alike letters.
   Allow_Hex: true
   Parse_Colours: true
   Max_Length: 24
   Blocked_Words: []
# end Display_Name
# +-------------------+ #
# | Gang module rules | #
# +-------------------+ #
# Gameplay rules of the gang module. One top-level section per feature; later releases add sections.

# ---------------- Names ----------------
# A gang name (the key used in commands such as /glw gang info <name>) must match this Java regular expression after
# colour codes are stripped. The default allows 3 to 16 letters, digits and underscores.
Name_Pattern: "[A-Za-z0-9_]{3,16}"
# end Names

# ---------------- Ranks ----------------
Ranks:
   # Ranks created on a FRESH install only (when the rank table is empty), lowest first. The first should equal
   # Rank.Head and the last Rank.Tail in gang_settings.yml. An existing rank tree is never changed, except once in
   # 0.17.0: every rank holding gangland.gang.withdraw also gets gangland.turf.upgrade.
   # A five-rung example: member, soldier, officer, underboss, owner (one per line, like below).
   Preset:
      - member
      - officer
      - owner
   # Gang permission nodes each preset rank gets on that fresh install (gangland.turf.upgrade lets a rank buy guards and
   # boosts at the Quartermaster). The top rank may do everything anyway.
   # A rank does not inherit the nodes of the ranks below it, so list them again.
   Preset_Permissions:
      member:
         - gangland.gang.deposit
      officer:
         - gangland.gang.deposit
         - gangland.gang.withdraw
         - gangland.gang.invite
         - gangland.gang.description
         - gangland.turf.upgrade
   # The lowest rank that may use each feature; ranks above it (toward the Tail) may too. An unknown rank name logs one
   # warning and turns that entry off. Node lists in Preset_Permissions and the top rank still pass.
   Minimum:
      Chat: member
      Deposit: member
      Safehouse: member
      Fight: officer
      Rally: officer
      Invite: officer
      Kick: officer
      Promote: officer
      Demote: officer
      Withdraw: officer
      Safehouse_Manage: officer
      Recruiting: officer
      Description: officer
      Ally: owner
      Rename: owner
      Display: owner
      Color: owner
      Notice: owner
      Upgrade: owner
      Friendly_Fire: owner
# end Ranks

# ---------------- Progression ----------------
Progression:
   # Highest gang level. Gang XP comes only from turf the gang holds while a member is online (turf_rules.yml Income).
   Max_Level: 20
   # XP level 1 needs. Level n needs Base_Experience x n^1.5 more than level n-1 (200, then 566, then 1,039 ...).
   # With one turf paying every 10 minutes (1 XP a payout) a gang reaches level 1 in about 1.4 days, level 2 in about
   # 5, level 3 in about 12. Each level lets the gang hold one more turf (turf_rules.yml Turf_Cap). Applies after a
   # restart.
   Base_Experience: 200
# end Progression

# ---------------- Levels ----------------
Levels:
   # XP still comes only from held turf (Progression); a level is claimed with /glw gang upgrade confirm when the XP bar
   # is full and Cost is paid from the gang bank. Cost 0 on a row levels automatically as before. Commands run from the
   # console for every member older than Reward_Min_Member_Age_Hours; tokens %gang% (ASCII name), %gang_id%, %player%,
   # %level%. 0 = unlimited for the three Max_ keys. A missing row inherits the row before it.
   Reward_Min_Member_Age_Hours: 24

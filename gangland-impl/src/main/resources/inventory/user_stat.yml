Information:
   Display_Name: "&6&lGang Members"
   Size: 54
   Type: multi-inventory
   Configuration:
      Fill: true
      Border: true
   Multi:
      Item_Source: "gang_members"
      Per_Page: 28
   Item_Template:
      Item:
         Type: PLAYER_HEAD
         Data: "%member_name%"
      Name: "&b%member_name%"
      Lore:
         - "&7Rank:&e %member_rank%"
         - "&7Contribution:&e %member_contribution%"
         - "&7Joined:&e %member_join_date%"
         - ""
         - "&7Status: %member_online_status%"

Static_Items:
   18:
      Item: NAME_TAG
      Name: "&e&lSearch by Name"
      Lore:
         - "&7Filter the list by player name."
         - "&8Click to open an anvil."
      OnClick:
         Inventory:
            Type: anvil
            Title: "Search Members"
            Text: "Name"
            Success:
               Command: "/glw filter gang_members search %gangland_anvil_output%"
   27:
      Item: BARRIER
      Name: "&c&lClear Filter"
      Lore:
         - "&7Reset every filter and the sort key."
      OnClick:
         Command: "/glw filter gang_members clear"
   36:
      Item: COMPASS
      Name: "&b&lSort"
      Lore:
         - "&7Cycle sort: Name / Rank / Contribution / Joined."
      OnClick:
         Command: "/glw filter gang_members sort"

#
# Cash drop variations and per-source drop rules. Dropped cash items carry an
# NBT amount; walking over (or right-clicking) one deposits the value.
#
# The MASTER ENABLE/DISABLE flag for this whole feature lives in settings.yml
# under `Money_Drop.Enabled`. The currency symbol shown to players is read
# from settings.yml `Money_Symbol` via the MoneyDepositService contract.
#
# Placeholders supported in Display_Name, Lore, Pickup_Chat_Message, and
# Pickup_Action_Bar:
#   %amount%   - rolled cash amount embedded in the dropped item
#
# Fields:
#   Money:
#     Default_Variation     - variation used when a drop source can't pick one
#     Pickup_Chat_Message   - chat line shown on pickup (& color codes)
#     Pickup_Action_Bar     - action bar flash on pickup (empty to disable)
#     Drop_Sources          - per-source weight and balance-scale rules
#
#   Variations:
#     Material              - Bukkit material name for the dropped item
#     Custom_Model_Data     - integer for resource pack model
#     Display_Name          - display name (supports & color codes)
#     Lore                  - list of lore lines
#     Min                   - minimum rolled cash amount (inclusive)
#     Max                   - maximum rolled cash amount (inclusive)
#     Glow                  - whether the item should glow on the ground
#     Pickup_Sound:
#       Sound               - Bukkit sound enum name played on pickup
#       Volume              - playback volume (default 1.0)
#       Pitch               - playback pitch (default 1.0)

Money:
   Default_Variation: small
   Pickup_Chat_Message: "&a+ %gangland_money_symbol%%amount% &7added to your purse."
   Pickup_Action_Bar: "&a&l+ %gangland_money_symbol%%amount%"
   Drop_Sources:
      PLAYER:
         Enabled: true
         Variations:
            small:
               weight: 50
            medium:
               weight: 30
            large:
               weight: 20
         # When true the rolled amount is augmented by floor(balance * Balance_Fraction)
         # and clamped to the variation's Max. Mirrors User.Death.Money loss in settings.yml.
         Scale_With_Balance: true
         Balance_Fraction: 0.15
      COP:
         Enabled: true
         Variations:
            medium:
               weight: 70
            large:
               weight: 30
      CIVILIAN:
         Enabled: true
         Variations:
            small:
               weight: 80
            medium:
               weight: 20
      MOB:
         Enabled: true
         Variations:
            small:
               weight: 100

Variations:
   small:
      Material: SUNFLOWER
      Custom_Model_Data: 1001
      Display_Name: "&e&l$&r &eSmall Cash Stack"
      Lore:
         - "&7Worth &a%gangland_money_symbol%%amount%"
         - "&7Walk over or right-click to collect."
      Min: 10
      Max: 100
      Glow: false
      Pickup_Sound:
         Sound: ENTITY_EXPERIENCE_ORB_PICKUP
         Volume: 1.0
         Pitch: 1.2

   medium:
      Material: GREEN_DYE
      Custom_Model_Data: 1002
      Display_Name: "&6&l$&r &6Medium Cash Stack"
      Lore:
         - "&7Worth &a%gangland_money_symbol%%amount%"
         - "&7Walk over or right-click to collect."
      Min: 100
      Max: 500
      Glow: false
      Pickup_Sound:
         Sound: ENTITY_EXPERIENCE_ORB_PICKUP
         Volume: 1.0
         Pitch: 1.0

   large:
      Material: BLACK_DYE
      Custom_Model_Data: 1003
      Display_Name: "&c&l$&r &cLarge Cash Stack"
      Lore:
         - "&7Worth &a%gangland_money_symbol%%amount%"
         - "&7Walk over or right-click to collect."
      Min: 500
      Max: 2000
      Glow: true
      Pickup_Sound:
         Sound: ENTITY_EXPERIENCE_ORB_PICKUP
         Volume: 1.2
         Pitch: 0.8

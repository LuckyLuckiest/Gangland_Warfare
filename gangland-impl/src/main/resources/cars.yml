#   +------------------------------------------------------+   #
#
# Each entry defines a drivable car that can be spawned in the world.
# Items are identified in-game by a hidden NBT tag embedded when built via API.
#
# Fields:
#   Material            - Bukkit material name for the inventory item
#   Display_Name        - display name (supports & color codes)
#   Custom_Model_Data   - integer for resource pack model
#   Permission          - permission node required to use (optional)
#   Lore                - list of lore lines
#
#   Vehicle:
#     Max_Speed         - maximum speed in blocks/tick (default 0.8)
#     Acceleration      - speed gain per tick (default 0.04)
#     Deceleration      - friction/braking per tick (default 0.02)
#     Turn_Speed        - turning rate in degrees/tick (default 4.0)
#     Max_Health        - vehicle hit points (default 100.0)
#
#   Fuel:
#     Enabled           - whether fuel is consumed while driving
#     Fuel_Key          - references a fuel unique item key (e.g. "gasoline")
#
#   Repair:
#     Max_Durability    - maximum repair durability of the car

sports_car:
   Permission: "gangland.cars.sports_car"
   Material: MINECART
   Display_Name: "&6Sports Car"
   Custom_Model_Data: 1001
   Lore:
      - "&7A sleek and fast street car"
      - "&8Top speed: Fast"
   Vehicle:
      Max_Speed: 0.8
      Acceleration: 0.04
      Deceleration: 0.02
      Turn_Speed: 4.0
      Max_Health: 100.0
   Fuel:
      Enabled: false
      Fuel_Key: ""
      Max_Fuel: 3200
   Repair:
      Max_Durability: 500

pickup_truck:
   Permission: "gangland.cars.pickup_truck"
   Material: MINECART
   Display_Name: "&2Pickup Truck"
   Custom_Model_Data: 1002
   Lore:
      - "&7Heavy duty transport"
      - "&8Top speed: Moderate"
   Vehicle:
      Max_Speed: 0.5
      Acceleration: 0.02
      Deceleration: 0.015
      Turn_Speed: 3.0
      Max_Health: 200.0
   Fuel:
      Enabled: true
      Fuel_Key: "gasoline"
      Max_Fuel: 10600
   Repair:
      Max_Durability: 800

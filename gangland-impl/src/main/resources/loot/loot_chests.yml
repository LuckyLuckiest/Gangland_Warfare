# The loot tables to generate the required items in.
#
# Each entry under "Items" must specify an "Item" string parsed by the global ItemParser.
# Format: "<type>:<id>{attr=value,...}" — e.g. "weapon:ak47", "ammo:9mm{name=&6Gold Bullets}",
# "material:diamond". Stack-size is rolled by Min_Amount/Max_Amount and applied after parsing
# (clamped to the item's max stack size, so weapons/uniques always end up as 1).
Loot_Tables:
   # Street-level loot (common items)
   street_loot:
      Display_Name: "&7Street Loot"
      Min_Items: 2
      Max_Items: 5
      Allowed_Tiers:
         - "common"
         - "uncommon"

      # Optional: Override rarity chances for this table
      # Rarity_Overrides:
      #   rare: 0.2  # Make rare items even rarer in street loot

      Items:
         9mm_ammo:
            Item: "ammo:9mm"
            Rarity: COMMON
            Min_Amount: 5
            Max_Amount: 20
            Weight: 10.0

         slugs_ammo:
            Item: "ammo:slugs"
            Rarity: UNCOMMON
            Min_Amount: 3
            Max_Amount: 10
            Weight: 6.0

         pistol_weapon:
            Item: "weapon:pistol"
            Rarity: RARE
            Weight: 2.0

         lockpick_item:
            Item: "unique:lockpick"
            Rarity: RARE
            Weight: 1.5

   # Military-grade loot (better items)
   military_loot:
      Display_Name: "&2Military Loot"
      Min_Items: 3
      Max_Items: 7
      Allowed_Tiers:
         - "rare"
         - "epic"
         - "legendary"

      # Increase epic/legendary spawn rates for military loot
      Rarity_Overrides:
         epic: 0.25
         legendary: 0.10

      Items:
         assault_rifle:
            Item: "weapon:rifle"
            Rarity: RARE
            Weight: 3.0

         sniper_rifle:
            Item: "weapon:awp"
            Rarity: EPIC
            Weight: 1.5
            Tier_Requirement: "epic"  # Only spawns in epic+ tier chests

         556_ammo:
            Item: "ammo:5,56"
            Rarity: COMMON
            Min_Amount: 20
            Max_Amount: 60
            Weight: 8.0

         762_ammo:
            Item: "ammo:7,62"
            Rarity: COMMON
            Min_Amount: 15
            Max_Amount: 45
            Weight: 7.0

         50_bmg_ammo:
            Item: "ammo:50_bmg"
            Rarity: RARE
            Min_Amount: 5
            Max_Amount: 15
            Weight: 3.0
            Tier_Requirement: "epic"

         epic_key:
            Item: "unique:epic_key"
            Rarity: RARE
            Weight: 1.0
            Tier_Requirement: "rare"

         legendary_weapon:
            Item: "weapon:golden_ak47"
            Rarity: LEGENDARY
            Weight: 0.5
            Tier_Requirement: "legendary"

   # Supply cache (mixed items)
   supply_cache:
      Display_Name: "&eSupply Cache"
      Min_Items: 4
      Max_Items: 8
      Allowed_Tiers:
         - "common"
         - "uncommon"
         - "rare"

      Items:
         9mm_ammo:
            Item: "ammo:9mm"
            Rarity: COMMON
            Min_Amount: 10
            Max_Amount: 30
            Weight: 10.0

         762_ammo:
            Item: "ammo:7,62"
            Rarity: UNCOMMON
            Min_Amount: 10
            Max_Amount: 25
            Weight: 7.0

         slugs_ammo:
            Item: "ammo:slugs"
            Rarity: UNCOMMON
            Min_Amount: 5
            Max_Amount: 15
            Weight: 6.0

         flare_ammo:
            Item: "ammo:flare"
            Rarity: RARE
            Min_Amount: 2
            Max_Amount: 5
            Weight: 3.0

         rocket_ammo:
            Item: "ammo:rocket"
            Rarity: EPIC
            Min_Amount: 1
            Max_Amount: 3
            Weight: 1.0
            Tier_Requirement: "rare"

         smg_weapon:
            Item: "weapon:mp5"
            Rarity: UNCOMMON
            Weight: 3.0

         shotgun_weapon:
            Item: "weapon:shotgun"
            Rarity: RARE
            Weight: 2.0
            Tier_Requirement: "uncommon"

         rare_key:
            Item: "unique:rare_key"
            Rarity: RARE
            Weight: 0.8

         epic_key:
            Item: "unique:epic_key"
            Rarity: EPIC
            Weight: 0.3
            Tier_Requirement: "rare"

         gangland.command.gang.decline: true
         gangland.command.gang.kick: true
         gangland.command.gang.promote: true
         gangland.command.gang.demote: true
         gangland.command.gang.chat: true
         gangland.command.gang.join: true
         gangland.command.gang.recruiting: true
         gangland.command.gang.bounty: true
         gangland.inventory.gang_stat: true
         gangland.inventory.gang_info: true
         gangland.inventory.alliance_stat: true
         gangland.command.map.zoom: true
         gangland.command.waypoint: true
         gangland.command.waypoint.list: true
         gangland.command.waypoint.info: true
         gangland.command.waypoint.select: true
         gangland.command.waypoint.deselect: true
         gangland.command.map.border: true
         gangland.command.gang.transfer: true

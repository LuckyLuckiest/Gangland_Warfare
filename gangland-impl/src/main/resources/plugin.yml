   gangland.command.gang.fight.decline:
      default: true
   gangland.command.gang.fight.enlist:
      default: true
   gangland.command.gang.fight.drop:
      default: true
   gangland.command.gang.fight.info:
      default: true
   gangland.command.gang.fight.arenas:
      default: true
   gangland.command.gang.fight.stats:
      default: true
   gangland.inventory.player_profile:
      default: true
   gangland.inventory.gang_ranking:
      default: true
   # One parent for every player command (GP-09): negate it to take every /glw player verb from a group.
   gangland.command.player:
      default: true
      children:
         gangland.command.main: true
         gangland.command.map: true
         gangland.command.map.auto: true
         gangland.command.map.hud: true
         gangland.command.map.text: true
         gangland.command.map.legend: true

         gangland.command.gang.fight.enlist: true
         gangland.command.gang.fight.drop: true
         gangland.command.gang.fight.info: true
         gangland.command.gang.fight.arenas: true
         gangland.command.gang.fight.stats: true
         gangland.inventory.player_profile: true
         gangland.inventory.gang_ranking: true
         gangland.command.bank: true
         gangland.command.bank.balance: true
         gangland.command.bank.deposit: true
         gangland.command.bank.withdraw: true
         gangland.command.bank.menu: true
         gangland.command.bank.create: true
         gangland.command.balance: true

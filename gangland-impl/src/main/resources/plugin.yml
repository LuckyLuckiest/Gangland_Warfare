   # Gang staff tools; never default true (a default-true gangland.gang.* node would bypass every rank gate).
   gangland.admin.gang:
      default: op
      children:
         gangland.admin.gang.spy: true
         gangland.admin.gang.force_rank: true
         gangland.gang.balance.others: true

name: Gangland_Warfare
version: ${project.version}
main: org.luckyraven.gangland.Gangland
database: true
# Support floor is MC 1.16, matching Keystone's API floor; players on older clients go through ViaVersion/ViaBackwards
api-version: 1.16
depend:
   - Keystone
   - NBTAPI
softdepend:
   - PlaceholderAPI
   - Vault
   - ViaVersion
   - Citizens
   - Bartizan
   - dynmap
   - WorldGuard
author: LuckyRaven10
description: ${project.description}

commands:
   glw:
      description: Gangland warfare main command.
      permission: gangland.command.main
      aliases:
         - gangland

permissions:
   # Players may run /glw at all; each sub-command has its own node below. (CM-37, 0.17.0)
   gangland.command.main:
      default: true
   gangland.command.map:
      default: true
   gangland.command.map.auto:
      default: true
   gangland.command.map.hud:
      default: true
   gangland.command.map.text:
      default: true
   gangland.command.map.legend:
      default: true
   gangland.command.turf:
      default: true
   gangland.command.turf.info:
      default: true
   gangland.command.turf.list:
      default: true
   gangland.command.turf.rules:
      default: true
   gangland.command.turf.quartermaster:
      default: true
   gangland.command.gang:
      default: true
   gangland.command.gang.create:
      default: true
   gangland.command.gang.leave:
      default: true
   gangland.command.gang.list:
      default: true
   gangland.command.gang.info:
      default: true
   gangland.command.gang.members:
      default: true
   gangland.command.gang.balance:
      default: true
   gangland.command.gang.deposit:
      default: true
   gangland.command.gang.withdraw:
      default: true
   gangland.command.gang.invite:
      default: true
   gangland.command.gang.invite.cancel:
      default: true
   # Alliance subcommands: every player may run them; the gang rank still gates each command (GangPermissions.ALLY).
   gangland.command.gang.ally:
      default: true
   gangland.command.gang.ally.request:
      default: true
   gangland.command.gang.ally.accept:
      default: true
   gangland.command.gang.ally.reject:
      default: true
   gangland.command.gang.ally.pending:
      default: true
   gangland.command.gang.ally.pending.cancel:
      default: true
   gangland.command.gang.ally.abandon:
      default: true
   gangland.command.gang.accept:
      default: true
   gangland.command.gang.decline:
      default: true
   gangland.command.gang.kick:
      default: true
   gangland.command.gang.promote:
      default: true
   gangland.command.gang.demote:
      default: true
   gangland.command.gang.chat:
      default: true
   gangland.command.gang.join:
      default: true
   gangland.command.gang.recruiting:
      default: true
   gangland.command.gang.bounty:
      default: true
   # Player verbs missing from CM-37 (T-307, 0.17.1); staff children (wanted add/remove/clear, car give, bank resetcap) stay op.
   gangland.command.gang.delete:
      default: true
   gangland.command.gang.rename:
      default: true
   gangland.command.gang.transfer:
      default: true
   gangland.command.gang.color:
      default: true
   gangland.command.gang.display:
      default: true
   gangland.command.gang.description:
      default: true
   gangland.command.bank:
      default: true
   gangland.command.bank.balance:
      default: true
   gangland.command.bank.deposit:
      default: true
   gangland.command.bank.withdraw:
      default: true
   gangland.command.bank.menu:
      default: true
   # Owner ruling T-826 (0.17.1): open to everyone. /glw balance <player> stays behind gangland.command.balance.admin
   # (checked inside the command). The waypoint block below is T-827 (list, info, select, deselect open; the staff verbs stay op).
   gangland.command.bank.create:
      default: true
   # Owner ruling 2026-10-13: players may list, inspect, select and deselect waypoints; create/delete/edit verbs stay op.
   gangland.command.waypoint:
      default: true
   gangland.command.waypoint.list:
      default: true
   gangland.command.waypoint.info:
      default: true
   gangland.command.waypoint.select:
      default: true
   gangland.command.waypoint.deselect:
      default: true
   gangland.command.balance:
      default: true
   gangland.command.teleport:
      default: true
   gangland.command.respawn:
      default: true
   gangland.command.wanted:
      default: true
   gangland.command.contact:
      default: true
   gangland.command.filter:
      default: true
   gangland.command.resource:
      default: true
   gangland.command.car:
      default: true
   gangland.command.car.list:
      default: true
   gangland.command.car.info:
      default: true
   gangland.command.grapple:
      default: true
   gangland.command.jetpack:
      default: true
   # Gang menus (W1-G): gang_stat / alliance_stat check these before opening. gang_info defaults to true (T-226) so
   # members open it again from /glw gang; its Open.Condition hands gangless players to the onboarding screen.
   gangland.inventory.gang_info:
      default: true
   gangland.inventory.gang_stat:
      default: true
   gangland.inventory.alliance_stat:
      default: true
   # One namespace for turf staff (TF-30): granting gangland.turf.admin grants every turf admin command.
   gangland.turf.admin:
      default: op
      children:
         gangland.command.turf.wand: true
         gangland.command.turf.pos1: true
         gangland.command.turf.pos2: true
         gangland.command.turf.create: true
         gangland.command.turf.delete: true
         gangland.command.turf.setowner: true
         gangland.command.turf.show: true
         gangland.command.turf.status: true
         gangland.command.turf.select: true
         gangland.command.turf.tp: true
         gangland.command.turf.income: true
         gangland.command.turf.garrison: true
         gangland.command.turf.buff: true
         gangland.command.turf.powerupnpc: true
         gangland.command.turf.rename: true
   # gt2 (0.19.0): new player verbs (map zoom/border, gang parity verbs, gang fights) and the owner verbs whose
   # rank gate (GangPermissions + gang_rules.yml Ranks.Minimum) now decides who may run them (CM-37, T-702).
   gangland.command.map.zoom:
      default: true
   gangland.command.map.border:
      default: true
   gangland.command.gang.ally.pvp:
      default: true
   gangland.command.gang.chat.allies:
      default: true
   gangland.command.gang.upgrade:
      default: true
   gangland.command.gang.upgrade.confirm:
      default: true
   gangland.command.gang.safehouse:
      default: true
   gangland.command.gang.safehouse.set:
      default: true
   gangland.command.gang.safehouse.remove:
      default: true
   gangland.command.gang.safehouse.list:
      default: true
   gangland.command.gang.rally:
      default: true
   gangland.command.gang.rally.join:
      default: true
   gangland.command.gang.pvp:
      default: true
   gangland.command.gang.notice:
      default: true
   gangland.command.gang.ranking:
      default: true
   gangland.command.gang.profile:
      default: true
   gangland.command.gang.fight:
      default: true
   gangland.command.gang.fight.propose:

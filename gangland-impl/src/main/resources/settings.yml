# +-------------+ #
# | User Config | #
# +-------------+ #
User:
   # The user balance account config
   Account:
      # On Player Join his default account will have the amount of money that you set.
      Initial_Balance: 0
      # The maximum amount of money the player can have.
      Maximum_Balance: 10_000_000
   # The user bank account config
   Bank:
      # When a player creates a bank account, his account will have the amount of money that you set.
      Initial_Balance: 0
      # When a player wants to create a bank account, they're required to pay a fee.
      # Set it to zero, and the requirement is lifted.
      Create_Cost: 5_000
      # Charged (from cash) every time the player renames their account at a Banker NPC. 0 disables.
      Rename_Fee: 1_000
      # Length of the rolling window (seconds) after which the deposit counter resets. Defaults to 24h.
      # Measured from the player's first interaction within a window — not midnight — so splitting a transaction
      # across midnight never counts against two separate windows.
      # Maximum balance, daily deposit limit, interest rate, death-loss discount, and weekly / monthly loan
      # amounts are all per-tier now — see plugin/npc/bank_tiers.yml.
      Reset_Period_Seconds: 86_400
   # The user level config
   Level:
      # The maximum level the player can have.
      Maximum_Level: 100
      # The base amount to be used in calculation.
      Base_Amount: 1_000

      # This formula is used to calculate the levels linearly.
      # It is possible to use mathematical functions; such as
      # [neg: negation of the expression, logb: log base of x for y; logb(x, y), sin: sine function, etc...]
      # Treat this string as a scientific calculator

      # There are only four variables that can be used for the formula
      # [base: base amount, max: maximum level, level: current level, experience: current experience]
      Formula: "base * level ^ 1.5"
      Skill:
         Upgrade: 1
         Cost: 500
         Formula: "base * level ^ 1.8"
   # When the user dies
   Death:
      Enable: true
      # Money-related configuration upon death
      Money:
         # Command used when the user dies
         Command:
            # If the command was enabled, it would ignore the [Lose_Money] option.
            Enable: false
            # The server executes all the executables.
            Executable:
               - "/glw eco withdraw %player% 20"
         # true = dying costs the formula amount below. false = dying costs nothing (no charge, no payout).
         # Use Command above for a payout.
         Lose_Money: true
         # The formula used when calculating the value to lose/gain.

         # There are only five variables that can be used for the formula
         # [balance: current balance, level: current level, experience: current experience, bounty: current
         #  withholding bounty, wanted: current wanted level]
         # Be careful that some values might be equal to zero
         Formula: "balance * 0.15"
         # The amount of money the user should at most have to not lose/gain money
         Threshold: 1_000
      Respawn:
         Enable: false
         # Seconds to wait before the player is respawned. Set to 0 for instant respawn.
         Delay: 10
         Screen:
            Enable: true
            Title: "&cWASTED"
            Subtitle: "&7Respawning after &a%time%"
         GameMode:
            # GameMode applied while the player waits to respawn.
            Change_To: "spectator"
            # Allow the player to fly while waiting to respawn so they can observe the scene.
            Allow_Fly: true
         Teleport:
            Enable: true
            Waypoint: "spawn"
         Health: 20
         Hunger: 20

# +---------------+ #
# | Bounty Config | #
# +---------------+ #
Bounty:
   # The smallest bounty a player may place with [/glw bounty set]. Set to 0 to disable the check.
   # Amounts of zero or less are always rejected, regardless of this value.
   Minimum: 0
   # true also pays the server-made notoriety part on a kill, as before 0.15.0.
   Pay_Notoriety: false
   Kill:
      # Each kill committed will be added on the total bounty amount.
      Each: 5
      # The maximum total amount after each kill committed.
      Maximum: 50_000
   # This option is only for users
   Repeating_Timer:
      Enable: true
      # Each time the timer gets to the [Time] value, it would multiply the current amount to the multiple.
      Multiple: 2
      Time: 300
      # The maximum total amount after each timer multiple.
      Maximum: 20_000

# +---------------+ #
# | Wanted Config | #
# +---------------+ #
Wanted:
   Enable: true
   # Money taken from a player each time one of their stars drops.
   Take_Money:
      # The on/off switch. Off by default, and a missing key counts as false.
      # Set to true to charge on every star drop.
      Enable: false
      # The price of one star drop. Variables you can use:
      #   amount     - the Amount below
      #   multiplier - the Multiplier below
      #   wanted     - the player's stars before this drop
      #   balance    - the player's wallet (never the bank)
      #   level      - the player's level
      #   experience - the player's current experience
      #   bounty     - the bounty on the player
      # Amount and Multiplier are only numbers for the formula.
      # They do not switch the charge on or off.
      # The default gives 50 * 5 ^ stars: $250 at 1 star, $156,250 at 5.
      # Gentler examples: "amount * wanted" or "balance * 0.02 * wanted".
      # A price of 0 charges nothing.
      # If the formula is broken, or its result is negative or not a number,
      # the console warns once and amount * multiplier ^ wanted is used
      # instead, never below 0.
      # The star always drops, and a wallet never goes below zero.
      Formula: "amount * multiplier ^ wanted"
      Amount: 50
      Multiplier: 5
   # A timer that reduces the wanted level after the specified time.
   Repeating_Timer:
      Enable: true
      # The default time to wait before reducing the wanted level.
      Time: 120
      # (time * amount ^ stars)
      Multiplier:
         Enable: true
         Amount: 1.1
   # Wanted level scaling.
   Level:
      Increment: 1
      Maximum: 5
   # Number of kills to get a wanted level.
   Kill_Combo:
      Enable: true
      # The time till the kill combo resets.
      Reset_After: 10
      # The kill counter to increment the wanted level.
      Kill_Counter:
         - 2
         - 5
         - 10
         - 15
         - 20

# +-------------+ #
# | Cops Config | #
# +-------------+ #
Cops:
   Count:
      # Set to true to evaluate the Formula string below instead of the linear Base/Per_Level/Max calculation.
      Formula_Enabled: false
      # Formula evaluated when Formula_Enabled is true.
      # Available variables: level, base, perLevel, max
      # Example: "base + (level - 1) * perLevel" (equivalent to the built-in linear formula)
      Formula: "base + (level - 1) * perLevel"
      # Cops at wanted level 1 (used for both the linear formula and as the 'base' variable)
      Base: 2
      # Additional cops per wanted level above 1 (used for both modes, exposed as 'perLevel')
      Per_Level: 1
      # Hard cap - result is always clamped to this value
      Max: 8

   # Core behavior values shared across all cop tiers.
   Behaviour:
      # Hard cap on the number of cop NPCs active per wanted player at any time.
      Max_Per_Player: 8
      # Game ticks between each AI evaluation cycle. Lower = faster reactions, higher CPU cost.
      AI_Tick_Rate: 10
      # Game ticks between each check that decides whether to spawn more cops.
      Spawn_Check_Rate: 40
      # Default radius within which a cop can attempt to cuff the target (blocks). Tiers may override this.
      Cuff_Radius: 3.0
      # How many cuff attempts a cop makes before giving up and switching to combat.
      Max_Cuff_Attempts: 3
      # Game ticks the cop waits between consecutive cuff attempts.
      Cuff_Cooldown_Ticks: 100
      # Sight range (blocks): a cop sees a wanted player within this distance when it has line of sight, and
      # every sighting is shared with the other cops chasing that player.
      Alert_Range: 40.0
      # Distance at which a MELEE cop may start an attack. Ranged cops fire at anything they can see within
      # Alert_Range. A swing lands only within Cops.Melee.Reach (cops.yml).
      Combat_Range: 4.0
      # Game ticks between melee attacks.
      Attack_Cooldown_Ticks: 20

   # Controls where cop NPCs spawn relative to the target player.
   Spawn:
      # Minimum distance from the player to spawn a cop (blocks).
      Min_Distance: 10.0
      # Maximum distance from the player to spawn a cop (blocks).
      Max_Distance: 50.0
      # Minimum ring distance used during phase-1 (preferred-ring, behind-player) spawn attempts (blocks).
      Phase1_Min_Distance: 30.0
      # Amount the ring radius shrinks per phase-2 iteration (blocks).
      Radius_Shrink_Step: 5.0
      # Vertical range searched above/below the player's Y level to find valid ground (blocks).
      Vertical_Search_Range: 10
      # Y-offset added to the player's Y when searching for spawn ground. 0 = same level as player.
      Y_Offset: 0
      # Minimum number of open horizontal sides required at a spawn position.
      Min_Open_Sides: 2
      # Radius within which a registered cop spawner is preferred over a random position (blocks).
      Spawner_Preference_Radius: 80.0
      # Distance within which another player triggers the visibility check during despawn (blocks).
      Visibility_Check_Distance: 48.0
      # Number of attempts in phase-1 (preferred ring, behind-player) of spawn location selection.
      Phase1_Attempts: 20
      # Number of attempts per shrink step in phase-2 of spawn location selection.
      Phase2_Attempts: 15
      # Maximum |spawnY - playerY| allowed for a chosen spawn location (blocks). The vertical search
      # may scan further to locate ground (see Vertical_Search_Range) but the resulting position is
      # rejected if the cop ends up too far above or below the player — prevents cops from spawning
      # on a rooftop while the player is on the street, or vice-versa.
      Max_Y_Diff: 4.0
      # Maximum |spawnerY - playerY| allowed when picking a registered cop spawner (blocks). Filters
      # out spawners whose Y is too far from the player so the spawned cop can plausibly path to them.
      # Generous default so a roof-vs-ground-floor pair both apply, but a tower 25+ blocks above the
      # street is excluded.
      Spawner_Max_Y_Diff: 16.0

   # Controls when a pursuing cop gives up chasing its target and transitions to RETURNING.
   # Acts as a final-fallback leash so stuck/unreachable cops don't occupy the per-player cap forever.
   Pursuit:
      # Distance from the target (blocks) beyond which the pursuing cop gives up.
      Max_Distance: 80.0
      # AI ticks a pursuing cop may stay stuck while no cop chasing the same player can see them before it gives up
      # (the spawner replaces it). Ticks where it moves or anyone sees the player reset the count.
      # Default 120 = ~60 s at AI_Tick_Rate: 10 (10 game ticks per AI tick, 20 TPS).
      Max_Ticks: 120

   # Controls how a cop returns to its station and despawns after the target is detained.
   Return:
      # Maximum AI ticks the cop waits before being force-despawned. (600 = ~300 s at the default AI_Tick_Rate: 10)
      # A cop whose way back to the station has no route despawns sooner, after Cops.Stuck.Recycle_Seconds.
      Max_Ticks: 600
      # Distance to the station at which the cop considers itself arrived and attempts to despawn (blocks).
      Station_Arrival_Distance: 3.0

# +-------------------+ #
# | Detainment Config | #
# +-------------------+ #
Detainment:
   Jail:
      # The maximum capacity of jail inmates a jail can hold
      Max_Capacity: 10
   # After a cop successfully handcuffs a player, the cop stays in GUARDING state
   # next to the player. When the delay expires (or the player dies), the player
   # is teleported to the nearest non-full jail, their inventory is seized, and
   # they are given a Jail Paperwork item that opens the bail/bribe/sentence GUI.
   Transit:
      # Ticks between the cuff landing and the auto-teleport to jail. 400 = 20 seconds.
      Delay_Ticks: 400
      # Radius (blocks) the guarding cop tries to stay within the cuffed player.
      Guard_Radius: 5.0
   # While handcuffed, the player can spam the Sneak key to fill a break-free meter. If they reach the required
   # number of taps before the reset window runs out the cuffs come off and they run free — wanted level stays, so
   # cops will re-engage on the next AI tick.
   Break_Free:
      # Total sneak taps needed within the window to break out.
      Taps_Required: 25
      # Ticks of inactivity that reset the counter back to zero (20 ticks = 1 second).
      Reset_Window_Ticks: 40
   # While handcuffed, right-clicking the guarding cop opens a small GUI with a
   # "Bribe" button. Cost is debited from the player's balance; no money item
   # needs to be in hand. The money.yml variation closest to the cost is shown
   # as the button icon.
   Handcuff_Bribe:
      Base_Cost: 500.0
      Per_Wanted_Level: 250.0
   # Once jailed, "Pay Bail" on the Jail Paperwork item releases the player
   # immediately for this cost. Balance-based.
   Bail:
      Base_Cost: 2_500.0
      Per_Wanted_Level: 1_000.0
   # "Bribe Officer" on the Jail Paperwork item is cheaper than bail but rolls
   # a chance. On failure the money is still consumed and the sentence timer is
   # extended by Fail_Penalty_Seconds.
   Jail_Bribe:
      Base_Cost: 1_000.0
      Per_Wanted_Level: 500.0
      Success_Chance: 0.35
      Fail_Penalty_Seconds: 60
   # "Serve Sentence" closes the GUI and counts down. Sentence length is based
   # on the player's wanted level at arrest time. Expires -> automatic release.
   Sentence:
      Base_Seconds: 180
      Per_Wanted_Level_Seconds: 60
   # Waypoint used when a jail has no explicit exit location configured via
   # /glw jail setexit. Resolved through the existing Waypoint
   Fallback_Exit_Waypoint: spawn
   # Sound names played at key detainment moments.
   Sounds:
      Bail_Success: BLOCK_NOTE_BLOCK_PLING
      Bribe_Success: ENTITY_VILLAGER_YES
      Bribe_Fail: ENTITY_VILLAGER_NO
      Transit_Commit: BLOCK_IRON_DOOR_CLOSE
      Sentence_Complete: BLOCK_BELL_USE

# +-------------+#
# | Gang Config |#
# +-------------+#
Gang:
   Enable: true
   # Allow duplicating gang names.
   Name_Duplicates: false
   Display_Name_Char: '*'
   # Hierarchy of ranks
   Rank:
      # The initial rank
      Head: "member"
      # The final rank
      Tail: "owner"
   Account:
      # When a player creates a gang account, his account will have the amount of money that you set.
      Initial_Balance: 0
      # When a player wants to create a gang account, they are required to pay a fee.
      # Set it to zero, and the requirement is lifted.
      Create_Cost: 100_000
      # Sets the maximum gang money.
      Maximum_Balance: 100_000_000_000
      # The total amount of money deposit for 1 contribution.
      # ex: deposit $1 -> 0.001
      # ex: deposit $1000 -> 1
      Contribution_Rate: 1_000

# +----------------+ #
# | Economy Config | #
# +----------------+ #

# [Money_Symbol] used as %money_symbol% prefix.
Money_Symbol: '$'
Balance_Format:
   Enable: true
   Format: "%,.2f"

# +--------------------+ #
# | Money Drop Config  | #
# +--------------------+ #
# Master switch for the cash item drop system. Variations, weights, and the
# per-source rules live in money.yml. When this flag is false, no entity drops
# money and the right-click / pickup handlers become inert.
Money_Drop:
   Enabled: true

# +-----------------+ #
# | Gadgets Config  | #
# +-----------------+ #
Gadgets:
   Jetpack:
      # Ticks of continuous thrust to ramp from 10% to 100% ascend power.
      Thrust_Ramp_Ticks: 20
      # Downward acceleration added per tick while descending (m/tick²).
      Descent_Accel: 0.022
      # Terminal descent speed — descent will not exceed this (negative = downward).
      Max_Descent_Speed: -0.5
      # Horizontal speed delta added per tick when a directional key is held (m/tick).
      Horiz_Influence: 0.03
      # Maximum horizontal speed while airborne (m/tick).
      Max_Horiz_Speed: 0.25
   Car:
      # Fraction of max speed used when reversing (0.5 = half max speed).
      Reverse_Speed_Ratio: 0.5
      # Multiplier applied to deceleration when the driver hard-brakes (sneak key).
      Hard_Brake_Multiplier: 3.0
      # Fuel units consumed per tick while the car is moving.
      Fuel_Consume_Per_Tick: 1

# +------+ #
# | Shop | #
# +------+ #

# Generic shop-admin knobs shared by every shop integration (the /glw shop admin editor and any module's own
# browser, e.g. the trader NPC). Trader/Banker NPC-specific knobs moved to module-owned YAML in WS4 G1a
# (npc/trader_settings.yml, npc/banker_settings.yml, shipped inside modules/gangland-npc-shops-<rev>.jar).
Shop:
   # Upper cap on the multiplier used by the shop price-editor's +/- buttons (via the custom-mode anvil).
   Max_Mode_Multiplier: 1000000

# The Turf: block (income, wand, outline, capture, sounds, contribution) moved to the turf module's own
# plugins/Gangland_Warfare/turf/turf_settings.yml in 0.15.1. A Turf: block left here is still honoured for now.
# Rewrites legacy weapon/ammo/wearable sign headers onto the generic item-buy / item-sell pair, so a sign placed
# before this stream keeps working once Bartizan is installed and publishes the matching item vocabulary. Each
# value is "<new sign key>:<line-3 definition prefix>".
Signs:
   Legacy_Aliases:
      Weapon_Buy: "item-buy:weapon"
      Weapon_Sell: "item-sell:weapon"
      Ammo_Buy: "item-buy:ammo"
      Ammo_Sell: "item-sell:ammo"
      Wearable_Buy: "item-buy:wearable"
      Wearable_Sell: "item-sell:wearable"

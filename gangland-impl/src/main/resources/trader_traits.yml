#
# Trader personality catalogue.
#
# Each top-level key is a trait id; the full field set (defined in the
# TraderTraitProfile record) is required for the trait to load. Mood is
# positive-only — trader accidents are forgotten, not punished.
#
# - Mood_Per_Tip_Currency     mood gain per currency unit spent on a tip
# - Mood_Per_Purchase         mood gain on a successful buy
# - Min_Friend_Discount       price multiplier at mood = +1 (e.g. 0.9 = 10% off)
# - Allows_Barter             whether the trader accepts item-for-item barters
# - Sell_Price_Ratio          fraction of ask the trader pays when BUYING from the player
# - Barter_Price_Ratio        fraction credited per item when the player offers it as BARTER
#                             (1.0 = item barter-value matches its admin price; >1 = trader is generous,
#                             <1 = trader undervalues incoming barter). Defaults to Sell_Price_Ratio if absent.
# - Max_Health                the trader's max health in half-hearts (20 = 10 hearts, vanilla default)
# - Invulnerable              if false, trader can be killed
#
# Add as many custom traits as you want — just define all fields under
# a new top-level id and reference it with `/glw trader create <shop> <id>`.


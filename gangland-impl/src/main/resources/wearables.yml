#   +------------------------------------------------------+   #
#
# Each entry defines a custom armor piece that integrates with the damage pipeline.
# Items are identified in-game by a hidden NBT tag embedded when built via API.
#
# Permission nodes are derived automatically as "gangland.wearables.<key>"
# (e.g. police_vest → gangland.wearables.police_vest).
#
# Fields:
#   Material            - Bukkit material name; must be an armor type
#   Custom_Model_Data   - optional resource-pack model id (0 = no override)
#   Name                - display name (supports & color codes)
#   Base_Damage_Reduction - flat damage reduction per piece (0.0–1.0, e.g. 0.10 = 10%)
#   Leather_Color       - hex color string ("#RRGGBB") for leather armor; leave blank otherwise
#   Lore                - list of lore lines
#   Traits:             - optional trait section; values are capped to each trait's max level
#     REINFORCED        - flat damage reduction (5% per level, max 4)
#     BULLETPROOF       - extra projectile reduction (4% per level, max 3)
#     PADDED            - extra explosion reduction (8% per level, max 2)
#     TOUGHENED         - reduces critical hit bonus damage (10% per level, max 3)
#     FIRE_RESISTANT    - reduces fire ticks applied (25% per level, max 2)
#     REACTIVE          - chance to nullify an incoming hit entirely (2% per level, max 3)
#     LIGHTWEIGHT       - cosmetic only, no combat effect (max 2)
#
# Note: vanilla enchantments (PROTECTION, PROJECTILE_PROTECTION, FIRE_PROTECTION,
# BLAST_PROTECTION) are also respected automatically - they do not need to be listed here.

police_vest:
